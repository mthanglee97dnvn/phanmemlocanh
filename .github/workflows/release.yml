name: Release Setup

on:
  workflow_run:
    workflows: ["Build MTHANGLEE PhotoSift Setup"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Tải file cài từ lần build vừa xong
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --dir out

      - name: Tạo bản phát hành
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.workflow_run.head_commit.message }}
          TAG: v1.1.${{ github.event.workflow_run.run_number }}
        run: |
          exe=$(find out -name '*.exe' | head -1)
          test -n "$exe"
          gh release create "$TAG" "$exe" --repo "${{ github.repository }}" --title "$TAG" --notes "$NOTES"
