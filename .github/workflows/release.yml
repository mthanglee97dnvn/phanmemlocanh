name: Release Setup

on:
  workflow_run:
    workflows: ["Build MTHANGLEE PhotoSift Setup"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    # vẫn phát hành bản Windows (và bản Mac nào build được) khi một máy build Mac bị GitHub huỷ do hết máy
    if: github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn (để đọc ghi chú phát hành cho người dùng)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Tải file cài từ lần build vừa xong
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --dir out

      - name: Tạo bản phát hành
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: v1.1.${{ github.event.workflow_run.run_number }}
        run: |
          exe=$(find out -name '*.exe' | head -1)
          test -n "$exe"
          dmgs=$(find out -name '*.dmg')   # bản macOS (nếu build được) — đi kèm cùng bản phát hành
          echo "Windows: $exe"; echo "macOS: $dmgs"
          # Ghi chú phát hành dành cho NGƯỜI DÙNG: lấy từ WHATSNEW.txt (sạch, chuyên nghiệp),
          # không dùng nội dung commit. Thiếu file thì dùng thông báo chung.
          if [ -s WHATSNEW.txt ]; then
            NF=WHATSNEW.txt
          else
            printf 'Phiên bản này cải thiện độ ổn định và sửa một số lỗi.\n\nCảm ơn bạn đã sử dụng MThanglee Cull & Collage.\n© Lê Minh Thắng — MTHANGLEE STUDIO\n' > _notes.txt
            NF=_notes.txt
          fi
          RELREPO="${{ github.repository_owner }}/cullcollage-releases"
          if gh release view "$TAG" --repo "$RELREPO" >/dev/null 2>&1; then
            echo "Release $TAG đã có → bổ sung/ghi đè file cài (dùng khi build lại để thêm nền còn thiếu, vd arm64)"
            gh release upload "$TAG" "$exe" $dmgs --repo "$RELREPO" --clobber
          else
            gh release create "$TAG" "$exe" $dmgs --repo "$RELREPO" --title "$TAG" --notes-file "$NF"
          fi
