name: Build MTHANGLEE PhotoSift Setup

# Chỉ build bản WINDOWS ở GitHub. Hai bản macOS (chip Apple arm64 + chip Intel) build bên Codemagic
# (xem codemagic.yaml) rồi tự đăng cùng bản phát hành. release.yml sẽ tạo release với file .exe này.

on:
  workflow_dispatch:      # bấm tay: Actions > Build > Run workflow
  push:
    branches: [main]
    paths-ignore:              # sửa cấu hình CI không cần build lại app
      - 'codemagic.yaml'
      - '.github/workflows/release.yml'

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_WIN_CERT: ${{ secrets.WIN_CERT_PFX_B64 != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Cài thư viện Python
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow "opencv-contrib-python>=4.8" rawpy pillow-heif pyinstaller certifi onnxruntime
          pip install nuitka ordered-set zstandard   # biên dịch lõi sang mã máy
          npm i --no-save javascript-obfuscator@4.1.1   # làm rối giao diện

      - name: Tải model nhận diện (đóng gói sẵn để cài offline)
        run: |
          mkdir -p app/models
          curl -fL --retry 3 -o app/models/yunet.onnx \
            https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          curl -fL --retry 3 -o app/models/sface.onnx \
            https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx
          curl -fL --retry 3 -o app/models/lbfmodel.yaml \
            https://raw.githubusercontent.com/kurnianggoro/GSOC2017/master/data/lbfmodel.yaml
          curl -fL --retry 3 -o app/models/ferplus.onnx \
            https://media.githubusercontent.com/media/onnx/models/main/validated/vision/body_analysis/emotion_ferplus/model/emotion-ferplus-8.onnx
          test $(stat -c %s app/models/ferplus.onnx) -gt 1000000
          # Phân loại cảnh (CLIP) — tuỳ chọn: tải nếu đã host, không có thì bỏ qua (tính năng tự tắt)
          curl -fL --retry 3 -o app/models/clip_vision.onnx https://github.com/mthanglee97dnvn/cullcollage-releases/releases/download/models/clip_vision.onnx || echo "(chưa có clip_vision.onnx - bỏ qua)"
          curl -fL --retry 3 -o app/models/clip_text.npz   https://github.com/mthanglee97dnvn/cullcollage-releases/releases/download/models/clip_text.npz   || echo "(chưa có clip_text.npz - bỏ qua)"
          ls -la app/models
          test $(stat -c %s app/models/sface.onnx) -gt 1000000

      - name: Build lõi đã bảo vệ (giao diện làm rối + nhúng, lõi biên dịch mã máy bằng Nuitka, đóng gói PyInstaller)
        run: |
          python tools/build_core.py win
          ls dist/PhotoSiftCore | head

      - name: Kiểm tra gói đóng sẵn (selftest + chạy thử máy chủ)
        run: |
          set +e
          ./dist/PhotoSiftCore/PhotoSiftCore.exe --selftest
          export PHOTOSIFT_HOME="$(cygpath -w "$RUNNER_TEMP")\\psh"
          export PHOTOSIFT_APPDIR="$(cygpath -w "$PWD")\\app"
          export PHOTOSIFT_ONLINE=1 PYTHONUTF8=1
          echo "HOME=$PHOTOSIFT_HOME  APPDIR=$PHOTOSIFT_APPDIR"
          ls "$PHOTOSIFT_APPDIR/models"
          ./dist/PhotoSiftCore/PhotoSiftCore.exe --no-browser --port 8799 > smoke.log 2>&1 &
          OK=0
          for i in $(seq 1 40); do
            if [ -f "$RUNNER_TEMP/psh/running.json" ]; then OK=1; break; fi
            sleep 1
          done
          echo "---- smoke.log ----"
          cat smoke.log
          echo "---- hết log ----"
          taskkill //F //IM PhotoSiftCore.exe
          if [ "$OK" != "1" ]; then echo "May chu khong khoi dong duoc"; exit 1; fi
          echo "May chu khoi dong OK"

      - name: Biên dịch launcher và bộ gỡ cài đặt
        working-directory: build
        run: |
          (cd launcher && go build -ldflags "-H windowsgui -s -w" -o ../launcher.exe .)
          (cd uninstaller && go build -ldflags "-H windowsgui -s -w" -o ../uninstall.exe .)
          cp launcher.exe uninstall.exe installer/payload/

      - name: Ký số (tự bật khi đã khai báo chứng chỉ trong Secrets)
        if: env.HAS_WIN_CERT == 'true'
        env:
          WIN_CERT_PFX_B64: ${{ secrets.WIN_CERT_PFX_B64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          echo "$WIN_CERT_PFX_B64" | base64 -d > cert.pfx
          ST=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | tail -1)
          for f in dist/PhotoSiftCore/PhotoSiftCore.exe build/installer/payload/launcher.exe build/installer/payload/uninstall.exe; do
            "$ST" sign //f cert.pfx //p "$WIN_CERT_PASSWORD" //fd sha256 //tr http://timestamp.digicert.com //td sha256 "$f"
          done
          rm -f cert.pfx

      - name: Tạo app.zip và bộ cài Setup.exe
        run: |
          python tools/package_app.py
          cd build/installer && go build -ldflags "-H windowsgui -s -w" -o ../../MTHANGLEE_PhotoSift_Setup.exe .
          ls -la ../../MTHANGLEE_PhotoSift_Setup.exe

      - name: Ký số bộ cài (tự bật khi đã khai báo chứng chỉ trong Secrets)
        if: env.HAS_WIN_CERT == 'true'
        env:
          WIN_CERT_PFX_B64: ${{ secrets.WIN_CERT_PFX_B64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          echo "$WIN_CERT_PFX_B64" | base64 -d > cert.pfx
          ST=$(ls "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | tail -1)
          "$ST" sign //f cert.pfx //p "$WIN_CERT_PASSWORD" //fd sha256 //tr http://timestamp.digicert.com //td sha256 MTHANGLEE_PhotoSift_Setup.exe
          rm -f cert.pfx

      - uses: actions/upload-artifact@v4
        with:
          name: MTHANGLEE_PhotoSift_Setup
          path: MTHANGLEE_PhotoSift_Setup.exe
          compression-level: 0
