# Codemagic — build CẢ HAI bản macOS cho Cull & Collage:
#   • macos-arm64 : chip Apple (M1–M4…) — build native trên máy chip Apple.
#   • macos-intel : chip Intel — build trên cùng máy chip Apple nhưng chạy qua Rosetta (arch -x86_64).
# Bản Windows do GitHub tự build (xem .github/workflows/build.yml) và tạo bản phát hành trước;
# hai workflow dưới đây tự lấy đúng số phiên bản của bản phát hành mới nhất rồi ĐĂNG KÈM file .dmg.
#
# QUY TRÌNH PHÁT HÀNH:
#   1. Đẩy code lên GitHub → GitHub build Windows và tạo release v1.1.XX (kèm file .exe).
#   2. Vào Codemagic, bấm "Start new build" cho CẢ HAI workflow macos-arm64 và macos-intel
#      (để APP_VERSION = auto thì tự khớp bản mới nhất; hoặc gõ số cụ thể vd 1.1.84).
#   → Hai bản .dmg sẽ tự đăng vào đúng release đó. Trang cullcollage.com tự cập nhật.
#
# BẮT BUỘC: trong Codemagic → app → Environment variables, nhóm "release", thêm biến bí mật
#   GH_TOKEN = GitHub Personal Access Token có quyền Contents: Read and write cho repo cullcollage-releases.

definitions:
  mac_scripts: &mac_scripts
    - name: Xác định phiên bản (khớp release theo đúng commit — không chờ thừa)
      script: |
        set -e
        V="$APP_VERSION"
        # Gõ số cụ thể (vd 1.1.84) thì dùng luôn, không dò.
        if [ -n "$V" ] && [ "$V" != "auto" ]; then
          echo "APP_VERSION=$V" >> "$CM_ENV"; echo "Dùng phiên bản chỉ định v$V"; exit 0
        fi
        [ -n "$GH_TOKEN" ] || { echo "Thiếu GH_TOKEN"; exit 1; }
        SHA=$(git rev-parse HEAD 2>/dev/null || echo "$CM_COMMIT")
        [ -n "$SHA" ] || { echo "Không xác định được commit đang build"; exit 1; }
        SHORT=$(printf '%.7s' "$SHA"); echo "Commit đang build: $SHA"
        # Tìm release trong RELREPO có dấu 'src:<commit này>' trong ghi chú (do release.yml gắn).
        find_tag () {
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$RELREPO/releases?per_page=30" \
          | python3 -c "import sys,json;sha=sys.argv[1];d=json.load(sys.stdin);d=d if isinstance(d,list) else [];print(next((r.get('tag_name','') for r in d if isinstance(r,dict) and sha in (r.get('body') or '')),''))" "$SHA"
        }
        TAG=""
        # Release của đúng commit này đã có thì dùng NGAY (bản xếp hàng thứ hai không phải chờ);
        # chưa có thì chờ bản Windows build + tạo release (tối đa ~30 phút).
        for i in $(seq 1 90); do
          TAG=$(find_tag)
          [ -n "$TAG" ] && { echo "Đã khớp release $TAG cho commit $SHORT"; break; }
          echo "  ...đang chờ bản Windows tạo release cho commit $SHORT ($i/90)"; sleep 20
        done
        [ -n "$TAG" ] || { echo "Chưa thấy release cho commit $SHORT — bản Windows đã build xong và gắn dấu commit chưa?"; exit 1; }
        V="${TAG#v}"
        echo "APP_VERSION=$V" >> "$CM_ENV"
        echo "Build macOS $LABEL cho phiên bản v$V"
    - name: Cài Python 3.12 (python.org, universal2)
      script: |
        set -e
        curl -fL --retry 3 -o py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
        sudo installer -pkg py.pkg -target /
    - name: Cài thư viện (đúng chip $LABEL)
      script: |
        set -e
        RUNPY="$PY"; [ "$ARCH" = "x86_64" ] && RUNPY="arch -x86_64 $PY"
        $RUNPY -m venv "$CM_BUILD_DIR/venv"
        VRUN="$CM_BUILD_DIR/venv/bin/python"; [ "$ARCH" = "x86_64" ] && VRUN="arch -x86_64 $CM_BUILD_DIR/venv/bin/python"
        echo "VRUN=$VRUN" >> "$CM_ENV"
        $VRUN -m pip install --upgrade pip
        # OpenCV 4.8+ mới đọc được model YuNet 2023; <4.11 là bản cuối còn hỗ trợ macOS 11.
        $VRUN -m pip download --only-binary=:all: --platform "macosx_11_0_${ARCH}" --python-version 3.12 \
          -d wh "opencv-contrib-python>=4.8,<4.11" "numpy<2" rawpy pillow pillow-heif
        ls wh
        $VRUN -m pip install --no-index --find-links wh opencv-contrib-python numpy rawpy pillow pillow-heif
        $VRUN -m pip install pyinstaller pywebview certifi nuitka ordered-set zstandard
        npm i --no-save javascript-obfuscator@4.1.1
        $VRUN -c "import cv2, numpy, platform; print('kien truc', platform.machine(), '| opencv', cv2.__version__, '| numpy', numpy.__version__)"
    - name: Tải model nhận diện
      script: |
        set -e
        mkdir -p app/models
        curl -fL --retry 3 -o app/models/yunet.onnx   https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
        curl -fL --retry 3 -o app/models/sface.onnx   https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx
        curl -fL --retry 3 -o app/models/lbfmodel.yaml https://raw.githubusercontent.com/kurnianggoro/GSOC2017/master/data/lbfmodel.yaml
        curl -fL --retry 3 -o app/models/ferplus.onnx https://media.githubusercontent.com/media/onnx/models/main/validated/vision/body_analysis/emotion_ferplus/model/emotion-ferplus-8.onnx
        test $(wc -c < app/models/sface.onnx) -gt 1000000
        test $(wc -c < app/models/ferplus.onnx) -gt 1000000
    - name: Đóng gói .app (ký ad-hoc, bắt buộc với chip Apple)
      script: |
        set -e
        VER="$APP_VERSION"
        printf '{"version": "%s", "repo": "%s"}' "$VER" "$RELREPO" > version.json
        MACOSX_DEPLOYMENT_TARGET=11.0 $VRUN tools/build_core.py mac
        P="dist/$APP.app/Contents/Info.plist"
        plutil -replace NSAppTransportSecurity -json '{"NSAllowsLocalNetworking": true, "NSAllowsArbitraryLoadsInWebContent": true}' "$P"
        plutil -replace NSHighResolutionCapable -bool YES "$P"
        plutil -replace CFBundleDisplayName -string "MThanglee Cull&Collage" "$P"
        plutil -replace CFBundleShortVersionString -string "$VER" "$P"
        plutil -replace CFBundleVersion -string "$VER" "$P"
        plutil -replace LSMinimumSystemVersion -string "11.0" "$P"
        codesign --force --deep --sign - "dist/$APP.app"
        du -sh "dist/$APP.app"
    - name: Kiểm tra nhanh (máy chủ khởi động được)
      script: |
        set -e
        BIN="dist/$APP.app/Contents/MacOS/$APP"
        "$BIN" --selftest | tee st.txt
        grep -q "webview ok" st.txt
        export PHOTOSIFT_HOME="$CM_BUILD_DIR/psh"
        "$BIN" --no-browser > smoke.log 2>&1 &
        OK=0; for i in $(seq 1 150); do [ -f "$PHOTOSIFT_HOME/running.json" ] && { OK=1; break; }; sleep 1; done
        cat smoke.log; pkill -f "Contents/MacOS/$APP" || true
        [ "$OK" = 1 ] || { echo "May chu khong khoi dong duoc"; exit 1; }
        echo "OK"
    - name: Tạo file cài .dmg
      script: |
        set -e
        VER="$APP_VERSION"
        rm -rf dmg; mkdir -p dmg
        cp -R "dist/$APP.app" dmg/
        ln -s /Applications dmg/Applications
        cp legal/DIEU_KHOAN_SU_DUNG.txt "dmg/Dieu khoan su dung.txt" 2>/dev/null || true
        DMG="MThanglee_CullCollage-${VER}-macos-${LABEL}.dmg"
        for t in 1 2 3 4 5; do
          hdiutil create -volname "MThanglee Cull&Collage" -srcfolder dmg -ov -format UDZO "$DMG" && break
          hdiutil detach -force "/Volumes/MThanglee Cull&Collage" 2>/dev/null || true
          sleep 15; [ "$t" = 5 ] && { echo "hdiutil that bai"; exit 1; }
        done
        echo "DMG=$DMG" >> "$CM_ENV"
        ls -la "$DMG"
    - name: Đăng .dmg lên GitHub release
      script: |
        set -e
        [ -n "$GH_TOKEN" ] || { echo "Khong co GH_TOKEN -> .dmg nam o Artifacts, tai tay roi dua len release"; exit 0; }
        VER="$APP_VERSION"
        REL=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$RELREPO/releases/tags/v$VER")
        RID=$(printf '%s' "$REL" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
        [ -n "$RID" ] || { echo "Khong thay release v$VER tren $RELREPO (cho ban Windows tao release truoc)"; exit 1; }
        # xoa asset cung ten (neu co) roi tai len ban moi
        printf '%s' "$REL" | python3 -c "import sys,json;[print(a['id']) for a in json.load(sys.stdin).get('assets',[]) if a['name']=='$DMG']" | while read aid; do
          [ -n "$aid" ] && curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$RELREPO/releases/assets/$aid"
        done
        curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/x-apple-diskimage" \
          --data-binary @"$DMG" \
          "https://uploads.github.com/repos/$RELREPO/releases/$RID/assets?name=$DMG" | python3 -c "import sys,json;d=json.load(sys.stdin);print('Da dang:', d.get('browser_download_url','(loi) '+json.dumps(d)[:200]))"

workflows:
  macos-arm64:
    name: macOS arm64 (Apple Silicon)
    instance_type: mac_mini_m2
    max_build_duration: 90
    triggering:               # tự chạy mỗi khi đẩy code lên nhánh main
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    when:                     # bỏ qua khi lần đẩy chỉ sửa cấu hình CI (không tạo bản phát hành mới)
      changeset:
        excludes:
          - 'codemagic.yaml'
          - '.github/workflows/release.yml'
    environment:
      groups:
        - release          # chứa GH_TOKEN
      vars:
        APP: "MThanglee CullCollage"
        PY: "/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12"
        RELREPO: "mthanglee97dnvn/cullcollage-releases"
        APP_VERSION: "auto"       # auto = theo bản phát hành mới nhất; hoặc gõ số cụ thể vd 1.1.84
        ARCH: "arm64"
        LABEL: "arm64"
      node: 20
    scripts: *mac_scripts
    artifacts:
      - "*.dmg"

  macos-intel:
    name: macOS Intel (qua Rosetta)
    instance_type: mac_mini_m2
    max_build_duration: 90
    triggering:               # tự chạy mỗi khi đẩy code lên nhánh main
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    when:                     # bỏ qua khi lần đẩy chỉ sửa cấu hình CI (không tạo bản phát hành mới)
      changeset:
        excludes:
          - 'codemagic.yaml'
          - '.github/workflows/release.yml'
    environment:
      groups:
        - release
      vars:
        APP: "MThanglee CullCollage"
        PY: "/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12"
        RELREPO: "mthanglee97dnvn/cullcollage-releases"
        APP_VERSION: "auto"
        ARCH: "x86_64"
        LABEL: "intel"
      node: 20
    scripts: *mac_scripts
    artifacts:
      - "*.dmg"
