<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>MThanglee Cull&amp;Collage</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0a1a2e;color:#f4f8ff;font:13px/1.4 "Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;overflow:hidden}
#shell{display:grid;grid-template-rows:38px minmax(0,1fr);height:100%}
#mode{display:flex;align-items:center;gap:6px;padding:0 12px;background:#0a1a2e;border-bottom:1px solid #24405f}
#mode img{height:22px;width:auto;margin-right:8px}
#mode button{background:none;border:0;border-bottom:2px solid transparent;color:#a9c0da;font:inherit;font-weight:600;height:38px;padding:0 14px;cursor:pointer}
#mode button:hover{color:#fff}
#mode button[aria-selected=true]{color:#fff;border-bottom-color:#ffa31a}
#mode button:focus-visible{outline:2px solid #ffa31a;outline-offset:-3px}
#mode kbd{font:11px Consolas,monospace;color:#a9c0da;margin-left:6px}
#mode .sp{flex:1}
#mode #tName{font-weight:600;color:#a9c0da;font-size:12.5px;white-space:nowrap}
#mode #tLic{height:26px;padding:0 10px;border:1px solid #24405f;border-radius:13px;color:#a9c0da;font-weight:500;font-size:12px}
#mode #tLic.warn{color:#ffb74d;border-color:#ffa31a}
dialog{background:#0d2238;color:#f4f8ff;border:1px solid #24405f;border-radius:10px;padding:18px;width:min(480px,calc(100vw - 24px))}
dialog::backdrop{background:#000a}
dialog h2{font-size:17px;margin:0 0 10px}
dialog dl{display:grid;grid-template-columns:96px 1fr;gap:5px 10px;margin:0 0 12px;font-size:13px}
dialog dt{color:#a9c0da}dialog dd{margin:0;font-family:Consolas,monospace;word-break:break-all}
dialog textarea{width:100%;min-height:74px;background:#071a30;color:#f4f8ff;border:1px solid #24405f;border-radius:6px;padding:7px;font:12px Consolas,monospace}
dialog .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
dialog button{background:#163350;color:#f4f8ff;border:1px solid #2b4d70;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
dialog button.pri{background:#ffa31a;border-color:#ffa31a;color:#241200;font-weight:700}
dialog button.dg{color:#ff9d9b}
#licErr{color:#ff9d9b;font-size:12.5px;min-height:18px;margin-top:6px}
#stage{position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden}
iframe.on{visibility:visible}
</style>
</head>
<body>
<div id="shell">
  <nav id="mode" role="tablist" aria-label="Chế độ làm việc">
    <img src="/logo.png" alt="MTHANGLEE STUDIO">
    <button role="tab" id="tFilter" aria-selected="true">Lọc ảnh<kbd>Ctrl+1</kbd></button>
    <button role="tab" id="tLayout" aria-selected="false">Dàn trang<kbd>Ctrl+2</kbd></button>
    <span class="sp"></span><span id="tName">MThanglee Cull&amp;Collage</span>
    <button id="tLic" title="Thông tin bản quyền"></button>
  </nav>
  <div id="stage">
    <iframe id="fFilter" class="on" src="/filter" title="Lọc ảnh"></iframe>
    <iframe id="fLayout" src="/layout" title="Dàn trang" allow="local-fonts; clipboard-read; clipboard-write"></iframe>
  </div>
</div>
<dialog id="licDlg">
  <h2>Bản quyền</h2>
  <dl><dt>Trạng thái</dt><dd id="lState"></dd><dt>Mã máy</dt><dd id="lMach"></dd></dl>
  <textarea id="lKey" placeholder="Dán key mới để gia hạn hoặc đổi key" aria-label="Key mới"></textarea>
  <div id="licErr" role="status"></div>
  <div class="btns"><button class="dg" id="lRemove">Gỡ key khỏi máy này</button><button id="lClose">Đóng</button><button class="pri" id="lGo">Kích hoạt key mới</button></div>
</dialog>
<script>
"use strict";
const f=document.getElementById('fFilter'),l=document.getElementById('fLayout'),a=document.getElementById('tFilter'),b=document.getElementById('tLayout');
window.PS={
  show(name){const on=name==='layout';l.classList.toggle('on',on);f.classList.toggle('on',!on);b.setAttribute('aria-selected',on);a.setAttribute('aria-selected',!on);(on?l:f).contentWindow.focus();
    if(on)try{l.contentWindow.dispatchEvent(new Event('resize'))}catch(e){}},
  layout(){return l.contentWindow.vuotBridge||null}};
a.onclick=()=>PS.show('filter');b.onclick=()=>PS.show('layout');
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&(e.key==='1'||e.key==='2')){e.preventDefault();PS.show(e.key==='1'?'filter':'layout')}});
const $=i=>document.getElementById(i),post=(u,b)=>fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json());
async function lic(){let s;try{s=await fetch('/api/license').then(r=>r.json())}catch(e){return}if(!s.ok){location.reload();return}
  const t=$('tLic'),low=!s.permanent&&s.days_left<=14;t.textContent=s.permanent?'Bản quyền vĩnh viễn':`Còn ${s.days_left} ngày`;t.classList.toggle('warn',low);
  $('lState').textContent=s.permanent?'Vĩnh viễn':`Đến ${s.expires}, còn ${s.days_left} ngày`;$('lMach').textContent=s.machine}
lic();setInterval(lic,600000);
$('tLic').onclick=()=>{$('licErr').textContent='';$('lKey').value='';$('licDlg').showModal()};$('lClose').onclick=()=>$('licDlg').close();
$('lGo').onclick=async()=>{const r=await post('/api/license/activate',{key:$('lKey').value});if(r.ok){$('licDlg').close();lic()}else $('licErr').textContent=r.reason};
let armed=false;$('lRemove').onclick=async e=>{if(!armed){armed=true;e.target.textContent='Bấm lần nữa để gỡ key';return}await post('/api/license/remove');location.reload()};
</script>
</body>
</html>
