<style>
:root{--tx:#f4f8ff;--mut:#a9c0da;--acc:#ffa31a;--acc2:#35c6ff;--red:#ef5350;--yel:#fbc02d;--grn:#43a047;--blu:#1e88e5;--pur:#ab47bc;--sz:150px;
  --panel:rgba(8,30,60,.46);--panel2:rgba(255,255,255,.13);--line:rgba(255,255,255,.24);--sel:rgba(53,198,255,.30);--inset:rgba(4,14,30,.58);--field:rgba(4,14,30,.45);
  --blur:blur(18px) saturate(150%);--r:22px;--shadow:0 10px 34px rgba(2,12,30,.35),inset 0 1px 0 rgba(255,255,255,.28);--modal:rgba(8,30,60,.82);
  --pri:linear-gradient(180deg,#ffc24a,#ff8a1f);--pri-tx:#2b1500;--pri-sh:0 4px 14px rgba(255,138,31,.45)}
html[data-theme=neutral]{--tx:#ECEEF2;--mut:#A1A8B4;--acc:#F2B01E;--acc2:#8DB8E8;--panel:#1E2127;--panel2:#2A2E36;--line:#383D47;--sel:rgba(141,184,232,.2);--inset:#101216;--field:#14161A;
  --blur:none;--r:10px;--shadow:none;--modal:#1E2127;--pri:#F2B01E;--pri-tx:#1A1405;--pri-sh:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0;color:var(--tx);font:13px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif;overflow:hidden}
body{background:
  radial-gradient(900px 620px at -6% -12%,rgba(255,140,52,.78),transparent 62%),
  radial-gradient(820px 620px at 106% 108%,rgba(255,176,24,.72),transparent 62%),
  radial-gradient(900px 700px at 82% -6%,rgba(40,200,255,.55),transparent 62%),
  linear-gradient(135deg,#071a30 0%,#0b3b66 46%,#1286c4 100%) fixed}
html[data-theme=neutral] body{background:#14161A}
#deco{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
html[data-theme=neutral] #deco{display:none}
#deco .cb{position:absolute;filter:drop-shadow(0 14px 18px rgba(2,12,30,.35))}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}
button:hover{border-color:rgba(255,255,255,.6);transform:translateY(-1px)}
button.pri{background:var(--pri);border-color:transparent;color:var(--pri-tx);font-weight:700;box-shadow:var(--pri-sh)}
button:disabled{opacity:.4;cursor:default;transform:none}
input[type=text],input[type=number],select{background:var(--field);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
select option{background:#0b2a4a;color:#fff}
input[type=range]{accent-color:var(--acc)}input[type=checkbox]{accent-color:var(--acc)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
#app{position:relative;z-index:1;display:grid;grid-template-rows:auto auto 1fr auto;height:100%;padding:12px 14px;gap:10px}
.glass,.bar,#side,#gridwrap,#status,#info{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.bar{display:flex;gap:8px;align-items:center;padding:8px 16px;flex-wrap:wrap;border-radius:999px}
.bar .sp{flex:1}
.bar{gap:6px}#fFilter{max-width:180px}#fSort{max-width:150px}#fSize{width:100px}
#prog{height:3px;margin:-6px 20px -4px;border-radius:3px;background:transparent;overflow:hidden}#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .3s}
#main{display:grid;grid-template-columns:230px 1fr 300px;min-height:0;gap:10px}
#main.noinfo{grid-template-columns:230px 1fr}

#side{overflow:auto;padding:12px 10px}
#side h3{margin:4px 6px 10px;color:var(--mut);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.9px;display:flex;justify-content:space-between;align-items:center}
.person{display:flex;gap:10px;align-items:center;padding:6px;border-radius:16px;cursor:pointer;border:1px solid transparent}
.person:hover{background:var(--panel2)}.person.on{background:var(--sel);border-color:var(--acc2)}
.person img{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#000;border:2px solid rgba(255,255,255,.55)}
.person .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}.person .c{color:var(--mut);font-size:11px;font-weight:400}
#gridwrap{overflow:auto;padding:12px;min-width:0;position:relative}
#grid{position:relative}   /* lưới ảo: ô định vị tuyệt đối, chỉ dựng ô đang nhìn thấy */
.cell{position:relative;border-radius:18px;border:1px solid rgba(255,255,255,.16);padding:5px;background:rgba(255,255,255,.09);cursor:default;user-select:none;transition:background .12s,border-color .12s}
.cell:hover{background:rgba(255,255,255,.16)}
.cell.sel{background:var(--sel);border-color:var(--acc2)}.cell.cur{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),0 6px 20px rgba(255,163,26,.35)}
.im{position:relative;aspect-ratio:1/1;background:var(--inset);border-radius:13px;overflow:hidden}
.im img{width:100%;height:100%;object-fit:contain;display:block}
.im.noimg{display:flex;align-items:center;justify-content:center}.im.noimg img{display:none}.im.noimg::after{content:'⚠';color:var(--mut);font-size:30px;opacity:.55}
.cell.rej .im img{opacity:.28;filter:grayscale(1)}
.cell .nm{font-size:11px;color:var(--mut);padding:5px 6px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab{position:absolute;left:0;top:0;bottom:0;width:6px}
.l-red{background:var(--red)}.l-yellow{background:var(--yel)}.l-green{background:var(--grn)}.l-blue{background:var(--blu)}.l-purple{background:var(--pur)}
.stars{position:absolute;left:10px;bottom:5px;color:#ffca28;text-shadow:0 1px 3px #000;font-size:13px;letter-spacing:1px}
.flags{position:absolute;right:5px;top:5px;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.chip{font-size:10px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(4,14,30,.72);color:#fff}
.chip.blur{background:#d9661a}.chip.dark{background:#4b647a}.chip.bright{background:#b8a01f}.chip.eyes{background:#8a47b0}.chip.away{background:#7A4A9E}.chip.dup{background:#0c9585}
.xmark{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:52px;color:var(--red);font-weight:700;pointer-events:none}
.cell.rej .xmark{display:flex}
.nface{position:absolute;right:6px;bottom:5px;font-size:10px;background:rgba(4,14,30,.7);padding:2px 7px;border-radius:999px}
#status{display:flex;gap:16px;padding:7px 18px;color:var(--mut);font-size:12px;border-radius:999px}
body.cat #app{visibility:hidden}
#catalog{display:none;position:fixed;inset:0;z-index:5;flex-direction:column;gap:12px;padding:14px 18px}
body.cat #catalog{display:flex}
#catalog .chead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
#catalog h2{font-size:16px;margin:0 8px 0 4px}
#catalog .chead .sp{flex:1}
#catQ{width:190px}
.cview{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:999px;background:var(--field)}
.cview button{border:0;background:none;padding:4px 11px;color:var(--mut)}
.cview button[aria-pressed=true]{background:var(--panel2);color:var(--tx)}
#catBody{flex:1;min-height:0;overflow:auto;padding:2px 4px 8px}
.cgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr))}
.cgrid.lg{--cw:340px}.cgrid.md{--cw:230px}.cgrid.sm{--cw:138px;gap:10px}
.ccard{position:relative;display:block;width:100%;text-align:left;padding:0;overflow:hidden;color:inherit;font:inherit;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r)*.7);cursor:pointer}
.ccard:hover{border-color:var(--acc);transform:none}
.ccard.cur{border-color:var(--acc2)}.ccard.gone .cov{opacity:.35}
.cov{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:2px;aspect-ratio:3/2;background:var(--inset);overflow:hidden}
.cov.n1{grid-template-columns:1fr}.cov.n2 img,.cov.n3 img:first-child{grid-row:span 2}
.cgrid.sm .cov{grid-template-columns:1fr;aspect-ratio:1}.cgrid.sm .cov img:not(:first-child){display:none}.cgrid.sm .cov img{grid-row:auto}
.cov img{width:100%;height:100%;min-height:0;object-fit:cover;display:block}
.cov .none{grid-column:1/-1;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--mut)}
.cinf{padding:9px 12px 11px;min-width:0}
.cgrid.sm .cinf{padding:6px 8px 7px}
.cinf b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgrid.sm .cinf b{font-size:12px}
.cinf span{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cgrid:not(.lg) .cinf .cpath,.cgrid.sm .cinf .cdate{display:none}
.cbadge{position:absolute;top:8px;left:8px;padding:1px 9px;border-radius:999px;background:rgba(4,14,30,.82);font-size:11px;color:#fff}
.cbadge.warn{background:var(--red)}
.cdel{position:absolute;top:6px;right:6px;width:26px;height:26px;padding:0;border-radius:50%;background:rgba(4,14,30,.82);color:#fff;font-size:12px;opacity:0}
.ccard:hover .cdel,.ccard:focus-within .cdel,tr:hover .cdel{opacity:1}
.ctable{width:100%;border-collapse:collapse;background:var(--panel);border-radius:calc(var(--r)*.5);overflow:hidden}
.ctable th{position:sticky;top:0;text-align:left;font-weight:600;color:var(--mut);padding:8px 10px;background:var(--modal);cursor:pointer;white-space:nowrap}
.ctable th.num,.ctable td.num{text-align:right}
.ctable td{padding:6px 10px;border-top:1px solid var(--line);white-space:nowrap}
.ctable .cn b{display:block;max-width:340px;overflow:hidden;text-overflow:ellipsis}
#lost{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);z-index:100;max-width:min(720px,92vw);padding:10px 16px;border-radius:8px;background:#5A1D1A;color:#FFE3E0;border:1px solid #A33A33;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.ctable tbody tr{cursor:pointer}.ctable tbody tr:hover{background:var(--panel2)}
.ctable tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--acc2)}
.ctable .cn{display:flex;align-items:center;gap:9px;min-width:0}
.ctable .cn img,.ctable .cn i{width:44px;height:32px;object-fit:cover;border-radius:4px;background:var(--inset);flex:none}
.ctable .cp{max-width:300px;overflow:hidden;text-overflow:ellipsis;color:var(--mut)}
.ctable .cdel{position:static;opacity:0;background:var(--panel2);color:var(--tx)}
.cnone{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mut);text-align:center}
#empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;height:100%;color:var(--mut);text-align:center}
#empty h2{color:var(--tx);margin:0;font-size:22px}
.back{position:fixed;inset:0;background:rgba(2,10,24,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--modal);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);border:1px solid var(--line);border-radius:26px;padding:22px;width:min(580px,94vw);max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25)}
.modal h3{margin:0 0 14px;font-size:17px}.row{display:flex;gap:10px;align-items:center;margin:9px 0}.row label{flex:0 0 150px;color:var(--mut)}.row input[type=range]{flex:1}.row .v{width:46px;text-align:right;font-variant-numeric:tabular-nums}
.modal .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.hint{color:var(--mut);font-size:12px}.ok{color:#8be3a0}.warn{color:#ffc15e}
.dirs{border:1px solid var(--line);border-radius:16px;height:260px;overflow:auto;background:var(--field)}
.dirs div{padding:7px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.07)}.dirs div:hover{background:var(--panel2)}
#viewer{--strip:116px;position:fixed;inset:0;background:linear-gradient(135deg,#040b16,#07213a 60%,#0a2f52);z-index:40;display:none;grid-template-columns:1fr 290px;grid-template-rows:minmax(0,1fr) auto}
#viewer.nostrip{--strip:0px}
#viewer.on{display:grid}
#vstage{position:relative;overflow:auto;display:flex;grid-row:1;grid-column:1;min-height:0}
#vinfo{grid-row:1;grid-column:2;min-height:0}
#vwrap{position:relative;margin:auto;line-height:0}
#vwrap img{display:block;cursor:zoom-in}
#vstage.zoom #vwrap img{max-width:none;max-height:none;cursor:grab}
#vstage{scrollbar-width:none}#vstage::-webkit-scrollbar{display:none}
#vstage.pan,#vstage.pan #vwrap img{cursor:grabbing}
#vzoom{align-self:center;font-size:12px;padding:3px 10px}
#strip{grid-row:2;grid-column:1/3;height:116px;background:rgba(0,0,0,.42);border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;position:relative}
#viewer.nostrip #strip{display:none}
#stripin{position:relative;height:100%}
.sc{position:absolute;top:6px;width:92px;height:102px;cursor:pointer;border-radius:8px;overflow:hidden;border:2px solid transparent;background:rgba(255,255,255,.05)}
.sc:hover{border-color:rgba(255,255,255,.35)}.sc.cur{border-color:#ffca28;background:rgba(255,202,40,.14)}
.sc img{width:100%;height:78px;object-fit:contain;display:block;background:rgba(0,0,0,.35)}
.sc .nm{font-size:10px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);padding:2px 2px 0}
.sc .rt{position:absolute;top:3px;left:3px;font-size:10px;font-weight:700;line-height:1;padding:2px 4px;border-radius:4px;background:rgba(0,0,0,.72);color:#ffca28;font-variant-numeric:tabular-nums}

#vrate.on{display:flex}#vrate.rej{color:#ff6b6b;font-size:14px;font-weight:600;letter-spacing:0}#vrate small{font-size:12px;color:#e8e8e8;letter-spacing:0;font-weight:600}
#vstage.zoom #vrate{display:none}
.sc .lb{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.sc.rej img{opacity:.3}.sc.rej:after{content:'✕';position:absolute;left:0;right:0;top:22px;text-align:center;color:#ff6b6b;font-size:26px;line-height:1}
.fbox{position:absolute;transform:translate(-50%,-100%);pointer-events:none;font-size:11px;line-height:1.6;white-space:nowrap;padding:0 7px;border-radius:999px;background:rgba(4,14,30,.72);color:#fff}
.fbox.shut{background:#ba68c8}
#vback{position:fixed;top:12px;left:14px;z-index:2;display:flex;gap:6px}
#vback button{background:rgba(4,14,30,.72);color:#fff;border-color:rgba(255,255,255,.28)}
#vbadge{position:fixed;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
#vbadge .chip{font-size:12px;padding:3px 11px}
#vbadge .chip.topdup{background:#c9921a;color:#1c1204}
#vinfo{background:var(--panel);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-left:1px solid var(--line);padding:16px;overflow:auto;line-height:1.6}
#vinfo h4{margin:0 0 4px;word-break:break-all}.kv{display:flex;justify-content:space-between;color:var(--mut)}.kv b{color:var(--tx);font-weight:500}
#vinfo .st{font-size:24px;color:#ffca28;cursor:pointer;letter-spacing:2px;margin:10px 0}
.lbtn{display:inline-block;width:22px;height:22px;border-radius:50%;margin-right:6px;cursor:pointer;border:2px solid transparent}.lbtn.on{border-color:#fff}
.kbd{font-family:ui-monospace,monospace;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:11px}

.hstat{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
.hs label{display:block;padding:3px 0;cursor:pointer}
#info{overflow:auto;padding:10px}
#vwrap #vmask{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;max-height:none;pointer-events:none;display:none;cursor:default}

:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

<div id="app">
  <div class="bar">
    <div class="grp"><button id="bCat" aria-label="Catalog" title="Xem các thư mục đã lọc"><svg class="ic" aria-hidden="true"><use href="#i-lib"/></svg><span class="lbl">Catalog</span></button><button id="bOpen" aria-label="Mở thư mục"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg><span class="lbl">Mở thư mục</span></button><label class="hint"><input type="checkbox" id="cRec" checked> gồm thư mục con</label></div>
    <div class="grp"><select id="fFilter" title="Lọc" aria-label="Lọc ảnh"></select><select id="fSort" title="Sắp xếp" aria-label="Sắp xếp">
      <option value="name">Tên file</option><option value="time">Thời gian chụp</option>
      <option value="score">Điểm chất lượng (cao trước)</option><option value="sharp">Độ nét (cao trước)</option><option value="smile">Nụ cười (tươi nhất trước)</option>
    </select><select id="fPair" title="Khi một ảnh có cả RAW và JPEG thì hiện bản nào" aria-label="Ưu tiên RAW hay JPEG">

      <div id="people"></div>

  </div>
  <div id="status"><span id="sCount"></span><span id="sProg" class="hint"></span><button id="sStack" title="Gộp mỗi nhóm ảnh trùng thành một ô (ảnh tốt nhất ở trên). Phím G để mở / thu gọn nhóm đang chọn"></button><button id="sAdv" title="Sau khi chấm sao, loại hoặc gắn nhãn một ảnh, tự chuyển sang ảnh kế tiếp"></button><span id="sSel"></span><span id="sCur"></span><span id="sNet" title="Nhấp để kiểm tra lại kết nối mạng" style="cursor:pointer"></span><label id="sSize" title="Cỡ ảnh trong lưới"><span class="hint">Cỡ ảnh</span><input type="range" id="fSize" min="100" max="320" value="150" aria-label="Cỡ ảnh trong lưới"></label></div>

  <div id="vback"><button id="vbGrid" title="Quay lại lưới ảnh (Esc)">← Lưới ảnh</button><button id="vbCat" title="Về Catalog thư mục"><svg class="ic" aria-hidden="true"><use href="#i-lib"/></svg>Catalog</button><span class="chip" id="vzoom" hidden></span></div>
  <div id="vstage"><div id="vwrap"><img id="vimg" alt=""><img id="vmask" alt=""><div id="vfaces"></div><div id="vrate" aria-live="polite"></div></div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FLAG = {blur:'Mờ', dark:'Tối', bright:'Sáng quá', eyes:'Nhắm mắt?', away:'Quay mặt?', dup:'Trùng'};
const SMILE_ON=0.6;   // điểm cười cả ảnh (0..1, trung bình theo cỡ mặt) từ mức này = "có nụ cười"
const LABEL_VI={red:'đỏ',yellow:'vàng',green:'xanh lá',blue:'xanh dương',purple:'tím'};
const LABELS = ['red','yellow','green','blue','purple'];
const LABEL_NAME = {red:'Đỏ',yellow:'Vàng',green:'Xanh lá',blue:'Xanh dương',purple:'Tím'};
const FILTERS = [['all','Tất cả'],['unrated','Chưa chấm'],['r1','★ 1+'],['r2','★★ 2+'],['r3','★★★ 3+'],['r4','★★★★ 4+'],['r5','★★★★★ 5'],
  ['rej','✕ Đã loại'],['norej','Không bị loại'],['issues','⚠ Có vấn đề (mọi loại)'],['blur','Mờ'],['dark','Tối'],['bright','Sáng quá'],['eyes','Nhắm mắt?'],['away','Có người quay mặt'],['smile','Có nụ cười'],['dup','Trùng lặp (bản kém hơn)'],
  ['best','Tốt nhất trong nhóm trùng'],['face','Có khuôn mặt'],['noface','Không có khuôn mặt'],['raw','Chỉ file RAW (ARW, CR2, NEF…)'],['jpg','Chỉ JPG / ảnh thường']];
const RAWRE=/\.(arw|srf|sr2|cr2|cr3|nef|nrw|dng|orf|raf|rw2|pef|srw|3fr|erf|kdc|mrw|x3f)$/i;
const S = {photos:[], viewFull:[], keep:new Set(), open:new Set(), stack:(()=>{ try{ return localStorage.getItem('ps_stack2')==='1'; }catch(e){ return false; } })(),   /* mặc định: ảnh trùng để riêng từng ô */ by:new Map(), view:[], people:[], sel:new Set(), cur:null, anchor:null, filter:'all', sort:'name', pair:'both', person:null,
           status:{}, undo:[], viewer:false, boxes:true, zoom:false, lastDone:-1, settings:{}};

async function api(path, body){
  let r;
  try{ r = await fetch(path, body===undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); }
  catch(e){ lostLink(); throw new Error('Mất kết nối với app. Hãy đóng cửa sổ rồi mở lại MThanglee Cull&Collage.'); }
  if(S.lost) linkBack();
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
/* mất kết nối với máy chủ (app bị tắt, đang cập nhật, máy ngủ): báo một dải cố định, tự ẩn khi nối lại */
function lostLink(){ if(S.lost) return; S.lost=true; const d=document.createElement('div'); d.id='lost'; d.setAttribute('role','alert');
  d.textContent='Mất kết nối với app, các thay đổi lúc này sẽ không được lưu. Nếu không tự nối lại, hãy đóng cửa sổ và mở lại app.'; document.body.appendChild(d); }
function linkBack(){ S.lost=false; const d=$('#lost'); if(d) d.remove(); toast('Đã kết nối lại'); }
addEventListener('unhandledrejection',e=>{ const m=e.reason&&e.reason.message; if(m){ toast(m,4000); e.preventDefault(); } });
function toast(msg, ms=2200){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none', ms); }
function pname(id){ const p = S.people.find(p=>p.id===id); return p && p.name ? p.name : 'Người '+id; }

/* ---------- modal ---------- */
function modal(html){
  const b = document.createElement('div'); b.className='back';
  b.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  const h=b.querySelector('h3'); if(h){ h.id='dlg'+Date.now(); b.firstChild.setAttribute('aria-labelledby',h.id); }
  b.addEventListener('mousedown', e=>{ if(e.target===b) b.remove(); });
  document.body.appendChild(b);
  setTimeout(()=>{ const q=x=>b.querySelector(x), f=q('[autofocus]')||q('input:not([type=range]):not([type=checkbox]):not([disabled]),select')||q('button.pri')||q('button'); if(f) f.focus(); },0);
  const rm=b.remove.bind(b); let gone=false;
  b.remove = ()=>{ if(gone) return; gone=true; rm(); if(b.onclosed) b.onclosed(); };   // mọi cách đóng (nút, Esc, bấm ra ngoài) đều qua đây
  b.close = ()=>b.remove();
  return b;
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ const m=document.querySelector('.back'); if(m){ m.remove(); e.stopPropagation(); } } }, true);

/* ---------- dữ liệu ---------- */
const fmt=n=>Number(n).toLocaleString('vi-VN');
async function loadPhotos(){
  S.photos = await api('/api/photos');
  S.by = new Map(S.photos.map(p=>[p.id,p]));
  rebest();
  for(const id of [...S.sel]) if(!S.by.has(id)) S.sel.delete(id);
  await refreshCull();
  applyView();
}
async function refreshCull(){ try{ S.lastCull=await api('/api/cull/last'); }catch(e){ S.lastCull=null; } }
async function loadPeople(){ S.people = await api('/api/people'); renderPeople(); }
function setPreviewFilter(on){   // bộ lọc tạm "Sẽ bị loại" sau khi bấm Xem trước trong Tự động lọc
  const sel=$('#fFilter'); let o=sel.querySelector('option[value=pv]');
  if(on){ if(!o){ o=document.createElement('option'); o.value='pv'; o.textContent='Sẽ bị loại (xem trước)'; sel.prepend(o); } S.filter='pv'; sel.value='pv'; S.keep.clear(); applyView(); }
  else if(o){ o.remove(); if(S.filter==='pv'){ S.filter='all'; sel.value='all'; } S.pv=new Set(); } }
function matchFilter(p){
  const f=S.filter;
  switch(f){
    case 'all': return true; case 'unrated': return p.rating===0;
    case 'rej': return p.rating===-1; case 'norej': return p.rating>=0;
    case 'issues': return p.flags.length>0;
    case 'raw': return RAWRE.test(p.name); case 'jpg': return !RAWRE.test(p.name);
    case 'best': return p.grp>0 && p.best; case 'face': return p.nf>0; case 'noface': return p.nf===0;
    case 'pv': return !!(S.pv&&S.pv.has(p.id));
    case 'smile': return (p.smile??-1)>=SMILE_ON;
    case 'blur': case 'dark': case 'bright': case 'eyes': case 'away': case 'dup': return p.flags.includes(f);
    default: if(f[0]==='r') return p.rating>=+f.slice(1); return true;
  }
}
// Khi 1 shot có cả RAW lẫn JPEG cùng tên (cùng thư mục): tùy chọn chỉ hiện bản RAW hoặc bản JPEG.
// Ảnh chỉ có một bản (JPEG lẻ hoặc RAW lẻ) luôn được giữ nguyên.
function pairHidden(){
  if(S.pair!=='raw' && S.pair!=='jpeg') return null;
  const key=p=>p.dir+'\u0000'+p.name.replace(/\.[^.]+$/,'').toLowerCase();
  const hasRaw=new Set(), hasJpg=new Set();
  for(const p of S.photos){ const k=key(p); (RAWRE.test(p.name)?hasRaw:hasJpg).add(k); }
  const hide=new Set();
  for(const p of S.photos){ const k=key(p), raw=RAWRE.test(p.name);
    if(S.pair==='raw' && !raw && hasRaw.has(k)) hide.add(p.id);        // ưu tiên RAW: ẩn JPEG có anh em RAW
    else if(S.pair==='jpeg' && raw && hasJpg.has(k)) hide.add(p.id);   // ưu tiên JPEG: ẩn RAW có anh em JPEG
  }
  return hide.size?hide:null;
}
function applyView(){
  const hp=pairHidden();
  let v = S.photos.filter(p=>!(hp&&hp.has(p.id)) && (S.keep.has(p.id)||matchFilter(p)) && (S.person===null || p.people.includes(S.person)));
  const cmp = {name:(a,b)=>a.dir.localeCompare(b.dir)||a.name.localeCompare(b.name,undefined,{numeric:true}),
               time:(a,b)=>(a.taken||0)-(b.taken||0)||a.name.localeCompare(b.name),
               score:(a,b)=>b.score-a.score, sharp:(a,b)=>(b.nf?b.fsharp:b.sharp)-(a.nf?a.fsharp:a.sharp), smile:(a,b)=>((b.smile??-1)-(a.smile??-1))||(b.score-a.score)}[S.sort];
  v.sort(cmp); S.viewFull=v; S.view=stackView(v);   // viewFull: mọi ảnh khớp bộ lọc, kể cả ảnh nằm trong chồng
  if(S.cur===null || !v.some(p=>p.id===S.cur)) S.cur = v.length ? v[0].id : null;
  renderGrid(); scheduleInfo();
}

/* Xếp chồng ảnh trùng: mỗi nhóm hiện 1 ô (ảnh tốt nhất); mở chồng thì các ảnh còn lại hiện ngay sau ô đó. */
const gsize=g=>S.gs.get(g)||0;
function stackView(v){
  S.gs=new Map(); for(const p of S.photos) if(p.grp) S.gs.set(p.grp,(S.gs.get(p.grp)||0)+1);
  S.cover=new Map();
  if(!stackOn()) return v;
  // ảnh đại diện chồng: ảnh tốt nhất; nếu ảnh đó đã bị loại thì lấy ảnh điểm cao nhất còn giữ
  const rank=p=>(p.rating===-1?0:2)+(p.best?1:0);
  for(const p of v) if(p.grp){ const c=S.cover.get(p.grp); if(!c||rank(p)>rank(c)||(rank(p)===rank(c)&&p.score>c.score)) S.cover.set(p.grp,p); }
  for(const [g,c] of [...S.cover]) S.cover.set(g,c.id);
  const isCover=p=>S.cover.get(p.grp)===p.id;
  const rest=new Map(); for(const p of v) if(p.grp&&!isCover(p)){ if(!rest.has(p.grp)) rest.set(p.grp,[]); rest.get(p.grp).push(p); }
  const out=[];
  for(const p of v){
    if(p.grp&&!isCover(p)) continue;          // nằm trong chồng
    out.push(p);
    if(p.grp&&S.open.has(p.grp)) out.push(...(rest.get(p.grp)||[]).sort((a,b)=>(a.taken||0)-(b.taken||0)||a.name.localeCompare(b.name,undefined,{numeric:true})));
  }
  return out; }
const stackOn=()=>S.stack&&!['dup','pv'].includes(S.filter);   // xem ảnh trùng / xem trước tự lọc: hiện từng ảnh
function stacked(p){ return !!(stackOn()&&p.grp&&S.cover&&S.cover.get(p.grp)===p.id&&gsize(p.grp)>1); }
function toggleStack(g){
  if(!g) return; const opening=!S.open.has(g); opening?S.open.add(g):S.open.delete(g);
  if(!opening){ const c=S.by.get(S.cur); if(c&&c.grp===g&&S.cover&&S.cover.get(g)!==c.id) S.cur=S.cover.get(g); }
  applyView(); if(S.viewer) showViewer(); else if(S.cur!=null) scrollToItem(S.cur); }

/* ---------- lưới ---------- */
const cells = new Map();
function capChips(h){ const t=document.createElement('div'); t.innerHTML=h; const k=[...t.children]; if(k.length<=2) return h;
  const rest=k.slice(2).map(e=>e.textContent).join(', '); return k.slice(0,2).map(e=>e.outerHTML).join('')+`<span class="chip more" title="${esc(rest)}">+${k.length-2}</span>`; }
/* Chọn "ảnh tốt nhất" trong mỗi nhóm ảnh trùng, theo cách thợ ảnh chọn:
   1) ảnh bạn tự chấm sao cao nhất luôn thắng; ảnh đã loại không bao giờ được chọn (trừ khi cả nhóm đều loại);
   2) trong các ảnh đủ nét (điểm ≥ 75% ảnh cao điểm nhất), ít lỗi nhất: nhắm mắt, mờ, có người quay mặt, quá tối / cháy sáng;
   3) nhiều gương mặt nhìn máy hơn; 4) cuối cùng mới xét điểm (độ nét, phơi sáng). */
function defects(p){ const f=p.flags||[]; return (f.includes('eyes')?2:0)+(f.includes('blur')?2:0)+(p.away||0)+((f.includes('dark')||f.includes('bright'))?1:0); }
function rebest(ids){
  const gs=new Map(); for(const p of S.photos) if(p.grp){ if(!gs.has(p.grp)) gs.set(p.grp,[]); gs.get(p.grp).push(p); }
  const only=ids?new Set(ids.map(i=>S.by.get(i)).filter(p=>p&&p.grp).map(p=>p.grp)):null, changed=[];
  for(const [g,m] of gs){
    if(only&&!only.has(g)) continue;
    const live=m.filter(p=>p.rating!==-1), pool=live.length?live:m;
    const top=Math.max(...pool.map(p=>p.score||0)), maxR=Math.max(...pool.map(p=>p.rating||0));
    let cand = maxR>0 ? pool.filter(p=>p.rating===maxR) : pool.filter(p=>(p.score||0)>=0.75*top);
    if(!cand.length) cand=pool;
    const key=p=>[defects(p), -((p.nf||0)-(p.away||0)), -(p.score||0)];
    const lt=(a,b)=>{ const x=key(a),y=key(b); for(let i=0;i<x.length;i++) if(x[i]!==y[i]) return x[i]<y[i]; return a.id<b.id; };
    let best=cand[0]; for(const p of cand) if(lt(p,best)) best=p;
    for(const p of m){
      const was=!!p.best; p.best=p===best?1:0;
      const f=(p.flags||[]).filter(x=>x!=='dup'); if(!p.best) f.push('dup'); p.flags=f;
      if(was!==!!p.best) changed.push(p.id);
    }
    best.why = maxR>0 ? 'Ảnh bạn chấm sao cao nhất trong nhóm'
      : [best.nf>=2&&!best.away?'mọi người nhìn máy':'', !best.flags.includes('eyes')&&m.some(p=>p!==best&&p.flags.includes('eyes'))?'không ai nhắm mắt':'',
         best.score>=top?'nét và đủ sáng nhất':'', defects(best)<Math.min(...m.filter(p=>p!==best).map(defects))?'ít lỗi nhất':''].filter(Boolean).join(', ')||'tổng thể tốt nhất';
  }
  return changed; }
function bestWhy(p){ return p.why ? p.why.charAt(0).toUpperCase()+p.why.slice(1) : 'Ảnh tốt nhất trong nhóm'; }
function cellHTML(p){
  const flags = p.err ? '<span class="chip" style="background:#5a1d1a;color:#ffd9d6">⚠ Lỗi đọc</span>'
    : p.an===false ? '<span class="chip" style="opacity:.7">…</span>'
    : p.flags.filter(f=>f!=='dup').map(f=>`<span class="chip ${f}">${FLAG[f]}</span>`).join('');
  const grp = !p.grp ? '' : stacked(p)
      ? `<button class="chip stk" data-g="${p.grp}" aria-expanded="${S.open.has(p.grp)}" title="${S.open.has(p.grp)?'Thu gọn nhóm':'Mở nhóm để so sánh'} · ảnh đại diện: ${bestWhy(p)} (phím G)">${S.open.has(p.grp)?'▾':'▸'} ${gsize(p.grp)} ảnh trùng</button>`
      : (p.best ? `<span class="chip topdup" title="Ảnh tốt nhất trong nhóm ảnh trùng: ${bestWhy(p)}">Tốt nhất</span>` : `<span class="chip dup" title="Ảnh trùng — nhóm ${p.grp}">Trùng</span>`);
  return `<div class="im"><img loading="lazy" src="/thumb/${p.id}.jpg?v=${p.tv}" alt="" onerror="this.closest('.im').classList.add('noimg')"><div class="lab ${p.label?'l-'+p.label:''}"></div>
    <div class="flags">${capChips(grp+flags)}</div><div class="xmark">✕</div>
    <div class="stars">${p.rating>0?'★'.repeat(p.rating):''}</div>${p.nf?`<span class="nface">${p.nf} mặt</span>`:''}</div>
    <div class="nm" title="${esc(p.name)}">${esc(p.name)}</div>`;
}
const sigs = new Map();
const sigOf = p => [p.tv,p.rating,p.label,p.flags.join(),p.grp,p.best,p.nf,p.an,p.err,p.people.join(),stacked(p),S.open.has(p.grp),gsize(p.grp)].join('|');
/* ---------- lưới ảo: chỉ dựng ô đang nhìn thấy (mượt với vài nghìn ảnh) ---------- */
const GAP=10, VBUF=4;                 // khoảng cách ô + số hàng đệm trên/dưới khung nhìn
let VW={cols:1,colW:150,rowH:180,rows:0}, vRAF=0;
function vMeasure(){
  const grid=$('#grid'); if(!grid) return;
  const gw=grid.clientWidth||1;
  const minSz=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sz'))||150;
  const cols=Math.max(1,Math.floor((gw+GAP)/(minSz+GAP)));
  const colW=Math.floor((gw-(cols-1)*GAP)/cols);
  let rowH=VW.rowH;
  if(S.view.length){                  // đo chiều cao ô thật ở cỡ cột hiện tại (ô vuông + tên file)
    const probe=document.createElement('div'); probe.className='cell';
    probe.style.cssText=`position:absolute;visibility:hidden;left:-9999px;top:0;width:${colW}px`;
    probe.innerHTML=cellHTML(S.view[0]); grid.appendChild(probe);
    rowH=probe.offsetHeight||rowH; probe.remove();
  }
  VW={cols,colW,rowH,rows:Math.ceil(S.view.length/cols)};
  grid.style.height=(VW.rows?VW.rows*rowH+(VW.rows-1)*GAP:0)+'px';   // giữ đúng chiều cao cuộn
}
function vPaint(){
  const grid=$('#grid'), wrap=$('#gridwrap'); if(!grid) return;
  if(!S.view.length){ for(const [,d] of cells) d.remove(); cells.clear(); sigs.clear(); return; }
  const step=VW.rowH+GAP, top=wrap.scrollTop-grid.offsetTop;
  const first=Math.max(0,Math.floor(top/step)-VBUF);
  const last=Math.min(VW.rows-1,Math.ceil((top+wrap.clientHeight)/step)+VBUF);
  const a=first*VW.cols, b=Math.min(S.view.length-1,(last+1)*VW.cols-1);
  const want=new Set(); for(let i=a;i<=b;i++) want.add(S.view[i].id);
  for(const [id,d] of [...cells]) if(!want.has(id)){ d.remove(); cells.delete(id); sigs.delete(id); }
  for(let i=a;i<=b;i++){
    const p=S.view[i], row=(i/VW.cols)|0, col=i%VW.cols, sg=sigOf(p);
    let d=cells.get(p.id);
    if(!d){ d=document.createElement('div'); d.className='cell'; d.id='c'+p.id; d.setAttribute('role','option'); d.dataset.id=p.id; d.innerHTML=cellHTML(p); cells.set(p.id,d); sigs.set(p.id,sg); grid.appendChild(d); }
    else if(sigs.get(p.id)!==sg){ d.innerHTML=cellHTML(p); sigs.set(p.id,sg); }
    d.style.cssText=`position:absolute;width:${VW.colW}px;left:${col*(VW.colW+GAP)}px;top:${row*step}px`;
    decorate(p.id);
  }
}
function scrollToItem(id){
  const i=S.view.findIndex(p=>p.id===id); if(i<0) return;
  const wrap=$('#gridwrap'), grid=$('#grid'); if(!grid) return;
  const step=VW.rowH+GAP, tp=grid.offsetTop+(((i/VW.cols)|0)*step), bot=tp+VW.rowH;
  if(tp<wrap.scrollTop) wrap.scrollTop=tp;
  else if(bot>wrap.scrollTop+wrap.clientHeight) wrap.scrollTop=bot-wrap.clientHeight;
  vPaint();
}
function renderGrid(){
  const wrap=$('#gridwrap');
  if(!S.photos.length){
    cells.clear(); sigs.clear();
    wrap.innerHTML = `<div id="empty"><h2>${S.status.state==='scanning'?'Đang đọc ảnh…':(S.status.state==='error'?'Không mở được thư mục':'Chưa có ảnh nào')}</h2>${S.status.state==='error'?`<div style="color:#ffb3b3;max-width:520px;margin:0 auto 10px;word-break:break-word">${esc(S.status.message||'')}</div>`:''}${S.status.state==='done'&&S.status.root&&!S.photos.length?`<div style="color:#ffd9a0;margin-bottom:8px">Thư mục «${esc(S.status.root)}» không có ảnh nào (JPG/PNG/RAW/HEIC).</div>`:''}<div>Mở một thư mục ảnh để bắt đầu.<br>App tự phát hiện ảnh mờ, tối, nhắm mắt, trùng lặp<br>và nhóm ảnh theo từng người.</div><button class="pri" onclick="pickFolder()"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg>Mở thư mục</button></div>`;
    renderStatus(); return;
  }
  if(!$('#grid')){ cells.clear(); sigs.clear(); wrap.innerHTML='<div id="grid" role="presentation"></div>'; }
  vMeasure(); vPaint(); renderStatus();
}
function decorate(id){
  const d=cells.get(id), p=S.by.get(id); if(!d||!p) return;
  d.classList.toggle('sel', S.sel.has(id)); d.classList.toggle('cur', S.cur===id); d.classList.toggle('rej', p.rating===-1);
  d.classList.toggle('stack', stacked(p)&&!S.open.has(p.grp));
  d.setAttribute('aria-selected', String(S.sel.has(id)||S.cur===id));
  d.setAttribute('aria-label', [p.name, p.rating>0?`${p.rating} sao`:(p.rating===-1?'đã loại':'chưa chấm'), p.label?`nhãn ${LABEL_VI[p.label]||p.label}`:'', stacked(p)?`nhóm ${gsize(p.grp)} ảnh trùng`:''].filter(Boolean).join(', '));
  if(S.cur===id){ const w=$('#gridwrap'); w.setAttribute('aria-activedescendant', d.id); } d.classList.toggle('ingrp', !!(S.stack&&p.grp&&S.open.has(p.grp)));
}
function refreshCell(id){ const d=cells.get(id), p=S.by.get(id); if(d&&p){ d.innerHTML=cellHTML(p); sigs.set(id,sigOf(p)); decorate(id);} }
function setCur(id, {extend=false, toggle=false, scroll=true}={}){
  if(S.keep.size && [...S.keep].some(i=>i!==id)){ S.keep=new Set([...S.keep].filter(i=>i===id)); S.cur=id; applyView(); }   // rời ảnh đã chấm: giờ mới ẩn theo bộ lọc
  const old=S.cur; S.cur=id;
  if(extend && S.anchor!==null){
    const a=S.view.findIndex(p=>p.id===S.anchor), b=S.view.findIndex(p=>p.id===id);
    const [lo,hi]=a<b?[a,b]:[b,a]; const prev=[...S.sel]; S.sel=new Set(S.view.slice(lo,hi+1).map(p=>p.id)); prev.forEach(decorate);
    S.sel.forEach(decorate);
  } else if(toggle){ S.sel.has(id)?S.sel.delete(id):S.sel.add(id); S.anchor=id; }
  else { const prev=[...S.sel]; S.sel=new Set([id]); S.anchor=id; prev.forEach(decorate); }
  decorate(old); decorate(id);
  if(scroll) scrollToItem(id);
  renderStatus(); if(S.viewer) showViewer(); scheduleInfo();
}
$('#gridwrap').addEventListener('click', e=>{
  const st=e.target.closest('.chip.stk'); if(st){ e.stopPropagation(); toggleStack(+st.dataset.g); return; }

$('#gridwrap').addEventListener('dblclick', e=>{ const c=e.target.closest('.cell'); if(c){ setCur(+c.dataset.id,{scroll:false}); openViewer(); } });
$('#gridwrap').addEventListener('scroll', ()=>{ if(vRAF) return; vRAF=requestAnimationFrame(()=>{ vRAF=0; if($('#grid')) vPaint(); }); }, {passive:true});
try{ new ResizeObserver(()=>{ if($('#grid')&&S.photos.length) renderGrid(); }).observe($('#gridwrap')); }catch(e){}

function renderStatus(){

    (st.state==='scanning'?` • thumbnail ${Math.max(st.thumbs,st.quick||0)}/${st.total} • phân tích ${st.done}/${st.total} (chạy nền — bạn có thể chấm ảnh ngay)`:'');

  const net=$('#sNet'); net.innerHTML = st.online ? '<span class="ok">● Trực tuyến</span>' : '<span class="warn">● Ngoại tuyến: tạm khóa lọc tối, cháy sáng, nhắm mắt</span>';
  const p=S.by.get(S.cur);
  $('#sCur').textContent = p ? `${p.name} • ${p.w}×${p.h} • điểm ${p.score} • độ nét ${p.nf?p.fsharp+' (mặt)':p.sharp}` : '';

/* ---------- chấm điểm / nhãn + hoàn tác ---------- */
function targets(){ if(S.viewer) return S.cur!==null?[S.cur]:[]; if(S.sel.size && S.sel.has(S.cur)) return [...S.sel]; return S.cur!==null?[S.cur]:[]; }
async function rate(ids, r, {noUndo=false}={}){
  if(!ids.length) return;
  const old=ids.map(i=>[i,S.by.get(i).rating]);
  ids.forEach(i=>S.by.get(i).rating=r);
  await api('/api/rate',{ids,rating:r});
  if(!noUndo){ S.undo.push({t:'rate',old}); $('#bUndo').disabled=false; }
  afterChange(ids);
}
async function label(ids, l){
  if(!ids.length) return;
  const old=ids.map(i=>[i,S.by.get(i).label]);
  ids.forEach(i=>S.by.get(i).label=l);
  await api('/api/label',{ids,label:l});
  S.undo.push({t:'label',old}); $('#bUndo').disabled=false; afterChange(ids);
}
/* Đang lọc (vd. "Chưa chấm") mà chấm sao làm ảnh hết khớp bộ lọc: giữ ảnh đó tại chỗ tới khi rời đi,
   không để danh sách co lại làm nhảy sang ảnh khác. */
function afterChange(ids){
  if(S.filter!=='all') ids.forEach(i=>S.keep.add(i));
  const g=new Set(ids.map(i=>S.by.get(i)).filter(p=>p&&p.grp).map(p=>p.grp));
  if(g.size){ rebest(ids); for(const p of S.photos) if(g.has(p.grp)) refreshCell(p.id); if(S.viewer){ const c=S.by.get(S.cur); if(c) renderBadge(c); } }   // chấm sao / loại có thể đổi ảnh tốt nhất của nhóm
  ids.forEach(refreshCell); renderStatus();
  if(S.viewer) showViewer();
}
async function undoCull(batch){
  const r=await api('/api/cull/undo',{id:batch}); r.ids.forEach(i=>{ if(S.by.has(i)) S.by.get(i).rating=0; });
  S.undo=S.undo.filter(u=>!(u.t==='cull'&&u.batch===batch)); await refreshCull();
  if(S.filter==='rej'){ S.filter='all'; $('#fFilter').value='all'; }
  applyView(); if(S.viewer) showViewer(); toast(`Đã hoàn tác lần lọc, khôi phục ${fmt(r.n)} ảnh`);
}
async function undo(){
  const top=S.undo[S.undo.length-1];
  if(!top||top.t==='cull'){ const b=top?top.batch:(S.lastCull&&S.lastCull.n?S.lastCull.id:0); if(b) await undoCull(b); return; }
  const u=S.undo.pop();
  if(u.t==='rate'){ u.old.forEach(([i,r])=>{ if(S.by.has(i)) S.by.get(i).rating=r; }); await api('/api/rate',{pairs:u.old.map(([i,r])=>[i,r])}); }
  else { const g={}; u.old.forEach(([i,l])=>{ if(S.by.has(i)) S.by.get(i).label=l; (g[l]=g[l]||[]).push(i); });
         for(const l in g) await api('/api/label',{ids:g[l],label:l}); }
  applyView(); if(S.viewer) showViewer(); toast('Đã hoàn tác');
}
$('#bUndo').onclick=undo;
$('#bUnrej').onclick=()=>{

/* ---------- dải ảnh thu nhỏ dưới trình xem ---------- */
const SC_W=96; let stripOn=true; try{ stripOn=localStorage.getItem('ps_strip')!=='0'; }catch(e){}
let stripLast=-1;
function renderStrip(center){
  const v=$('#viewer'); v.classList.toggle('nostrip',!stripOn); if(!stripOn||!S.viewer) return;
  const st=$('#strip'), inn=$('#stripin'); const n=S.view.length;
  inn.style.width=(n*SC_W+8)+'px';
  const ix=S.view.findIndex(p=>p.id===S.cur);
  if(center && ix>=0){ st.scrollLeft=Math.max(0, ix*SC_W - st.clientWidth/2 + SC_W/2); }
  const lo=Math.max(0,Math.floor(st.scrollLeft/SC_W)-4), hi=Math.min(n-1,Math.ceil((st.scrollLeft+st.clientWidth)/SC_W)+4);
  let html='';
  for(let i=lo;i<=hi;i++){ const p=S.view[i];
    html+=`<div class="sc${p.id===S.cur?' cur':''}${p.rating<0?' rej':''}" data-id="${p.id}" style="left:${4+i*SC_W}px" title="${esc(p.name)}"><img loading="lazy" src="/thumb/${p.id}.jpg?v=${p.tv}" alt="">`+
      (p.rating>0?`<span class="rt" aria-label="${p.rating} sao">${p.rating}★</span>`:'')+(p.label?`<span class="lb l-${p.label}"></span>`:'')+`<div class="nm">${esc(p.name)}</div></div>`; }
  inn.innerHTML=html;
}
{ const st=$('#strip'); let raf=0;
  st.addEventListener('scroll',()=>{ if(raf) return; raf=requestAnimationFrame(()=>{ raf=0; renderStrip(false); }); });
  st.addEventListener('wheel',e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ st.scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
  $('#stripin').addEventListener('click',e=>{ const c=e.target.closest('.sc'); if(c) setCur(+c.dataset.id,{scroll:false}); });
  window.addEventListener('resize',()=>renderStrip(false)); }

/* ---------- trình xem ---------- */
/* phóng ảnh: lăn chuột quanh vị trí con trỏ, giữ chuột phải để kéo, bấm chuột trái hoặc phím Z để đổi nhanh */
const Z={k:1,hi:false,max:8,hiFrom:1.6,click:2.5};
function zoomBase(p){ const st=$('#vstage'), w=p.w||1, h=p.h||1, f=Math.min(st.clientWidth/w,st.clientHeight/h); return [w*f,h*f]; }
function sizeZoom(){ const p=S.by.get(S.cur), img=$('#vimg'); if(!p) return; const [w,h]=zoomBase(p); img.style.width=Math.round(w*Z.k)+'px'; img.style.height=Math.round(h*Z.k)+'px'; }
function paintZoom(){ const l=$('#vzoom'); l.hidden=!S.zoom; l.textContent=Math.round(Z.k*100)+'%'; }
function resetZoom(){ Z.k=1; Z.hi=false; S.zoom=false; fitView(); paintZoom(); }
/* Ảnh trong trình xem luôn được đặt đúng cỡ "vừa khung" theo tỉ lệ ảnh — dù đang hiện thumbnail, ảnh xem trước hay bản nét —
   nên chuyển ảnh không còn bị phóng to / thu nhỏ (trước đây ảnh nhỏ hơn khung hiện theo cỡ thật rồi mới giãn ra). */
function fitView(w,h){
  const img=$('#vimg'), p=S.by.get(S.cur); if(S.zoom) return;
  if(!w||!h){ w=img.naturalWidth; h=img.naturalHeight; }   // gọi lại khi đổi cỡ cửa sổ: theo ảnh đang hiện
  if(!w||!h){ return; }
  const st=$('#vstage'), mw=st.clientWidth||window.innerWidth-290, mh=st.clientHeight||window.innerHeight-(stripOn?116:0), k=Math.min(mw/w,mh/h);
  img.style.width=Math.round(w*k)+'px'; img.style.height=Math.round(h*k)+'px'; }
addEventListener('resize',()=>{ if(S.viewer&&!S.zoom) fitView(); });
function zoomTo(k,cx,cy){
  const st=$('#vstage'), img=$('#vimg'), sr=st.getBoundingClientRect(), r=img.getBoundingClientRect();
  const fx=Math.min(1,Math.max(0,(cx-r.left)/r.width)), fy=Math.min(1,Math.max(0,(cy-r.top)/r.height)), was=S.zoom, wasHi=Z.hi;
  Z.k=Math.min(Z.max,Math.max(1,k));
  if(Z.k<=1.001) resetZoom(); else { S.zoom=true; if(Z.k>Z.hiFrom) Z.hi=true; }
  st.classList.toggle('zoom',S.zoom); if(S.zoom) sizeZoom();
  st.scrollLeft=fx*img.offsetWidth-(cx-sr.left); st.scrollTop=fy*img.offsetHeight-(cy-sr.top);  // giữ nguyên điểm dưới con trỏ
  paintZoom(); if(was!==S.zoom||wasHi!==Z.hi) showViewer();
}

let vTok=0, vDir=1, vLastIx=-1;
const THUMB_WAIT=180;   // ms chờ ảnh nét trước khi tạm hiện thumbnail
const VPRE=new Map(), VHQ=new Map();
/* Ảnh nét cho trình xem. Ảnh cache (JPEG nhúng ~1600px) hiện tức thì; bản nét đúng số điểm ảnh màn hình
   được app dựng sẵn ở nền cho ảnh đang xem và vài ảnh kế tiếp, nên chuyển ảnh là nét ngay. */
const RAWX=/\.(arw|cr2|cr3|nef|nrw|dng|raf|orf|rw2|pef|srw|x3f|3fr|iiq|rwl|erf|kdc|mrw|mef|mos|sr2|srf)$/i;
const vBox=()=>[window.innerWidth-290, window.innerHeight-(stripOn?116:0)];
function vSide(){ const [mw,mh]=vBox(); return Math.min(4096,Math.ceil(Math.max(mw,mh)*(window.devicePixelRatio||1)/256)*256); }
function needHQ(p){   // ảnh cache có đủ nét cho khung xem không
  if(!p) return false; const raw=RAWX.test(p.name), W=p.w||1600, H=p.h||1067, L=Math.max(W,H);
  const cl=raw?Math.min(L,2048):Math.min(L,1600), [mw,mh]=vBox(), k=Math.min(mw/(W*cl/L),mh/(H*cl/L)), need=cl*k*(window.devicePixelRatio||1);
  return need>cl*1.04; }   // chỉ giải mã RAW khi màn hình thật sự cần nhiều điểm ảnh hơn ảnh nhúng (giữ đúng màu máy ảnh)
const hqUrl=id=>`/api/preview?id=${id}&s=${vSide()}&hq=1&v=2`;   // v=2: ảnh nét dựng lại sau khi sửa viền đôi (bỏ bản cũ trình duyệt còn giữ)
let hqCtl=null, preCtl=null, aheadT=0, aheadKey='';
function hqKeep(u,im){ VHQ.set(u,im); while(VHQ.size>8){ const [k,o]=VHQ.entries().next().value; VHQ.delete(k); try{ URL.revokeObjectURL(o.src); }catch(e){} } }
async function hqLoad(u,ctl){   // tải + giải mã sẵn; trả về Image hoặc null
  const r=await fetch(u,{signal:ctl.signal}); if(!r.ok) return null;
  const im=new Image(); im.src=URL.createObjectURL(await r.blob()); try{ await im.decode(); }catch(e){ return null; }
  hqKeep(u,im); return im; }
function upgradeHQ(p,tok,src){
  if(!needHQ(p)) return; const u=hqUrl(p.id), img=$('#vimg'); const sw=im=>{ if(im&&tok===vTok&&img.dataset.src===src&&!S.zoom) img.src=im.src; };
  const have=VHQ.get(u); if(have){ sw(have); return; }
  if(hqCtl) hqCtl.abort(); const c=hqCtl=new AbortController();
  hqLoad(u,c).then(im=>{ sw(im); if(c===hqCtl) prefetchHQ(); }).catch(()=>{}); }
function prefetchHQ(){   // xong ảnh đang xem thì tải sẵn ảnh kế tiếp (đã được dựng trước ở nền)
  const ix=S.view.findIndex(x=>x.id===S.cur), nx=S.view[ix+1]; if(!nx||!needHQ(nx)) return; const u=hqUrl(nx.id); if(VHQ.has(u)) return;
  if(preCtl) preCtl.abort(); preCtl=new AbortController(); hqLoad(u,preCtl).catch(()=>{}); }
function sendAhead(){   // báo app dựng trước ảnh đang xem + 6 ảnh kế + 2 ảnh trước
  clearTimeout(aheadT); aheadT=setTimeout(()=>{ const ix=S.view.findIndex(x=>x.id===S.cur); if(ix<0) return;
    const ids=[0,1,2,3,4,5,6,-1,-2].map(d=>S.view[ix+d]).filter(p=>p&&needHQ(p)).map(p=>p.id), k=ids.join(',')+'@'+vSide();
    if(!ids.length||k===aheadKey) return; aheadKey=k; fetch('/api/view/ahead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,s:vSide()})}).catch(()=>{}); },120); }
async function showViewer(){
  const p=S.by.get(S.cur); if(!p){ closeViewer(); return; }
  const tok=++vTok; const img=$('#vimg'); $('#vstage').classList.toggle('zoom',S.zoom); if(S.zoom) sizeZoom();
  const src = Z.hi ? `/api/preview?id=${p.id}&s=0` : `/api/preview?id=${p.id}&s=2000`;
  if(img.dataset.src!==src){
    img.dataset.src=src;
    const thumb=`/thumb/${p.id}.jpg?v=${p.tv}`;
    const fit=(w,h)=>{ // giữ khung ảnh đúng cỡ cuối cùng ngay cả khi mới hiện thumbnail nhỏ → không bị "nhảy"/bóng ma
      if(S.zoom){ sizeZoom(); return; }
      fitView(w,h); };
    const apply=(im,u,clear)=>{ // chỉ đổi ảnh khi ảnh mới đã giải mã xong và khung đã đúng cỡ → không còn khung hình lẫn ảnh cũ
      const go=()=>{ if(tok!==vTok||img.dataset.src!==src) return; fit(im.naturalWidth,im.naturalHeight); img.src=u;
        if(u===src&&!Z.hi&&!S.zoom) upgradeHQ(p,tok,src);
      };
      (im.decode?im.decode().then(go,go):go()); };
    const done=VPRE.get(src), hq=!Z.hi&&!S.zoom&&needHQ(p)?VHQ.get(hqUrl(p.id)):null;
    if(hq){ const go=()=>{ if(tok!==vTok||img.dataset.src!==src) return; fit(hq.naturalWidth,hq.naturalHeight); img.src=hq.src; }; go(); prefetchHQ(); }   // đã có bản nét: hiện luôn
    else if(done&&done.complete&&done.naturalWidth){ apply(done,src,true); }   // đã nạp trước: hiện ngay, không qua thumbnail
    else{
      // chưa nạp xong: giữ ảnh đang hiện thêm một chút; chỉ khi chậm thật mới hiện thumbnail nhỏ (mờ) thế chỗ
      const reuse=done&&!done.complete, big=reuse?done:new Image(); if(!reuse) VPRE.set(src,big);
      const t=new Image(); setTimeout(()=>{ if(tok!==vTok||img.dataset.src!==src||(big.complete&&big.naturalWidth)) return;
        t.onload=()=>{ if(!big.complete||!big.naturalWidth) apply(t,thumb,false); }; t.src=thumb; },THUMB_WAIT);
      big.addEventListener('load',()=>apply(big,src,true),{once:true});
      if(!reuse) big.src=src;
    }
  }
  const ix=S.view.findIndex(x=>x.id===p.id);
  if(vLastIx>=0&&ix!==vLastIx) vDir=ix<vLastIx?-1:1; vLastIx=ix;
  // nạp trước theo hướng đang lật (4 ảnh tới + 1 ảnh lùi) để bấm liên tục vẫn có ảnh nét sẵn
  for(const d of [1,2,3,4,-1]){ const o=S.view[ix+d*vDir]; if(!o) continue; const u=`/api/preview?id=${o.id}&s=2000`;
    if(VPRE.has(u)){ const v=VPRE.get(u); VPRE.delete(u); VPRE.set(u,v); continue; }
    const pre=new Image(); pre.decoding='async'; VPRE.set(u,pre); pre.src=u; }
  while(VPRE.size>24) VPRE.delete(VPRE.keys().next().value);
  renderInfo(p, ix); renderBadge(p); renderRate(p); loadBoxes(p, tok); updateMask(); renderStrip(true); sendAhead();
}
{ const st=$('#vstage'); let dn=null, moved=false;   // bấm trái (không kéo) = zoom vào/ra; giữ trái (hoặc phải) rồi kéo = xem quanh ảnh
  st.addEventListener('wheel',e=>{ e.preventDefault(); zoomTo(Z.k*Math.exp(-e.deltaY*.0015),e.clientX,e.clientY); },{passive:false});
  st.addEventListener('contextmenu',e=>e.preventDefault());
  st.addEventListener('mousedown',e=>{ if(e.button!==0&&e.button!==2) return; e.preventDefault(); dn={x:e.clientX,y:e.clientY,l:st.scrollLeft,t:st.scrollTop,b:e.button}; moved=false; });
  addEventListener('mousemove',e=>{ if(!dn||!S.zoom) return;
    if(!moved){ if(Math.abs(e.clientX-dn.x)+Math.abs(e.clientY-dn.y)<4) return; moved=true; st.classList.add('pan'); }
    st.scrollLeft=dn.l-(e.clientX-dn.x); st.scrollTop=dn.t-(e.clientY-dn.y); });

}

function drawHistogram(cv,h){   // ĐỔI TÊN: tránh trùng với drawHist() của Catalog (lịch sử xuất ảnh) khiến histogram không vẽ
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||260, H=cv.clientHeight||120;
  cv.width=W*dpr; cv.height=H*dpr; const c=cv.getContext('2d'); c.scale(dpr,dpr); c.clearRect(0,0,W,H);
  if(!h){ c.fillStyle='#a9c0da'; c.font='12px sans-serif'; c.fillText('Đang tải…',10,20); return; }
  c.strokeStyle='rgba(255,255,255,.14)'; c.lineWidth=1; for(let i=1;i<4;i++){ const x=Math.round(W*i/4)+.5; c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
  const vals=[].concat(h.r.slice(1,255),h.g.slice(1,255),h.b.slice(1,255)).sort((a,b)=>a-b);
  const peak=Math.max(1,vals[Math.floor(vals.length*0.995)]*1.1);   // bỏ qua cột đỉnh ở 0/255 để biểu đồ không bị "cụt"
  c.globalCompositeOperation='lighter';
  [['#ff0000',h.r],['#00ff00',h.g],['#0000ff',h.b]].forEach(([col,a])=>{
    c.fillStyle=col; c.beginPath(); c.moveTo(0,H);
    for(let i=0;i<256;i++) c.lineTo(i/255*W, H-Math.min(1,a[i]/peak)*(H-4));
    c.lineTo(W,H); c.closePath(); c.fill();
  });
  c.globalCompositeOperation='source-over';
}

document.addEventListener('keydown', e=>{
  if(document.body.classList.contains('cat')){ if(e.key==='Escape'&&!document.querySelector('.back')&&S.status.root) hideCatalog(); return; }
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&e.key.toLowerCase()==='y'){ e.preventDefault(); if(!document.querySelector('.back')) openExportKey(); return; }
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName) || document.querySelector('.back')) return;
  const k=e.key, mod=e.ctrlKey||e.metaKey;
  if(mod && k.toLowerCase()==='a'){ e.preventDefault(); S.sel=new Set(S.view.map(p=>p.id)); S.view.forEach(p=>decorate(p.id)); renderStatus(); return; }
  if(mod && k.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  if(mod) return;
  if(k==='ArrowRight'){ e.preventDefault(); move(1,e.shiftKey); }
  else if(k==='ArrowLeft'){ e.preventDefault(); move(-1,e.shiftKey); }
  else if(k==='ArrowDown'){ e.preventDefault(); S.viewer?move(1):move(cols(),e.shiftKey); }
  else if(k==='ArrowUp'){ e.preventDefault(); S.viewer?move(-1):move(-cols(),e.shiftKey); }
  else if(k==='Enter'||k===' '){ e.preventDefault(); S.viewer?closeViewer():openViewer(); }
  else if(k==='Escape'&&!e.repeat){ if(S.viewer) closeViewer(); else showCatalog(); }   // Esc lùi từng cấp: ảnh lớn → lưới → Catalog
  else if(/^[0-5]$/.test(k)){ const t=targets(); if(!t.length) return;
    // bấm lại đúng số sao đang có (vd. đang 1 sao, bấm 1) = huỷ sao; không tự sang ảnh kế
    if(+k>0&&t.every(i=>S.by.get(i)&&S.by.get(i).rating===+k)){ rate(t,0); toast(t.length>1?`Đã huỷ sao ${t.length} ảnh`:'Đã huỷ sao'); return; }
    rate(t, +k); advance(t); }
  else if(k==='x'||k==='X'){ const t=targets(); if(t.length){ rate(t, S.by.get(t[0]).rating===-1?0:-1); advance(t); } }
  else if(k>='6'&&k<='9'){ const t=targets(); label(t, LABELS[+k-6]); advance(t); }
  else if(k==='-') label(targets(), '');
  else if(k==='h'||k==='H'){ if(S.viewer) cycleHS(); }
  else if(k==='f'||k==='F'){ S.boxes=!S.boxes; if(S.viewer) showViewer(); }
  else if(k==='z'||k==='Z'){ if(S.viewer){ const r=$('#vstage').getBoundingClientRect(); zoomToggle(r.left+r.width/2,r.top+r.height/2); } }
  else if(k==='t'||k==='T'){ if(S.viewer) toggleStrip(); }
  else if(k==='g'||k==='G'){ const c=S.by.get(S.cur); if(c&&c.grp) toggleStack(c.grp); }
  else if(k==='?') showHelp();
});

/* ---------- kéo thả thư mục từ Windows vào app ----------
   Trình duyệt không cho biết đường dẫn thật của thư mục được thả, chỉ cho tên và các file bên trong.
   App gửi tên + vài file mẫu (tên, dung lượng) để lõi tìm đúng thư mục quanh các thư mục đã có trong Catalog. */
const DROP_IMG=/\.(jpe?g|png|heic|heif|tiff?|webp|arw|cr2|cr3|nef|nrw|dng|raf|orf|rw2|pef|srw|x3f|3fr|iiq|rwl|erf|kdc|mrw|mef|mos|sr2|srf)$/i;
const readAll=dir=>new Promise(res=>{ const r=dir.createReader(), out=[]; const step=()=>r.readEntries(b=>{ if(!b.length||out.length>400) return res(out); out.push(...b); step(); },()=>res(out)); step(); });
const fileOf=e=>new Promise(res=>e.file(res,()=>res(null)));
async function dropSamples(dir){   // tối đa 8 file ảnh mẫu, tìm sâu tối đa 2 cấp thư mục con
  const out=[]; let level=[[dir,'']];
  for(let d=0; d<3 && level.length && out.length<8; d++){ const nxt=[];
    for(const [e,pre] of level){ for(const c of await readAll(e)){
      if(c.isFile&&DROP_IMG.test(c.name)&&out.length<8){ const f=await fileOf(c); out.push({p:pre+c.name,s:f?f.size:-1}); }
      else if(c.isDirectory&&nxt.length<6) nxt.push([c,pre+c.name+'/']); }
      if(out.length>=8) break; }
    level=nxt; }
  return out; }
async function dropOpen(dt){
  const it=[...(dt.items||[])].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  if(!it.length){ toast('Hãy kéo một thư mục ảnh vào đây.',3000); return; }
  let name='', samples=[];
  const dir=it.find(e=>e.isDirectory);
  if(dir){ name=dir.name; samples=await dropSamples(dir); }
  else{ for(const e of it.filter(e=>e.isFile&&DROP_IMG.test(e.name)).slice(0,8)){ const f=await fileOf(e); samples.push({p:e.name,s:f?f.size:-1}); }   // thả file ảnh → mở thư mục chứa chúng
    if(!samples.length){ toast('Không phải thư mục ảnh. Hãy kéo một thư mục vào đây.',3500); return; } }
  if(dir&&!samples.length){ toast(`Thư mục «${name}» không có ảnh nào (JPG/PNG/RAW/HEIC).`,4000); return; }
  toast(`Đang tìm thư mục «${name||'chứa ảnh vừa thả'}»…`,15000);
  let r; try{ r=await api('/api/locate',{name,samples}); }catch(e){ toast(e.message,4000); return; }
  if(r&&r.path){ toast(`Đang mở ${r.path}`,2500); openFolder(r.path,$('#cRec').checked).catch(e=>toast(e.message,4000)); return; }
  toast(`Chưa tìm được «${name||'thư mục'}» tự động. Hãy chọn thư mục đó trong hộp chọn.`,5000); pickFolder(); }
{ let n=0; const z=$('#dropzone'), has=e=>[...(e.dataTransfer&&e.dataTransfer.types||[])].includes('Files');

  const r=e.target.closest('[data-hid]'); if(r){ e.stopPropagation(); const id=+r.dataset.hid, x=Cat.hist.find(h=>h.id===id); if(!x||x.missing) return;
    Cat.lrSel.has(id)?Cat.lrSel.delete(id):Cat.lrSel.add(id); drawHist(); }
},true);
$('#catLr').onclick=()=>{
  const sel=Cat.hist.filter(x=>Cat.lrSel.has(x.id)); if(!sel.length) return;
  if(sel.length===1){ lrRun(sel[0].dest); return; }
  const sp=p=>p.replace(/[\\/]+$/,'').split(/[\\/]/), parts=sel.map(x=>sp(x.dest));
  let k=0; while(parts.every(a=>a.length>k+1&&a[k]===parts[0][k])) k++;
  const sep=sel[0].dest.includes('\\')?'\\':'/', common=parts[0].slice(0,k).join(sep);
  const tooHigh=k<2||/^[A-Za-z]:$/.test(common)||(common.startsWith('\\\\')&&k<5);
  if(tooHigh){ toast('Lightroom chỉ nhận một thư mục nguồn mỗi lần: hãy tick các thư mục nằm chung một thư mục tổng (vd. MTH và MH của cùng buổi chụp).',6000); return; }
  const m=modal(`<h3>Add vào Lightroom</h3><div class="hint" style="margin-bottom:10px">Lightroom nhận một thư mục nguồn mỗi lần, nên app sẽ mở Import cho thư mục tổng<br><b>${esc(common)}</b><br>gồm ${sel.map(x=>'<b>'+esc(x.name)+'</b>').join(', ')} (Include Subfolders). Nếu thư mục tổng còn thư mục con khác, bạn có thể bỏ tick chúng trong hộp Import.</div><div class="btns"><button onclick="this.closest('.back').remove()">Huỷ</button><button class="pri" id="lrAll">Mở Lightroom</button></div>`);
  m.querySelector('#lrAll').onclick=()=>{ m.close(); lrRun(common); };
};
const mainDirNav={hist:[],idx:-1};  // nhớ qua các lần mở hộp chọn, để lùi được cả khi đã lỡ bấm "Chọn thư mục này"
function pickFolder(start, onPick, title='Chọn thư mục'){
  const nav = onPick ? {hist:[],idx:-1} : mainDirNav;
  onPick = onPick || (p=>openFolder(p,$('#cRec').checked));
  const m=modal(`<h3>${title}</h3><div class="row"><button id="dbk" title="Quay lại thư mục trước (Alt+←)" aria-label="Quay lại thư mục trước">←</button><button id="dfw" title="Đi tiếp (Alt+→)" aria-label="Đi tiếp">→</button><input type="text" id="dp" style="flex:1"><button id="dgo">Đi</button></div>
    <div class="row" id="dq" style="flex-wrap:wrap;margin:4px 0"></div>
    <div class="row" style="margin:4px 0"><button id="dlan" title="Chọn thư mục chia sẻ trên máy khác trong cùng mạng LAN"><svg class="ic" aria-hidden="true"><use href="#i-net"/></svg>Mạng LAN</button><button id="dnew"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg>Tạo thư mục mới</button><input type="text" id="dnn" placeholder="Tên thư mục mới (ví dụ: Anh 5 sao)" style="flex:1;display:none"><button id="dmk" class="pri" style="display:none">Tạo</button></div>
    <div class="dirs" id="dl"></div>
    <div class="hint" id="di" style="margin-top:6px"></div>
    <div class="btns"><button onclick="this.closest('.back').remove()">Hủy</button><button class="pri" id="dok">Chọn thư mục này</button></div>`);
  let curPath='', seq=0, inLan=false;
  const paintNav=()=>{ m.querySelector('#dbk').disabled=!(inLan?nav.idx>=0:nav.idx>0); m.querySelector('#dfw').disabled=inLan||nav.idx>=nav.hist.length-1; };
  const setLan=()=>{ inLan=true; seq++; paintNav(); };
  const back=()=>{ if(inLan){ if(nav.idx>=0) go(nav.hist[nav.idx],true); return; } if(nav.idx>0) go(nav.hist[--nav.idx],true); };
  const fwd=()=>{ if(!inLan&&nav.idx<nav.hist.length-1) go(nav.hist[++nav.idx],true); };
  const go=async(path,moved)=>{
    const my=++seq, dp=m.querySelector('#dp'), typed=dp.value;
    const r=await api('/api/ls?path='+encodeURIComponent(path||'')); if(my!==seq) return;  // bỏ kết quả cũ đến muộn
    if(dp.value!==typed && document.activeElement===dp) return;   // người dùng đang gõ đường dẫn khác: không ghi đè
    dp.value=r.path; curPath=r.path; inLan=false;
    if(!moved&&!r.error&&r.path!==nav.hist[nav.idx]){ nav.hist.splice(nav.idx+1); nav.hist.push(r.path); nav.idx=nav.hist.length-1; }
    paintNav();
    m.querySelector('#di').textContent = r.error ? r.error : `${r.images} ảnh trong thư mục này • ${r.dirs.length} thư mục con`;
    const gb=n=>n>=1e12?(n/1e12).toFixed(1).replace('.',',')+' TB':Math.round(n/1e9)+' GB', dl=r.drives||[], curDrv=dl.find(d=>r.path.toLowerCase().startsWith(d.path.toLowerCase()));
    m.querySelector('#dq').innerHTML = (r.quick||[]).map(q=>`<button data-p="${esc(q.path)}" style="padding:2px 8px">${esc(q.name)}</button>`).join('') +
      (dl.length?`<select id="ddrv" aria-label="Chọn ổ đĩa">${curDrv?'':'<option value="" selected disabled>Chọn ổ đĩa</option>'}${dl.map(d=>`<option value="${esc(d.path)}"${d===curDrv?' selected':''}>${esc([d.path,d.label,d.free?'còn '+gb(d.free):''].filter(Boolean).join(' · '))}</option>`).join('')}</select>`:'');
    m.querySelectorAll('#dq button').forEach(b=>b.onclick=()=>go(b.dataset.p));
    { const ds=m.querySelector('#ddrv'); if(ds) ds.onchange=()=>go(ds.value); }
    const sep = r.path.includes('\\')?'\\':'/';
    const list=m.querySelector('#dl'); const isUnc=r.path.startsWith('\\\\');
    list.innerHTML = (r.parent?`<div data-p="${esc(r.parent)}"><svg class="ic" aria-hidden="true"><use href="#i-up"/></svg>..</div>`:(isUnc?`<div data-lan="1"><svg class="ic" aria-hidden="true"><use href="#i-up"/></svg>Quay lại Mạng LAN</div>`:'')) + r.dirs.map(d=>`<div data-p="${esc(r.path.replace(/[\\/]$/,'')+sep+d)}"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg>${esc(d)}</div>`).join('');
    list.querySelectorAll('div').forEach(x=>x.onclick=()=>x.dataset.lan?lanHome():go(x.dataset.p));
  };
  /* ----- Mạng LAN: quét máy, liệt kê thư mục chia sẻ, đăng nhập nếu cần ----- */
  const uncHost=p=>{ const t=(p||'').trim().replace(/\//g,'\\'); const mm=/^\\\\([^\\]+)\\?$/.exec(t); return mm?mm[1]:null; };
  const lanBox=()=>m.querySelector('#dl');
  const lanLogin=(host,msg)=>{ const box=lanBox(); const f=document.createElement('div'); f.className='lanlogin'; f.style.cssText='padding:10px;cursor:default';
    f.innerHTML=`<div class="warn" style="margin-bottom:6px">${esc(msg||'Máy này yêu cầu tài khoản để xem thư mục chia sẻ.')}</div>
      <div class="row"><label style="flex:0 0 90px">Máy</label><input type="text" id="lh" style="flex:1" value="${esc(host||'')}" placeholder="TEN-MAY hoặc 192.168.1.20"></div>
      <div class="row"><label style="flex:0 0 90px">Tài khoản</label><input type="text" id="lu" style="flex:1" placeholder="vd: PC-ANH\\ten hoặc ten"></div>
      <div class="row"><label style="flex:0 0 90px">Mật khẩu</label><input type="password" id="lp" style="flex:1"></div>
      <div class="row"><button class="pri" id="lgo">Kết nối</button><span class="hint" id="lmsg"></span></div>`;
    box.appendChild(f);
    f.querySelector('#lgo').onclick=async()=>{ const h=f.querySelector('#lh').value.trim(); f.querySelector('#lmsg').textContent='Đang kết nối…';
      try{ const r=await api('/api/lan/connect',{host:h,user:f.querySelector('#lu').value.trim(),password:f.querySelector('#lp').value});
        if(r.error){ f.querySelector('#lmsg').textContent=r.error; return; } lanShares(h); }catch(e){ f.querySelector('#lmsg').textContent=e.message; } }; };
  const lanShares=async host=>{ setLan(); const box=lanBox(); box.innerHTML=`<div data-lan="1"><svg class="ic" aria-hidden="true"><use href="#i-up"/></svg>Quay lại Mạng LAN</div><div style="padding:8px;cursor:default" class="hint">Đang lấy danh sách thư mục chia sẻ của ${esc(host)}…</div>`;
    box.querySelector('[data-lan]').onclick=lanHome; const r=await api('/api/lan/shares?host='+encodeURIComponent(host));
    m.querySelector('#di').textContent='Máy: '+host;
    box.innerHTML=`<div data-lan="1"><svg class="ic" aria-hidden="true"><use href="#i-up"/></svg>Quay lại Mạng LAN</div>`+(r.shares||[]).map(n=>`<div data-p="\\\\${esc(host)}\\${esc(n)}"><svg class="ic" aria-hidden="true"><use href="#i-folder"/></svg>${esc(n)}</div>`).join('');
    box.querySelectorAll('div[data-lan]').forEach(x=>x.onclick=lanHome); box.querySelectorAll('div[data-p]').forEach(x=>x.onclick=()=>go(x.dataset.p));
    if(!(r.shares||[]).length) lanLogin(host, r.need_login?undefined:(r.error||'Không thấy thư mục chia sẻ nào.')+' Có thể nhập tài khoản để thử lại.'); };
  const lanHome=()=>{ setLan(); const box=lanBox(); m.querySelector('#dp').value=''; m.querySelector('#di').textContent='Mạng LAN: quét để tìm máy, hoặc gõ \\\\TÊN-MÁY\\thư-mục vào ô trên rồi bấm Đi';
    box.innerHTML=`<div style="padding:8px;cursor:default"><button id="lscan"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>Quét máy trong mạng</button> <button id="lcred"><svg class="ic" aria-hidden="true"><use href="#i-key"/></svg>Nhập tài khoản…</button></div><div id="lres" style="cursor:default"></div>`;
    const res=box.querySelector('#lres');
    box.querySelector('#lcred').onclick=()=>{ if(!box.querySelector('.lanlogin')) lanLogin('', 'Nhập máy + tài khoản của máy đó (nếu thư mục có đặt mật khẩu).'); };
    box.querySelector('#lscan').onclick=async()=>{ res.innerHTML='<div class="hint" style="padding:8px">Đang quét mạng, vài giây…</div>';
      try{ const r=await api('/api/lan'); const hs=r.hosts||[];
        res.innerHTML = hs.length ? hs.map(h=>`<div data-h="${esc(h.host)}" style="cursor:pointer"><svg class="ic" aria-hidden="true"><use href="#i-pc"/></svg>${esc(h.name||h.ip)} <span class="hint">${esc(h.name&&h.ip?h.ip:'')}</span></div>`).join('')
          : '<div class="hint" style="padding:8px">Không thấy máy nào bật chia sẻ file. Hãy gõ thẳng đường dẫn dạng \\\\192.168.1.20\\Anh vào ô trên.</div>';
        res.querySelectorAll('[data-h]').forEach(x=>x.onclick=()=>lanShares(x.dataset.h)); }catch(e){ res.textContent=e.message; } };
    box.querySelector('#lscan').click(); };
  if(S.status.plat==='darwin'){ const b=m.querySelector('#dlan'); b.textContent='Kết nối máy khác (SMB)'; b.title='Kết nối thư mục chia sẻ trên máy khác trong mạng LAN';
    b.onclick=()=>{ setLan(); const box=lanBox(); m.querySelector('#dp').value=''; m.querySelector('#di').textContent='Mạng LAN trên Mac: nhập địa chỉ rồi bấm Kết nối; thư mục sẽ xuất hiện trong mục «Volumes».';
      box.innerHTML=`<div style="padding:10px;cursor:default"><div class="hint" style="margin-bottom:6px">Nhập địa chỉ máy chia sẻ, ví dụ <b>smb://192.168.1.10/TenThuMuc</b> (hoặc smb://TEN-MAY). Mac sẽ hỏi tài khoản nếu cần.</div><div class="row"><input type="text" id="smbu" placeholder="smb://192.168.1.10/TenThuMuc" style="flex:1"><button class="pri" id="smbg">Kết nối</button></div><div id="smbm" class="hint" style="margin-top:6px"></div></div>`;
      box.querySelector('#smbg').onclick=async()=>{ const msg=box.querySelector('#smbm'); msg.textContent='Đang kết nối…'; try{ const r=await api('/api/lan/mount',{url:box.querySelector('#smbu').value}); if(r.error){ msg.textContent=r.error; return; } msg.textContent='Đã gửi yêu cầu. Nhập tài khoản trong hộp thoại của Mac nếu có; xong bấm «Volumes» ở trên để chọn thư mục.'; }catch(e){ msg.textContent=e.message; } }; };
  } else m.querySelector('#dlan').onclick=lanHome;
  const goInput=()=>{ const v=m.querySelector('#dp').value; const h=uncHost(v); if(h) lanShares(h); else go(v); };
  m.querySelector('#dgo').onclick=goInput;
  m.querySelector('#dbk').onclick=back; m.querySelector('#dfw').onclick=fwd;
  m.addEventListener('keydown',e=>{ if(e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){ e.preventDefault(); e.stopPropagation(); (e.key==='ArrowLeft'?back:fwd)(); } });
  m.addEventListener('mouseup',e=>{ if(e.button===3||e.button===4){ e.preventDefault(); (e.button===3?back:fwd)(); } });  // nút lùi/tiến bên hông chuột
  const nn=m.querySelector('#dnn'), mk=m.querySelector('#dmk');
  m.querySelector('#dnew').onclick=()=>{ nn.style.display=mk.style.display=''; nn.focus(); };
  const make=async()=>{ if(!curPath){ toast('Đang tải danh sách thư mục, thử lại sau giây lát'); return; } try{ const r=await api('/api/mkdir',{parent:curPath,name:nn.value}); nn.value=''; nn.style.display=mk.style.display='none'; await go(r.path); toast('Đã tạo thư mục — bấm “Chọn thư mục này”'); }catch(e){ toast(e.message,4000); } };
  mk.onclick=make; nn.onkeydown=e=>{ if(e.key==='Enter') make(); };
  m.querySelector('#dp').onkeydown=e=>{ if(e.key==='Enter') goInput(); };
  m.querySelector('#dok').onclick=async()=>{ const p=m.querySelector('#dp').value.trim(); if(!p){ toast('Hãy chọn một thư mục chia sẻ (bấm vào máy, rồi bấm vào thư mục) trước'); return; } m.close(); await onPick(p); };
  paintNav();
  if(!start&&nav.idx>=0) go(nav.hist[nav.idx],true); else go(start||'');
}

$('#bCull').onclick=()=>{
  const s=S.settings; const net=!!S.status.online; const eyesOK=S.status.eyes&&net; const lock=net?'':'disabled';

   ${eyesOK||!net?'':'<div class="hint warn">Chưa có mô hình nhận diện mắt. App tự tải khi có mạng, hãy mở lại app sau vài phút.</div>'}
   <div class="row"><label>Mức lọc</label><div class="cpre" role="group" aria-label="Mức lọc"><button data-p="nhe">Nhẹ</button><button data-p="vua">Vừa</button><button data-p="manh">Mạnh</button></div></div>
   <details class="adv"><summary>Tùy chỉnh nâng cao</summary>
   ${sl('blur_ratio','Độ nét tối thiểu (so với cả thư mục)',0.1,1,0.05,s.blur_ratio)}
   ${sl('dark','Tối hơn mức',0.03,0.4,0.01,s.dark)}${sl('bright','Sáng hơn mức',0.6,0.98,0.01,s.bright)}
   ${sl('ear','Độ mở mắt tối thiểu',0.08,0.3,0.01,s.ear)}
   ${sl('dup_hamming','Độ khác nhau tối đa để coi là trùng',0,24,1,s.dup_hamming)}${sl('dup_seconds','Chụp cách nhau tối đa (giây)',1,120,1,s.dup_seconds)}
   </details>
   <div id="cres" style="margin-top:10px;font-weight:600"></div>
   <div class="btns"><button onclick="this.closest('.back').remove()">Đóng</button><button id="cprev">Xem trước</button><button class="pri" id="capply">Đánh dấu loại</button></div>`);
  const ids=['blur_ratio','dark','bright','ear','dup_hamming','dup_seconds'];

  const upd=()=>{ ids.forEach(i=>{ const e=m.querySelector('#'+i); m.querySelector('#'+i+'v').textContent = (+e.value%1?(+e.value).toFixed(2):e.value); });
    clearTimeout(tmr); tmr=setTimeout(async()=>{ const b={}; ids.forEach(i=>b[i]=+m.querySelector('#'+i).value);
      const r=await api('/api/settings',b); S.settings=r.settings; await loadPhotos(); show(); },250); };
  const paintPre=()=>m.querySelectorAll('.cpre button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===preOf())));

  ids.forEach(i=>{ const e=m.querySelector('#'+i); m.querySelector('#'+i+'v').textContent=(+e.value%1?(+e.value).toFixed(2):e.value); }); show();

   <span class="kbd">1–5</span> chấm sao, bấm lại cùng số để huỷ (<span class="kbd">0</span> cũng huỷ) &nbsp; <span class="kbd">X</span> loại / khôi phục &nbsp; <span class="kbd">6</span> đỏ <span class="kbd">7</span> vàng <span class="kbd">8</span> xanh lá <span class="kbd">9</span> xanh dương <span class="kbd">-</span> bỏ nhãn<br>
   <span class="kbd">Ctrl+Z</span> hoàn tác &nbsp; <span class="kbd">Ctrl+Y</span> xuất ảnh</div>
   <div class="hint" style="margin-top:10px">Ứng dụng không bao giờ xóa hay di chuyển file gốc. “Loại” chỉ là một dấu trong cơ sở dữ liệu; hãy xuất ảnh để lấy bộ ảnh đã chọn.</div>
   <div class="btns"><button class="pri" onclick="this.closest('.back').remove()">Đóng</button></div>`);
}
$('#bHelp').onclick=showHelp;
function setTheme(t){ document.documentElement.dataset.theme=t; try{ localStorage.setItem('ps_theme',t); }catch(e){} }
$('#bTheme').onclick=()=>{ const n=document.documentElement.dataset.theme==='neutral'?'glass':'neutral'; setTheme(n); toast(n==='glass'?'Giao diện Kính':'Giao diện tối trung tính — phù hợp để xem màu ảnh'); };

/* ---------- điều khiển thanh trên ---------- */
$('#fFilter').innerHTML = FILTERS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
$('#fFilter').onchange=e=>{ S.filter=e.target.value; S.keep.clear(); if(S.filter!=='pv'){ const o=e.target.querySelector('option[value=pv]'); if(o) o.remove(); } applyView(); e.target.blur(); };
{ const w=$('#gridwrap'); w.setAttribute('role','listbox'); w.setAttribute('aria-multiselectable','true'); w.setAttribute('aria-label','Ảnh trong thư mục — dùng phím mũi tên để chọn, 0–5 chấm sao, X loại, Enter mở ảnh'); if(!w.hasAttribute('tabindex')) w.tabIndex=0; $('#grid')&&$('#grid').setAttribute('role','presentation'); }
$('#fSort').onchange=e=>{ S.sort=e.target.value; applyView(); e.target.blur(); };
try{ S.pair=localStorage.getItem('ps_pair')||'both'; }catch(e){ S.pair='both'; } $('#fPair').value=S.pair;
$('#fPair').onchange=e=>{ S.pair=e.target.value; try{ localStorage.setItem('ps_pair',S.pair); }catch(e){} applyView(); e.target.blur(); };
$('#fSize').oninput=e=>{ document.documentElement.style.setProperty('--sz', e.target.value+'px'); try{ localStorage.setItem('ps_sz',e.target.value); }catch(_){} renderGrid(); };
try{ const z=+localStorage.getItem('ps_sz'); if(z>=100&&z<=320){ $('#fSize').value=z; document.documentElement.style.setProperty('--sz', z+'px'); } }catch(e){}

/* ---------- vòng lặp trạng thái ---------- */
let busy=false;
async function poll(force){
  if(busy) return; busy=true;
  try{
    const st=await api('/api/status'); const was=S.status.state; S.status=st; S.settings=st.settings;
    if(!S.catInit){ S.catInit=true; if(st.root) hideCatalog(); else showCatalog(); }
    const bar=$('#prog i');
    if(st.state==='scanning'){ clearTimeout(S.barT); S.barT=0; bar.style.width=st.total?(100*(st.done+st.thumbs)/(2*st.total))+'%':'0'; }
    else if(st.state==='done'&&was==='scanning'){ bar.style.width='100%'; S.barT=setTimeout(()=>{ S.barT=0; bar.style.width='0'; },1200); } // đầy thanh một lần rồi ẩn
    else if(!S.barT) bar.style.width='0';
    const key=st.done+':'+st.thumbs+':'+(st.quick||0)+':'+st.state+':'+st.online, now=Date.now();
    const fin = was==='scanning' && st.state!=='scanning';
    if(force || fin || (key!==S.lastKey && (st.state!=='scanning' || now-(S.lastLoad||0)>1500))){
      S.lastKey=key; S.lastLoad=now; if(st.state!=='idle'){ await loadPhotos(); if(st.state!=='scanning'||!S.people.length||fin) await loadPeople(); }
    }
    renderStatus();
  }catch(e){ /* api() đã báo mất kết nối */ }
  busy=false;
}
setInterval(()=>poll(false), 900);
poll(true).then(()=>{ if(!S.photos.length) renderGrid(); });
</script>
