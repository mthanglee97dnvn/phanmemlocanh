<style>

  --blur:none;--r:12px;--shadow:none;--modal:#1e2024;--pri:#4da3ff;--pri-tx:#04121f;--pri-sh:none}

html,body{height:100%;margin:0;color:var(--tx);font:13px/1.45 Poppins,"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
body{background:

button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;transition:transform .12s,border-color .12s,background .12s}

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FLAG = {blur:'Mờ', dark:'Tối', bright:'Sáng quá', eyes:'Nhắm mắt?', dup:'Trùng'};
const LABELS = ['red','yellow','green','blue','purple'];
const LABEL_NAME = {red:'Đỏ',yellow:'Vàng',green:'Xanh lá',blue:'Xanh dương',purple:'Tím'};
const FILTERS = [['all','Tất cả'],['unrated','Chưa chấm'],['r1','★ 1+'],['r2','★★ 2+'],['r3','★★★ 3+'],['r4','★★★★ 4+'],['r5','★★★★★ 5'],
  ['rej','✕ Đã loại'],['norej','Không bị loại'],['issues','⚠ Có vấn đề (mọi loại)'],['blur','Mờ'],['dark','Tối'],['bright','Sáng quá'],['eyes','Nhắm mắt?'],['dup','Trùng lặp (bản kém hơn)'],
  ['best','Tốt nhất trong nhóm trùng'],['face','Có khuôn mặt'],['noface','Không có khuôn mặt'],['raw','Chỉ file RAW (ARW, CR2, NEF…)'],['jpg','Chỉ JPG / ảnh thường']];
const RAWRE=/\.(arw|srf|sr2|cr2|cr3|nef|nrw|dng|orf|raf|rw2|pef|srw|3fr|erf|kdc|mrw|x3f)$/i;
const S = {photos:[], by:new Map(), view:[], people:[], sel:new Set(), cur:null, anchor:null, filter:'all', sort:'name', person:null,
           status:{}, undo:[], viewer:false, boxes:true, zoom:false, lastDone:-1, settings:{}};

async function api(path, body){
  const r = await fetch(path, body===undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function toast(msg, ms=2200){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none', ms); }
function pname(id){ const p = S.people.find(p=>p.id===id); return p && p.name ? p.name : 'Người '+id; }

/* ---------- modal ---------- */
function modal(html){
  const b = document.createElement('div'); b.className='back';
  b.innerHTML = `<div class="modal">${html}</div>`;
  b.addEventListener('mousedown', e=>{ if(e.target===b) b.remove(); });
  document.body.appendChild(b);
  b.close = ()=>b.remove();
  return b;
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ const m=document.querySelector('.back'); if(m){ m.remove(); e.stopPropagation(); } } }, true);

/* ---------- dữ liệu ---------- */
async function loadPhotos(){
  S.photos = await api('/api/photos');
  S.by = new Map(S.photos.map(p=>[p.id,p]));
  for(const id of [...S.sel]) if(!S.by.has(id)) S.sel.delete(id);
  applyView();
}
async function loadPeople(){ S.people = await api('/api/people'); renderPeople(); }
function matchFilter(p){
  const f=S.filter;
  switch(f){
    case 'all': return true; case 'unrated': return p.rating===0;
    case 'rej': return p.rating===-1; case 'norej': return p.rating>=0;
    case 'issues': return p.flags.length>0;
    case 'raw': return RAWRE.test(p.name); case 'jpg': return !RAWRE.test(p.name);
    case 'best': return p.grp>0 && p.best; case 'face': return p.nf>0; case 'noface': return p.nf===0;
    case 'blur': case 'dark': case 'bright': case 'eyes': case 'dup': return p.flags.includes(f);
    default: if(f[0]==='r') return p.rating>=+f.slice(1); return true;
  }
}
function applyView(){
  let v = S.photos.filter(p=>matchFilter(p) && (S.person===null || p.people.includes(S.person)));
  const cmp = {name:(a,b)=>a.dir.localeCompare(b.dir)||a.name.localeCompare(b.name,undefined,{numeric:true}),
               time:(a,b)=>(a.taken||0)-(b.taken||0)||a.name.localeCompare(b.name),
               score:(a,b)=>b.score-a.score, sharp:(a,b)=>(b.nf?b.fsharp:b.sharp)-(a.nf?a.fsharp:a.sharp)}[S.sort];
  v.sort(cmp); S.view=v;
  if(S.cur===null || !v.some(p=>p.id===S.cur)) S.cur = v.length ? v[0].id : null;
  renderGrid(); scheduleInfo();
}

/* ---------- lưới ---------- */
const cells = new Map();
function cellHTML(p){
  const flags = p.an===false ? '<span class="chip" style="opacity:.7">…</span>' : p.flags.map(f=>`<span class="chip ${f}">${FLAG[f]}</span>`).join('');
  const grp = p.grp ? `<span class="chip" style="background:rgba(0,121,107,.85)">⧉${p.grp}${p.best?' ★':''}</span>` : '';
  return `<div class="im"><img loading="lazy" src="/thumb/${p.id}.jpg?v=${p.tv}" alt=""><div class="lab ${p.label?'l-'+p.label:''}"></div>
    <div class="flags">${flags}${grp}</div><div class="xmark">✕</div>
    <div class="stars">${p.rating>0?'★'.repeat(p.rating):''}</div>${p.nf?`<span class="nface">👤${p.nf}</span>`:''}</div>
    <div class="nm" title="${esc(p.name)}">${esc(p.name)}</div>`;
}
const sigs = new Map();
const sigOf = p => [p.tv,p.rating,p.label,p.flags.join(),p.grp,p.best,p.nf,p.an,p.people.join()].join('|');
function renderGrid(){
  const wrap=$('#gridwrap');
  if(!S.photos.length){
    cells.clear(); sigs.clear();
    wrap.innerHTML = `<div id="empty"><h2>${S.status.state==='scanning'?'Đang đọc ảnh…':(S.status.state==='error'?'Không mở được thư mục':'Chưa có ảnh nào')}</h2>${S.status.state==='error'?`<div style="color:#ffb3b3;max-width:520px;margin:0 auto 10px;word-break:break-word">${esc(S.status.message||'')}</div>`:''}${S.status.state==='done'&&S.status.root&&!S.photos.length?`<div style="color:#ffd9a0;margin-bottom:8px">Thư mục «${esc(S.status.root)}» không có ảnh nào (JPG/PNG/RAW/HEIC).</div>`:''}<div>Mở một thư mục ảnh để bắt đầu.<br>PhotoSift sẽ tự phát hiện ảnh mờ, tối, nhắm mắt, trùng lặp<br>và nhóm ảnh theo từng người.</div><button class="pri" onclick="pickFolder()">📁 Mở thư mục</button></div>`;
    renderStatus(); return;
  }
  if(!$('#grid')){ cells.clear(); sigs.clear(); wrap.innerHTML='<div id="grid"></div>'; }
  const grid=$('#grid'); const want=new Set(S.view.map(p=>p.id));
  for(const [id,d] of [...cells]) if(!want.has(id)){ d.remove(); cells.delete(id); sigs.delete(id); }
  let ref=grid.firstChild;
  for(const p of S.view){
    let d=cells.get(p.id); const sg=sigOf(p);
    if(!d){ d=document.createElement('div'); d.className='cell'; d.dataset.id=p.id; d.innerHTML=cellHTML(p); cells.set(p.id,d); sigs.set(p.id,sg); }
    else if(sigs.get(p.id)!==sg){ d.innerHTML=cellHTML(p); sigs.set(p.id,sg); }
    if(d===ref) ref=ref.nextSibling; else grid.insertBefore(d,ref);
    decorate(p.id);
  }
  renderStatus();
}
function decorate(id){
  const d=cells.get(id), p=S.by.get(id); if(!d||!p) return;
  d.classList.toggle('sel', S.sel.has(id)); d.classList.toggle('cur', S.cur===id); d.classList.toggle('rej', p.rating===-1);
}
function refreshCell(id){ const d=cells.get(id), p=S.by.get(id); if(d&&p){ d.innerHTML=cellHTML(p); sigs.set(id,sigOf(p)); decorate(id);} }
function setCur(id, {extend=false, toggle=false, scroll=true}={}){
  const old=S.cur; S.cur=id;
  if(extend && S.anchor!==null){
    const a=S.view.findIndex(p=>p.id===S.anchor), b=S.view.findIndex(p=>p.id===id);
    const [lo,hi]=a<b?[a,b]:[b,a]; const prev=[...S.sel]; S.sel=new Set(S.view.slice(lo,hi+1).map(p=>p.id)); prev.forEach(decorate);
    S.sel.forEach(decorate);
  } else if(toggle){ S.sel.has(id)?S.sel.delete(id):S.sel.add(id); S.anchor=id; }
  else { const prev=[...S.sel]; S.sel=new Set([id]); S.anchor=id; prev.forEach(decorate); }
  decorate(old); decorate(id);
  if(scroll){ const d=cells.get(id); if(d) d.scrollIntoView({block:'nearest'}); }
  renderStatus(); if(S.viewer) showViewer(); scheduleInfo();
}
$('#gridwrap').addEventListener('click', e=>{
  const c=e.target.closest('.cell'); if(!c) return;
  setCur(+c.dataset.id, {extend:e.shiftKey, toggle:e.ctrlKey||e.metaKey, scroll:false});
});
$('#gridwrap').addEventListener('dblclick', e=>{ const c=e.target.closest('.cell'); if(c){ setCur(+c.dataset.id,{scroll:false}); openViewer(); } });

function renderStatus(){
  const st=S.status||{};
  $('#sCount').textContent = `${S.view.length}/${S.photos.length} ảnh` + (st.state==='done'&&st.timing&&st.timing.all_s?` • ⏱ thumbnail ${st.timing.thumb_s}s · đọc ảnh ${st.timing.read_s}s · tổng ${st.timing.all_s}s`:'')+
    (st.state==='scanning'?` • thumbnail ${Math.max(st.thumbs,st.quick||0)}/${st.total} • phân tích ${st.done}/${st.total} (chạy nền — bạn có thể chấm ảnh ngay)`:'');
  $('#sSel').textContent = S.sel.size>1 ? `${S.sel.size} đã chọn` : '';
  const net=$('#sNet'); net.innerHTML = st.online ? '<span class="ok">● Trực tuyến</span>' : '<span class="warn">● Ngoại tuyến — đang khoá lọc tối/sáng/nhắm mắt</span>';
  const p=S.by.get(S.cur);
  $('#sCur').textContent = p ? `${p.name} • ${p.w}×${p.h} • điểm ${p.score} • độ nét ${p.nf?p.fsharp+' (mặt)':p.sharp}` : '';
}

/* ---------- chấm điểm / nhãn + hoàn tác ---------- */
function targets(){ if(S.viewer) return S.cur!==null?[S.cur]:[]; if(S.sel.size && S.sel.has(S.cur)) return [...S.sel]; return S.cur!==null?[S.cur]:[]; }
async function rate(ids, r, {noUndo=false}={}){
  if(!ids.length) return;
  const old=ids.map(i=>[i,S.by.get(i).rating]);
  ids.forEach(i=>S.by.get(i).rating=r);
  await api('/api/rate',{ids,rating:r});
  if(!noUndo){ S.undo.push({t:'rate',old}); $('#bUndo').disabled=false; }
  afterChange(ids);
}
async function label(ids, l){
  if(!ids.length) return;
  const old=ids.map(i=>[i,S.by.get(i).label]);
  ids.forEach(i=>S.by.get(i).label=l);
  await api('/api/label',{ids,label:l});
  S.undo.push({t:'label',old}); $('#bUndo').disabled=false; afterChange(ids);
}
function afterChange(ids){
  if(S.filter==='all'){ ids.forEach(refreshCell); renderStatus(); } else applyView();
  if(S.viewer) showViewer();
}
async function undo(){
  const u=S.undo.pop(); if(!u) return;
  $('#bUndo').disabled=!S.undo.length;
  if(u.t==='rate'){ u.old.forEach(([i,r])=>{ if(S.by.has(i)) S.by.get(i).rating=r; }); await api('/api/rate',{pairs:u.old.map(([i,r])=>[i,r])}); }
  else { const g={}; u.old.forEach(([i,l])=>{ if(S.by.has(i)) S.by.get(i).label=l; (g[l]=g[l]||[]).push(i); });
         for(const l in g) await api('/api/label',{ids:g[l],label:l}); }
  applyView(); if(S.viewer) showViewer(); toast('Đã hoàn tác');
}
$('#bUndo').onclick=undo;

const SC_W=96; let stripOn=true; try{ stripOn=localStorage.getItem('ps_strip')!=='0'; }catch(e){}
let stripLast=-1;
function renderStrip(center){
  const v=$('#viewer'); v.classList.toggle('nostrip',!stripOn); if(!stripOn||!S.viewer) return;
  const st=$('#strip'), inn=$('#stripin'); const n=S.view.length;
  inn.style.width=(n*SC_W+8)+'px';
  const ix=S.view.findIndex(p=>p.id===S.cur);
  if(center && ix>=0){ st.scrollLeft=Math.max(0, ix*SC_W - st.clientWidth/2 + SC_W/2); }
  const lo=Math.max(0,Math.floor(st.scrollLeft/SC_W)-4), hi=Math.min(n-1,Math.ceil((st.scrollLeft+st.clientWidth)/SC_W)+4);
  let html='';
  for(let i=lo;i<=hi;i++){ const p=S.view[i];
    html+=`<div class="sc${p.id===S.cur?' cur':''}${p.rating<0?' rej':''}" data-id="${p.id}" style="left:${4+i*SC_W}px" title="${esc(p.name)}"><img loading="lazy" src="/thumb/${p.id}.jpg?v=${p.tv}" alt="">`+
      (p.rating>0?`<span class="rt">${'★'.repeat(p.rating)}</span>`:'')+(p.label?`<span class="lb l-${p.label}"></span>`:'')+`<div class="nm">${esc(p.name)}</div></div>`; }
  inn.innerHTML=html;
}
{ const st=$('#strip'); let raf=0;
  st.addEventListener('scroll',()=>{ if(raf) return; raf=requestAnimationFrame(()=>{ raf=0; renderStrip(false); }); });
  st.addEventListener('wheel',e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){ st.scrollLeft+=e.deltaY; e.preventDefault(); } },{passive:false});
  $('#stripin').addEventListener('click',e=>{ const c=e.target.closest('.sc'); if(c) setCur(+c.dataset.id,{scroll:false}); });
  window.addEventListener('resize',()=>renderStrip(false)); }

/* ---------- trình xem ---------- */
function openViewer(){ if(S.cur===null) return; S.viewer=true; S.zoom=false; $('#viewer').classList.add('on'); showViewer(); }
function toggleStrip(){ stripOn=!stripOn; try{ localStorage.setItem('ps_strip',stripOn?'1':'0'); }catch(e){} renderStrip(true); if(S.viewer) showViewer(); toast(stripOn?'Bật dải thumbnail':'Tắt dải thumbnail (phím T để bật lại)'); }
function closeViewer(){ S.viewer=false; updateMask(); $('#viewer').classList.remove('on'); if(S.cur!==null){ const d=cells.get(S.cur); d&&d.scrollIntoView({block:'nearest'}); } }
let vTok=0;
const VPRE=new Map();
async function showViewer(){
  const p=S.by.get(S.cur); if(!p){ closeViewer(); return; }
  const tok=++vTok; const img=$('#vimg'); $('#vstage').classList.toggle('zoom',S.zoom);
  const src = S.zoom ? `/api/preview?id=${p.id}&s=0` : `/api/preview?id=${p.id}&s=2000`;
  if(img.dataset.src!==src){
    img.dataset.src=src;
    const thumb=`/thumb/${p.id}.jpg?v=${p.tv}`;
    const fit=(w,h)=>{ // giữ khung ảnh đúng cỡ cuối cùng ngay cả khi mới hiện thumbnail nhỏ → không bị "nhảy"/bóng ma
      if(S.zoom||!w||!h){ img.style.width=img.style.height=''; return; }
      const mw=window.innerWidth-290, mh=window.innerHeight-(stripOn?116:0), k=Math.min(mw/w,mh/h);
      img.style.width=Math.round(w*k)+'px'; img.style.height=Math.round(h*k)+'px'; };
    const apply=(im,u,clear)=>{ // chỉ đổi ảnh khi ảnh mới đã giải mã xong và khung đã đúng cỡ → không còn khung hình lẫn ảnh cũ
      const go=()=>{ if(tok!==vTok||img.dataset.src!==src) return; fit(im.naturalWidth,im.naturalHeight); img.src=u;
        if(clear) setTimeout(()=>{ if(img.dataset.src===src) img.style.width=img.style.height=''; },80); };
      (im.decode?im.decode().then(go,go):go()); };
    const done=VPRE.get(src);
    if(done&&done.complete&&done.naturalWidth){ apply(done,src,true); }   // đã nạp trước: hiện ngay, không qua thumbnail
    else{
      const t=new Image(); t.onload=()=>{ if(!big.complete||!big.naturalWidth) apply(t,thumb,false); }; t.src=thumb;
      const big=new Image(); VPRE.set(src,big);
      big.onload=()=>apply(big,src,true);
      big.src=src;
    }
  }
  const ix=S.view.findIndex(x=>x.id===p.id);
  for(const o of [S.view[ix+1],S.view[ix-1],S.view[ix+2]]) if(o){ const u=`/api/preview?id=${o.id}&s=2000`; if(!VPRE.has(u)){ const pre=new Image(); VPRE.set(u,pre); pre.src=u; if(VPRE.size>12){ VPRE.delete(VPRE.keys().next().value); } } }
  renderInfo(p, ix); loadBoxes(p, tok); updateMask(); renderStrip(true);
}
$('#vimg').addEventListener('click', e=>{
  const img=e.target; const r=img.getBoundingClientRect(); const fx=(e.clientX-r.left)/r.width, fy=(e.clientY-r.top)/r.height;
  S.zoom=!S.zoom; showViewer();
  if(S.zoom){ const st=$('#vstage'); const wait=()=>{ if(img.naturalWidth>1000||img.complete){ st.scrollLeft=img.offsetWidth*fx-st.clientWidth/2; st.scrollTop=img.offsetHeight*fy-st.clientHeight/2; } };
              img.addEventListener('load',()=>setTimeout(wait,30),{once:true}); }
});

  return '<dl class="ex">'+rows.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v||'')}</dd>`).join('')+'</dl>';
}
function drawHist(cv,h){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth||260, H=cv.clientHeight||120;
  cv.width=W*dpr; cv.height=H*dpr; const c=cv.getContext('2d'); c.scale(dpr,dpr); c.clearRect(0,0,W,H);
  if(!h){ c.fillStyle='#a9c0da'; c.font='12px sans-serif'; c.fillText('Đang tải…',10,20); return; }
  c.strokeStyle='rgba(255,255,255,.14)'; c.lineWidth=1; for(let i=1;i<4;i++){ const x=Math.round(W*i/4)+.5; c.beginPath(); c.moveTo(x,0); c.lineTo(x,H); c.stroke(); }
  const vals=[].concat(h.r.slice(1,255),h.g.slice(1,255),h.b.slice(1,255)).sort((a,b)=>a-b);
  const peak=Math.max(1,vals[Math.floor(vals.length*0.995)]*1.1);   // bỏ qua cột đỉnh ở 0/255 để biểu đồ không bị "cụt"
  c.globalCompositeOperation='lighter';
  [['#ff0000',h.r],['#00ff00',h.g],['#0000ff',h.b]].forEach(([col,a])=>{
    c.fillStyle=col; c.beginPath(); c.moveTo(0,H);
    for(let i=0;i<256;i++) c.lineTo(i/255*W, H-Math.min(1,a[i]/peak)*(H-4));
    c.lineTo(W,H); c.closePath(); c.fill();
  });
  c.globalCompositeOperation='source-over';
}
function histHTML(h){ return `<canvas class="hist"></canvas><div class="hstat"><span>Cháy sáng: <b>${h?h.hi+'%':'…'}</b></span><span>Mất chi tiết tối: <b>${h?h.lo+'%':'…'}</b></span></div>`; }
function hsHTML(){ return ['off:Tắt','hi:Hiện vùng cháy sáng (đỏ)','lo:Hiện vùng mất chi tiết tối (cam)'].map(o=>{ const [v,t]=o.split(':'); return `<label><input type="radio" name="hs" value="${v}" ${S.hs===v?'checked':''}> ${t}</label>`; }).join(''); }
async function fillSections(sel,id,kind){
  const el=document.querySelector(sel); if(!el) return; el.dataset.id=id;
  const cached=INFO.get(id);
  const render=r=>{

    el.innerHTML = kind==='v'
      ? Hh + secHTML('hs','Vùng cháy sáng / mất chi tiết',`<div class="hs">${hsHTML()}</div><div class="hint" style="margin-top:6px">Phím <span class="kbd">H</span> để đổi nhanh</div>`) + E
      : E + Hh + ((q&&q.an)?secHTML('q','Chất lượng tự động',`<dl class="ex"><dt>Điểm</dt><dd>${q.score}</dd><dt>Độ nét</dt><dd>${q.nf?q.fsharp+' (mặt)':q.sharp}</dd><dt>Độ sáng TB</dt><dd>${Math.round(q.lum*100)}%</dd><dt>Khuôn mặt</dt><dd>${q.nf}</dd><dt>Cảnh báo</dt><dd>${q.flags.map(f=>FLAG[f]).join(', ')||'—'}</dd></dl>`):'');

    el.querySelectorAll('input[name=hs]').forEach(i=>i.onchange=()=>setHS(i.value));
  };
  render(cached);
  if(cached) return;

function cols(){ const g=$('#grid'); return g ? getComputedStyle(g).gridTemplateColumns.split(' ').length : 1; }
function move(delta, shift){
  if(!S.view.length) return; let ix=S.view.findIndex(p=>p.id===S.cur); ix=Math.max(0,Math.min(S.view.length-1,(ix<0?0:ix)+delta));
  setCur(S.view[ix].id,{extend:shift});
}
document.addEventListener('keydown', e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName) || document.querySelector('.back')) return;
  const k=e.key, mod=e.ctrlKey||e.metaKey;
  if(mod && k.toLowerCase()==='a'){ e.preventDefault(); S.sel=new Set(S.view.map(p=>p.id)); S.view.forEach(p=>decorate(p.id)); renderStatus(); return; }
  if(mod && k.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  if(mod) return;
  if(k==='ArrowRight'){ e.preventDefault(); move(1,e.shiftKey); }
  else if(k==='ArrowLeft'){ e.preventDefault(); move(-1,e.shiftKey); }
  else if(k==='ArrowDown'){ e.preventDefault(); S.viewer?move(1):move(cols(),e.shiftKey); }
  else if(k==='ArrowUp'){ e.preventDefault(); S.viewer?move(-1):move(-cols(),e.shiftKey); }
  else if(k==='Enter'||k===' '){ e.preventDefault(); S.viewer?closeViewer():openViewer(); }
  else if(k==='Escape'){ if(S.viewer) closeViewer(); }
  else if(/^[0-5]$/.test(k)) rate(targets(), +k);
  else if(k==='x'||k==='X'){ const t=targets(); if(t.length) rate(t, S.by.get(t[0]).rating===-1?0:-1); }
  else if(k>='6'&&k<='9') label(targets(), LABELS[+k-6]);
  else if(k==='-') label(targets(), '');
  else if(k==='h'||k==='H'){ if(S.viewer) cycleHS(); }
  else if(k==='f'||k==='F'){ S.boxes=!S.boxes; if(S.viewer) showViewer(); }
  else if(k==='z'||k==='Z'){ if(S.viewer){ S.zoom=!S.zoom; showViewer(); } }
  else if(k==='t'||k==='T'){ if(S.viewer) toggleStrip(); }
  else if(k==='?') showHelp();
});

      <div class="row"><label style="flex:0 0 90px">Tài khoản</label><input type="text" id="lu" style="flex:1" placeholder="vd: PC-ANH\\ten hoặc ten"></div>

  const lanShares=async host=>{ setLan(); const box=lanBox(); box.innerHTML=`<div data-lan="1">⬆ Quay lại Mạng LAN</div><div style="padding:8px;cursor:default" class="hint">Đang lấy danh sách thư mục chia sẻ của ${esc(host)}…</div>`;

  const lanHome=()=>{ setLan(); const box=lanBox(); m.querySelector('#dp').value=''; m.querySelector('#di').textContent='Mạng LAN: quét để tìm máy, hoặc gõ \\\\TÊN-MÁY\\thư-mục vào ô trên rồi bấm Đi';

   ${sl('dup_hamming','&nbsp;&nbsp;Độ giống (dHash ≤)',0,24,1,s.dup_hamming)}${sl('dup_seconds','&nbsp;&nbsp;Cách nhau tối đa (giây)',1,120,1,s.dup_seconds)}
   <div id="cres" style="margin-top:10px;font-weight:600"></div>
   <div class="btns"><button onclick="this.closest('.back').remove()">Đóng</button><button class="pri" id="capply">Đánh dấu loại</button></div>`);
  const ids=['blur_ratio','dark','bright','ear','dup_hamming','dup_seconds'];
  let tmr=null;
  const cand=()=>{ const on=k=>m.querySelector('#k_'+k) && m.querySelector('#k_'+k).checked && !m.querySelector('#k_'+k).disabled;
    const sel=['blur','dark','bright','eyes','dup'].filter(on); return S.photos.filter(p=>p.rating===0 && p.flags.some(f=>sel.includes(f))); };
  const show=()=>{ const c=cand(); m.querySelector('#cres').innerHTML = `Sẽ loại <span class="warn">${c.length}</span> / ${S.photos.filter(p=>p.rating===0).length} ảnh chưa chấm`; };
  const upd=()=>{ ids.forEach(i=>{ const e=m.querySelector('#'+i); m.querySelector('#'+i+'v').textContent = (+e.value%1?(+e.value).toFixed(2):e.value); });
    clearTimeout(tmr); tmr=setTimeout(async()=>{ const b={}; ids.forEach(i=>b[i]=+m.querySelector('#'+i).value);
      const r=await api('/api/settings',b); S.settings=r.settings; await loadPhotos(); show(); },250); };
  ids.forEach(i=>m.querySelector('#'+i).oninput=upd); m.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=show);
  ids.forEach(i=>{ const e=m.querySelector('#'+i); m.querySelector('#'+i+'v').textContent=(+e.value%1?(+e.value).toFixed(2):e.value); }); show();
  m.querySelector('#capply').onclick=async()=>{ const c=cand().map(p=>p.id); m.close(); await rate(c,-1); S.filter='rej'; $('#fFilter').value='rej'; applyView(); toast(`Đã đánh dấu loại ${c.length} ảnh — kiểm tra lại trong bộ lọc “Đã loại”`,4000); };
};

/* ---------- xuất ---------- */
$('#bExport').onclick=()=>{
  const m=modal(`<h3>📤 Xuất ảnh (sao chép)</h3>
   <div class="row"><label>Ảnh cần xuất</label><select id="xs" style="flex:1"><option value="sel">Đang chọn (${S.sel.size||(S.cur!==null?1:0)})</option><option value="view">Tất cả ảnh đang hiển thị (${S.view.length})</option><option value="keep">Tất cả trừ ảnh bị loại (${S.photos.filter(p=>p.rating>=0).length})</option><option value="r5">★★★★★ 5 sao (${S.photos.filter(p=>p.rating===5).length})</option><option value="r3">★ 3 sao trở lên (${S.photos.filter(p=>p.rating>=3).length})</option></select></div>
   <div class="row"><label>Thư mục đích</label><input type="text" id="xd" style="flex:1" placeholder="Chọn thư mục…"><button id="xb">…</button></div>
   <div class="row"><label>Mẫu tên file</label><input type="text" id="xt" style="flex:1" value="{name}"></div>
   <div class="hint" style="margin:-4px 0 6px 160px">{name} {date} {time} {seq} {person}</div>
   <div class="row"><label></label><label style="flex:1;color:var(--tx)"><input type="checkbox" id="xp"> Tách thư mục theo từng người (ảnh nhiều người được chép vào nhiều thư mục)</label></div>
   <div class="row"><label></label><label style="flex:1;color:var(--tx)"><input type="checkbox" id="xx" checked> Ghi sao/nhãn/tên người vào file .xmp (Lightroom, Bridge, Capture One đọc được với RAW)</label></div>
   <div id="xr" class="hint"></div>
   <div class="btns"><button onclick="this.closest('.back').remove()">Đóng</button><button class="pri" id="xgo">Sao chép</button></div>`);
  if(S.filter!=='all') m.querySelector('#xs').value='view';
  m.querySelector('#xb').onclick=()=>pickFolder(m.querySelector('#xd').value||'', p=>{ m.querySelector('#xd').value=p; }, 'Chọn thư mục đích');
  m.querySelector('#xgo').onclick=async()=>{
    const sc=m.querySelector('#xs').value; let list;
    if(sc==='sel') list=targetsForExport(); else if(sc==='view') list=S.view.map(p=>p.id); else if(sc==='keep') list=S.photos.filter(p=>p.rating>=0).map(p=>p.id); else if(sc==='r5') list=S.photos.filter(p=>p.rating===5).map(p=>p.id); else list=S.photos.filter(p=>p.rating>=3).map(p=>p.id);
    const dest=m.querySelector('#xd').value.trim(); if(!dest){ toast('Chưa chọn thư mục đích'); return; } if(!list.length){ toast('Không có ảnh để xuất'); return; }
    m.querySelector('#xgo').disabled=true;
    const xr=m.querySelector('#xr'); const fmt=n=>n.toLocaleString('vi-VN');
    xr.innerHTML=`<div class="xprog" style="height:14px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0 4px"><i id="xbar" style="display:block;height:100%;width:0;background:linear-gradient(90deg,#f5a623,#ffd27a);transition:width .25s"></i></div><div id="xtx" style="color:var(--tx)">Đang chuẩn bị…</div>`;
    const bar=xr.querySelector('#xbar'), tx=xr.querySelector('#xtx');
    try{
      await api('/api/export',{ids:list,dest,by_person:m.querySelector('#xp').checked,template:m.querySelector('#xt').value,xmp:m.querySelector('#xx').checked});
      let st;
      for(;;){
        st=await api('/api/export/status'); const tot=st.total||list.length, pct=tot?Math.min(100,Math.round(100*st.done/tot)):0;
        bar.style.width=pct+'%';
        tx.innerHTML=`<b>${pct}%</b> &nbsp;•&nbsp; đã xuất <b>${fmt(st.done)}</b> / ${fmt(tot)} ảnh`+(st.state==='running'&&st.cur?` &nbsp;•&nbsp; <span class="hint">${esc(st.cur)}</span>`:'');
        if(st.state!=='running') break;
        if(!document.body.contains(m)) return;
        await new Promise(r=>setTimeout(r,300));
      }
      if(st.state==='error') throw new Error(st.message||'Lỗi khi xuất');
      bar.style.width='100%';
      tx.innerHTML=`<span class="ok"><b>Hoàn tất 100%</b> — đã xuất ${fmt(st.done)}/${fmt(st.total)} ảnh (${fmt(st.copied)} file).</span>`+(st.n_errors?` <span class="warn">${st.n_errors} lỗi: ${esc((st.errors||[]).join('; '))}</span>`:'');
    }catch(err){ xr.innerHTML=`<span class="warn">${esc(err.message)}</span>`; }
    m.querySelector('#xgo').disabled=false;
  };
};
/* Gửi ảnh đã lọc sang chế độ Dàn trang */
if(window.parent!==window && window.parent.PS) $('#bLayout').hidden=false;
addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&(e.key==='1'||e.key==='2')&&window.parent.PS){ e.preventDefault(); window.parent.PS.show(e.key==='1'?'filter':'layout'); } });
$('#bLayout').onclick=async()=>{
  const L=window.parent.PS&&window.parent.PS.layout(); if(!L){ toast('Dàn trang đang khởi động, thử lại sau giây lát'); return; }
  const st=await L.state(); const inView=S.view.filter(p=>p.rating!==-1);
  const stars=n=>inView.filter(p=>p.rating>=n).length; const folder=(S.photos[0]&&S.photos[0].dir||'').split(/[\\/]/).filter(Boolean).pop()||'Album';
  const m=modal(`<h3>Gửi sang Dàn trang</h3>
   <div class="row"><label>Ảnh cần gửi</label><select id="ls" style="flex:1"><option value="sel">Đang chọn (${S.sel.size||(S.cur!==null?1:0)})</option><option value="view">Tất cả ảnh đang hiển thị, trừ ảnh loại (${inView.length})</option><option value="s1">Từ 1 sao (${stars(1)})</option><option value="s3">Từ 3 sao (${stars(3)})</option><option value="s5">5 sao (${stars(5)})</option></select></div>
   <div class="row"><label>Đưa vào</label><select id="ld" style="flex:1"><option value="new">Dự án mới</option>${st.open?`<option value="cur">Dự án đang mở: ${esc(st.name)}</option>`:''}</select></div>
   <div class="row" id="lnr"><label>Tên dự án</label><input type="text" id="ln" style="flex:1"></div>
   <label class="hint" style="display:block;margin:8px 0"><input type="checkbox" id="lf" checked> Tự dàn trang luôn</label>
   <div class="btns"><button onclick="this.closest('.back').remove()">Hủy</button><button class="pri" id="lgo">Gửi ảnh</button></div>`);
  m.querySelector('#ln').value=folder;
  m.querySelector('#ld').onchange=e=>{ m.querySelector('#lnr').style.display=e.target.value==='new'?'':'none'; };
  m.querySelector('#lgo').onclick=async()=>{
    const v=m.querySelector('#ls').value; let list;
    if(v==='sel') list=(S.sel.size?S.view.filter(p=>S.sel.has(p.id)):S.view.filter(p=>p.id===S.cur)).filter(p=>p.rating!==-1);
    else if(v==='view') list=inView; else list=inView.filter(p=>p.rating>=+v.slice(1));
    if(!list.length){ toast('Chưa có ảnh nào phù hợp để gửi'); return; }
    const btn=m.querySelector('#lgo'); btn.disabled=true; btn.textContent='Đang gửi…';
    try{ const r=await api('/api/pick',{ids:list.map(p=>p.id)}); window.parent.PS.show('layout');
      await L.add(r.items,{mode:m.querySelector('#ld').value==='cur'?'current':'new',name:m.querySelector('#ln').value.trim()||folder,flow:m.querySelector('#lf').checked}); m.remove(); }
    catch(e){ toast('Chưa gửi được ảnh: '+e.message,4000); btn.disabled=false; btn.textContent='Gửi ảnh'; }
  };
};
function targetsForExport(){ return S.sel.size?[...S.sel]:(S.cur!==null?[S.cur]:[]); }

function showHelp(){
  modal(`<h3>Phím tắt</h3><div style="line-height:2">
   <span class="kbd">← → ↑ ↓</span> di chuyển (giữ <span class="kbd">Shift</span> để chọn dải) &nbsp; <span class="kbd">Ctrl+A</span> chọn tất cả<br>
   <span class="kbd">Enter</span>/<span class="kbd">Space</span> xem ảnh lớn &nbsp; <span class="kbd">Z</span> phóng 100% (kiểm tra độ nét) &nbsp; <span class="kbd">F</span> khung khuôn mặt<br>
   <span class="kbd">0–5</span> số sao &nbsp; <span class="kbd">X</span> loại / bỏ loại &nbsp; <span class="kbd">6</span> đỏ <span class="kbd">7</span> vàng <span class="kbd">8</span> xanh lá <span class="kbd">9</span> xanh dương <span class="kbd">-</span> bỏ nhãn<br>
   <span class="kbd">Ctrl+Z</span> hoàn tác</div>
   <div class="hint" style="margin-top:10px">Ứng dụng không bao giờ xoá hay di chuyển file gốc. “Loại” chỉ là một dấu trong cơ sở dữ liệu; hãy xuất ảnh để lấy bộ ảnh đã chọn.</div>
   <div class="btns"><button class="pri" onclick="this.closest('.back').remove()">Đóng</button></div>`);
}
$('#bHelp').onclick=showHelp;
function setTheme(t){ document.documentElement.dataset.theme=t; try{ localStorage.setItem('ps_theme',t); }catch(e){} }
$('#bTheme').onclick=()=>{ const n=document.documentElement.dataset.theme==='neutral'?'glass':'neutral'; setTheme(n); toast(n==='glass'?'Giao diện Kính':'Giao diện tối trung tính — phù hợp để xem màu ảnh'); };

/* ---------- điều khiển thanh trên ---------- */
$('#fFilter').innerHTML = FILTERS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
$('#fFilter').onchange=e=>{ S.filter=e.target.value; applyView(); e.target.blur(); };
$('#fSort').onchange=e=>{ S.sort=e.target.value; applyView(); e.target.blur(); };
$('#fSize').oninput=e=>document.documentElement.style.setProperty('--sz', e.target.value+'px');

/* ---------- vòng lặp trạng thái ---------- */
let busy=false;
async function poll(force){
  if(busy) return; busy=true;
  try{
    const st=await api('/api/status'); const was=S.status.state; S.status=st; S.settings=st.settings;
    const bar=$('#prog i');
    if(st.state==='scanning'){ clearTimeout(S.barT); S.barT=0; bar.style.width=st.total?(100*(st.done+st.thumbs)/(2*st.total))+'%':'0'; }
    else if(st.state==='done'&&was==='scanning'){ bar.style.width='100%'; S.barT=setTimeout(()=>{ S.barT=0; bar.style.width='0'; },1200); } // đầy thanh một lần rồi ẩn
    else if(!S.barT) bar.style.width='0';
    const key=st.done+':'+st.thumbs+':'+(st.quick||0)+':'+st.state+':'+st.online, now=Date.now();
    const fin = was==='scanning' && st.state!=='scanning';
    if(force || fin || (key!==S.lastKey && (st.state!=='scanning' || now-(S.lastLoad||0)>1500))){
      S.lastKey=key; S.lastLoad=now; if(st.state!=='idle'){ await loadPhotos(); if(st.state!=='scanning'||!S.people.length||fin) await loadPeople(); }
    }
    renderStatus();
  }catch(e){ /* server tắt */ }
  busy=false;
}
setInterval(()=>poll(false), 900);
poll(true).then(()=>{ if(!S.photos.length) renderGrid(); });
</script>
</body>
</html>
