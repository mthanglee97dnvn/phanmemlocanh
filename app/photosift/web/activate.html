<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>Kích hoạt MThanglee Cull&amp;Collage</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;padding:16px;color:#ECEEF2;font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  background:#14161A}
main{width:min(520px,100%);background:#1E2127;border:1px solid #383D47;border-radius:14px;padding:26px}
img{height:34px;display:block;margin-bottom:14px}
h1{font-size:23px;margin:0}
p{color:#C9CED6;margin:6px 0 16px;font-size:13.5px}
label{display:block;font-size:12.5px;color:#A1A8B4;margin-bottom:4px}
.code{display:flex;gap:8px;margin-bottom:16px}
.code output{flex:1;min-width:0;padding:8px 10px;border-radius:8px;background:#14161A;border:1px solid #4A505C;font:600 15px Consolas,monospace;letter-spacing:.04em;user-select:all}
textarea{width:100%;min-height:104px;padding:9px;border-radius:8px;background:#14161A;color:#ECEEF2;border:1px solid #4A505C;font:12.5px Consolas,monospace;resize:vertical}
textarea:focus-visible,button:focus-visible{outline:2px solid #F2B01E;outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid #4A505C;background:#2A2E36;color:#ECEEF2;padding:7px 14px}
#go{width:100%;margin-top:12px;background:#F2B01E;border-color:#F2B01E;color:#1A1405;font-weight:700;padding:10px}
#go:disabled{opacity:.5;cursor:default}
#err{min-height:20px;margin-top:8px;color:#ff9d9b;font-size:13px}
</style>
<link id="uiFont" rel="stylesheet" href="/ui.css">
</head>
<body>
<main>
  <img src="/logo.png" alt="MTHANGLEE STUDIO">
  <h1>MThanglee Cull&amp;Collage</h1>
  <p>Nhập key để sử dụng. Gửi mã máy dưới đây cho MTHANGLEE STUDIO để nhận key.</p>
  <label for="mach">Mã máy của bạn</label>
  <div class="code"><output id="mach">…</output><button id="copy">Sao chép</button></div>
  <label for="key">Key kích hoạt</label>
  <textarea id="key" placeholder="MTCC-…" spellcheck="false" autofocus></textarea>
  <div id="err" role="status"></div>
  <button id="go">Kích hoạt</button>
</main>
<script>
"use strict";
const $=i=>document.getElementById(i);
async function load(){const s=await fetch('/api/license').then(r=>r.json());$('mach').textContent=s.machine;if(s.ok)location.href='/';else{if(s.reason)$('err').textContent=s.reason;if(!s.has_pub){$('go').disabled=true;$('err').textContent='Bản cài này chưa có khóa công khai nên chưa kích hoạt được.'}}}
load();setInterval(()=>fetch('/api/license').catch(()=>{}),20000);
$('copy').onclick=async e=>{try{await navigator.clipboard.writeText($('mach').textContent);e.target.textContent='Đã chép'}catch(err){getSelection().selectAllChildren($('mach'));e.target.textContent='Nhấn Ctrl+C'}setTimeout(()=>e.target.textContent='Sao chép',1600)};
async function go(){const k=$('key').value.trim();if(!k){$('err').textContent='Hãy dán key vào ô trên.';return}$('go').disabled=true;$('go').textContent='Đang kiểm tra…';
  try{const r=await fetch('/api/license/activate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:k})}).then(x=>x.json());if(r.ok){location.href='/';return}$('err').textContent=r.reason}catch(e){$('err').textContent='Chưa kiểm tra được key. Hãy thử lại.'}
  $('go').disabled=false;$('go').textContent='Kích hoạt'}
$('go').onclick=go;
</script>
</body>
</html>
