<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lọc ảnh">
<meta name="theme-color" content="#0F0F11">
<link rel="manifest" href="/m.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Lọc ảnh — Cull &amp; Collage</title>
<script src="/cull.js"></script>
<style>
  :root{--bg:#0F0F11;--panel:#161619;--panel2:#1C1C21;--line:#2A2A30;--line2:#3A3A42;--tx:#EDEDEF;--mut:#A0A0A8;--acc:#E8A33D;--acc-ink:#1A1306;--red:#E5564B;--redtx:#F07A70;
    --safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 "Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overscroll-behavior:none}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  button{font:inherit;color:inherit}
  .hide{display:none!important}
  .ib{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .ib svg{width:20px;height:20px}
  .ib.on{background:rgba(232,163,61,.16);border-color:var(--acc);color:var(--acc)}
  /* thanh trên */
  #top{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--safe-t)) 12px 6px;flex:0 0 auto}
  #top .t{flex:1;min-width:0}
  #fname{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #fsub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tally{display:flex;gap:6px;padding:0 12px 8px;font-size:12px;font-weight:600;flex:0 0 auto}
  #tally span{padding:3px 9px;border-radius:999px}
  .tk{background:rgba(232,163,61,.14);color:var(--acc)}.tr{background:rgba(229,86,75,.14);color:var(--redtx)}.tt{background:var(--panel2);color:var(--mut)}
  #wtools{display:none;gap:8px}
  /* vùng chính */
  #main{flex:1 1 auto;display:flex;min-height:0;position:relative}
  #gridcol{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
  #grid{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;padding:0 3px}
  #gsp{position:relative;width:100%}
  .row{position:absolute;left:0;right:0;display:grid;gap:3px}
  .tile{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--panel2);border-radius:4px;cursor:pointer}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}
  .tile.rej img{filter:grayscale(1) brightness(.35)}
  .tile.rej::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--redtx);font-size:32px;font-weight:300}
  .tile.cur{outline:3px solid var(--acc);outline-offset:-3px}
  .tile .st{position:absolute;left:5px;bottom:5px;font-size:11px;font-weight:700;color:var(--acc-ink);background:var(--acc);border-radius:6px;padding:1px 5px}
  .tile .sg{position:absolute;left:5px;top:5px;width:20px;height:20px;border-radius:999px;background:rgba(15,15,17,.75);color:var(--acc);font-size:12px;display:flex;align-items:center;justify-content:center}
  .tile .wn{position:absolute;right:5px;top:5px;font-size:10px;font-weight:700;color:#fff;background:#C9443A;border-radius:6px;padding:2px 5px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .cnt{position:absolute;right:5px;bottom:5px;font-size:11px;font-weight:700;background:rgba(15,15,17,.8);border:1px solid var(--line2);border-radius:6px;padding:1px 5px}
  .tile .cnt:empty{display:none}
  .tile,#view,#strip{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #grid{touch-action:pan-y} #top,#bar,#selBar,#tally,#vtop,#vbot{touch-action:manipulation}
  .tile .ck{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:999px;border:2px solid rgba(255,255,255,.75);background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  body.selmode .tile .ck{display:flex} body.selmode .tile .wn{display:none}
  .tile.sel{outline:3px solid var(--acc);outline-offset:-3px} .tile.sel .ck{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
  #empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);padding:30px}
  /* thanh dưới: bộ lọc */
  #bar{flex:0 0 auto;border-top:1px solid var(--line);background:#121214;padding:8px 0 calc(8px + var(--safe-b))}
  #chips{display:flex;gap:8px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);color:var(--tx);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
  .chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
  .chip.cs{color:var(--acc)}.chip.cw{color:var(--redtx)}
  .chip.on.cs,.chip.on.cw{color:var(--bg)}
  .chip small{opacity:.7;font-weight:500;margin-left:4px}
  #gopts{display:flex;align-items:center;gap:8px;padding:8px 12px 0;font-size:12px;color:var(--mut)}
  #gopts button{min-height:34px;padding:0 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);font-size:12px;font-weight:600;cursor:pointer}
  #gopts button.on{border-color:var(--acc);color:var(--acc)}
  /* màn hình phụ */
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:30;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));overflow:auto}
  .screen h2{margin:4px 0 2px}.screen p{color:var(--mut);margin:4px 0 14px}
  .fold{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--panel);cursor:pointer;color:var(--tx);text-align:left;width:100%}
  .fold .n{flex:1;min-width:0}.fold .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fold .n span{color:var(--mut);font-size:13px}
  .fold .m{color:var(--mut);font-size:13px;text-align:right;white-space:nowrap}
  .center{margin:auto;text-align:center;color:var(--mut);max-width:320px}
  .btn{min-height:44px;padding:0 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;cursor:pointer}
  #toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:#000d;border:1px solid var(--line2);padding:8px 8px 8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;display:flex;align-items:center;gap:10px;max-width:92vw}
  #toast.on{opacity:1;pointer-events:auto}
  #toast button{min-height:34px;padding:0 12px;border-radius:999px;background:var(--acc);color:var(--acc-ink);border:none;font-weight:700;cursor:pointer}
  #toast button{white-space:nowrap} body.viewing #toast{bottom:calc(236px + var(--safe-b))}
  #toast:not(.has) button{display:none} #toast:not(.has){padding-right:16px}

  /* Xem từng tấm */
  #view{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
  #vtop{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 12px 8px;background:var(--bg)}
  #vcount{flex:1;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #vcount span{color:var(--mut);font-weight:500}
  #vstage{flex:1 1 auto;position:relative;overflow:hidden;touch-action:none;background:#000}
  #vwrap{position:absolute;left:50%;top:50%;transform-origin:center center;will-change:transform}
  #vimg{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
  #fbox{position:absolute;border:2px solid var(--acc);border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.5);transform:translate(-50%,-50%);pointer-events:none}
  #vchips{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;font-size:11px;font-weight:700;pointer-events:none;max-width:calc(100% - 90px)}
  #vchips span{padding:4px 8px;border-radius:8px;background:rgba(15,15,17,.8)}
  #vchips .b{background:var(--acc);color:var(--acc-ink)} #vchips .s{color:var(--acc)} #vchips .w{background:#C9443A;color:#fff}
  #vzoom{position:absolute;right:12px;top:12px;font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;background:rgba(15,15,17,.8);pointer-events:none}
  #vmark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:28px;font-weight:800;padding:8px 18px;border-radius:14px;border:3px solid;opacity:0;pointer-events:none}
  #vbot{background:var(--bg);border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--safe-b));display:flex;flex-direction:column;gap:10px}
  #stripRow{display:flex;align-items:center;gap:10px}
  #strip{flex:1;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
  #strip::-webkit-scrollbar{display:none}
  #strip .sb{flex:0 0 auto;width:40px;height:52px;padding:0;border-radius:5px;overflow:hidden;border:none;background:var(--panel2);opacity:.55;cursor:pointer;position:relative}
  #strip .sb img{width:100%;height:100%;object-fit:cover;display:block}
  #strip .sb.on{opacity:1;outline:2px solid var(--acc);outline-offset:1px}
  #strip .sb.r::after{content:"✕";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--redtx);background:rgba(0,0,0,.45)}
  #strip .sb.k::before{content:"★";position:absolute;left:2px;bottom:1px;font-size:10px;color:var(--acc)}
  #pickBtn{min-height:44px;padding:0 12px;border-radius:12px;background:var(--acc);color:var(--acc-ink);border:none;font-weight:700;font-size:13px;white-space:nowrap;cursor:pointer}
  #vstars{display:flex;justify-content:center;gap:2px}
  #vstars button{width:46px;height:44px;border:none;background:none;font-size:30px;line-height:1;color:var(--line2);cursor:pointer;padding:0}
  #vstars button.on{color:var(--acc)}
  #vbtns{display:flex;gap:8px}
  #vbtns .nav{width:52px;height:50px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:22px;cursor:pointer}
  #vbtns .big{flex:1;height:50px;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer}
  #vRej{background:#2A1D20;border:1px solid #6B3238;color:var(--redtx)} #vKeep{background:rgba(232,163,61,.14);border:1px solid #8A6326;color:var(--acc)}

  /* chọn nhiều */
  #selBar{flex:0 0 auto;border-top:1px solid #8A6326;background:var(--acc-ink);padding:10px 12px calc(10px + var(--safe-b));display:flex;flex-direction:column;gap:8px}
  #selHead{display:flex;align-items:center;gap:10px}
  #selTitle{flex:1;font-weight:700;color:var(--acc)}
  #selBtns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  #selBtns button,#selHead button{min-height:48px;border-radius:14px;font-weight:700;cursor:pointer;background:rgba(232,163,61,.14);border:1px solid #8A6326;color:var(--acc)}
  #selHead button{min-height:40px;padding:0 14px;background:transparent}
  #selBtns [data-r="-1"]{background:#2A1D20;border-color:#6B3238;color:var(--redtx)}
  #selBtns [data-r="0"]{background:var(--panel);border-color:var(--line);color:var(--tx);font-weight:600}
  body.selmode #bar{display:none} body:not(.selmode) #selBar{display:none}
  /* bảng công cụ */
  #sheetWrap{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column}
  #sheetBack{flex:1;border:none;background:rgba(0,0,0,.55);padding:0;cursor:pointer}
  #sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:14px;max-height:86vh;overflow:auto}
  #sheet .grab{align-self:center;width:40px;height:5px;border-radius:99px;background:var(--line2)}
  #sheet h3{margin:0;font-size:17px}
  #sheet .sec{display:flex;flex-direction:column;gap:10px}
  #sheet hr{border:none;height:1px;background:var(--line);margin:0}
  .kchips{display:flex;flex-wrap:wrap;gap:6px}
  .kchips label{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-size:13px;font-weight:600;cursor:pointer}
  .kchips label:has(input:checked){background:rgba(232,163,61,.14);border-color:#8A6326;color:var(--acc)}
  .kchips label:has(input:disabled){opacity:.45}
  .kchips input{accent-color:var(--acc)}
  .lv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .lv button{min-height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600;cursor:pointer}
  .lv button[aria-pressed="true"]{border:2px solid var(--acc);color:var(--acc)}
  .act{min-height:50px;border-radius:14px;font-weight:700;cursor:pointer}
  #cullGo{background:#2A1D20;border:1px solid #6B3238;color:var(--redtx)}
  #tGo{background:var(--acc);border:none;color:var(--acc-ink);font-weight:800}
  #tRow{display:flex;align-items:center;gap:10px}
  #tRow label{color:var(--mut)}
  #tN{width:90px;min-height:44px;border-radius:10px;background:var(--bg);border:1px solid var(--line2);color:var(--tx);font:inherit;font-weight:700;text-align:right;padding:0 12px}
  #tInfo{font-size:13px;color:var(--mut)}
  #tMore{display:flex;gap:8px} #tMore button{flex:1;min-height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);font-weight:600;cursor:pointer;font-size:13px}
  #sortRow{display:flex;align-items:center;gap:10px}
  #sortRow select{flex:1;min-height:44px;border-radius:10px;background:var(--bg);border:1px solid var(--line2);color:var(--tx);font:inherit;padding:0 10px}
  #sortRow label{display:flex;align-items:center;gap:6px;color:var(--mut)}

  /* iPad / màn rộng: lưới trái, ảnh phải */
  body.split #gridcol{flex:0 0 44%;border-right:1px solid var(--line)}
  body.split #view{position:relative;inset:auto;flex:1 1 auto;min-width:0;z-index:auto}
  body.split #vtop{padding-top:8px}
  body.split #vBack{display:none}
  body.split #wtools{display:flex}
  body.split #gopts [data-c],body.split #gopts>span:first-child{display:none}
  #wtools button{min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;cursor:pointer;background:var(--panel);border:1px solid var(--line)}
  #wtools #wSugg{background:var(--acc);border:none;color:var(--acc-ink);font-weight:700}
  body.split #toast{left:72%}
</style>
</head>
<body>
  <div id="top">
    <button class="ib" id="btnFold" aria-label="Đổi thư mục"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="t"><div id="fname">Lọc ảnh</div><div id="fsub"></div></div>
    <div id="wtools"><button id="wCull">Tự động lọc</button><button id="wSugg">✦ Chọn ảnh đẹp</button></div>
    <button class="ib" id="btnTools" aria-label="Công cụ"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div id="tally"></div>
  <div id="main">
    <div id="gridcol">
      <div id="grid"><div id="gsp"></div><div id="empty" class="hide"></div></div>
      <div id="bar">
        <div id="chips"></div>
        <div id="gopts">
          <span>Cột</span><button data-c="2">2</button><button data-c="3">3</button><button data-c="4">4</button>
          <span style="flex:1"></span>
          <button id="btnStack" aria-pressed="true">Gộp ảnh trùng</button>
        </div>
      </div>
    </div>
  </div>


  <div id="selBar">
    <div id="selHead"><button id="selCancel">Huỷ</button><div id="selTitle">Đã chọn 0 tấm</div></div>
    <div id="selBtns"><button data-r="1">★1</button><button data-r="2">★★2</button><button data-r="3">★★★3</button><button data-r="-1">✕ Loại</button><button data-r="0">Bỏ chấm</button></div>
  </div>
  <div id="sheetWrap" class="hide">
    <button id="sheetBack" aria-label="Đóng bảng công cụ"></button>
    <div id="sheet" role="dialog" aria-label="Công cụ">
      <div class="grab"></div>
      <div class="sec">
        <h3>Tự động lọc</h3>
        <div class="kchips" id="kchips"></div>
        <div class="lv" id="lv"><button data-l="nhe">Nhẹ</button><button data-l="vua">Vừa</button><button data-l="manh">Mạnh</button></div>
        <button class="act" id="cullGo">Đánh dấu loại</button>
      </div>
      <hr>
      <div class="sec">
        <h3>✦ Chọn ảnh đẹp</h3>
        <div id="tRow"><label for="tN">Chọn khoảng</label><input id="tN" inputmode="numeric" autocomplete="off"><span style="color:var(--mut)">tấm</span></div>
        <div id="tInfo"></div>
        <button class="act" id="tGo">✦ Đề xuất</button>
        <div id="tMore"><button id="tRate">Chấm 1 sao cho tất cả đề xuất</button><button id="tClear">Bỏ đề xuất</button></div>
      </div>
      <hr>
      <div id="sortRow"><span style="font-weight:600">Sắp xếp</span>
        <select id="sSort" aria-label="Sắp xếp"><option value="time">Giờ chụp</option><option value="name">Tên file</option><option value="score">Điểm chất lượng</option><option value="type">Loại file (RAW trước)</option></select>
        <label><input type="checkbox" id="sRev"> Đảo</label></div>
    </div>
  </div>
  <!-- Xem từng tấm -->
  <div id="view" class="hide">
    <div id="vtop">
      <button class="ib" id="vBack" aria-label="Về lưới"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <div id="vcount"></div>
      <button class="ib" id="btnFocus" aria-label="Hiện điểm lấy nét" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/></svg></button>
      <button class="ib" id="vUndo" aria-label="Hoàn tác"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    </div>
    <div id="vstage">
      <div id="vwrap"><img id="vimg" alt="" draggable="false"><div id="fbox" class="hide"></div></div>
      <div id="vchips"></div><div id="vzoom" class="hide"></div><div id="vmark"></div>
    </div>
    <div id="vbot">
      <div id="stripRow"><div id="strip"></div><button id="pickBtn">Chọn tấm này</button></div>
      <div id="vstars"><button data-v="1" aria-label="1 sao">★</button><button data-v="2" aria-label="2 sao">★</button><button data-v="3" aria-label="3 sao">★</button><button data-v="4" aria-label="4 sao">★</button><button data-v="5" aria-label="5 sao">★</button></div>
      <div id="vbtns"><button class="nav" id="vPrev" aria-label="Tấm trước">‹</button><button class="big" id="vRej">✕ Loại</button><button class="big" id="vKeep">✓ Giữ</button><button class="nav" id="vNext" aria-label="Tấm sau">›</button></div>
    </div>
  </div>
  <!-- chọn thư mục -->
  <div class="screen hide" id="folders">
    <h2>Chọn thư mục để lọc</h2>
    <p id="foldHint">Chạm một thư mục trong Catalog để mở trên máy tính rồi lọc bằng điện thoại.</p>
    <div id="foldList"></div>
    <button class="btn" id="foldClose" style="margin-top:6px">Đóng</button>
  </div>
  <div class="screen hide" id="msg"><div class="center" id="msgText"></div></div>
  <div id="toast" role="status" aria-live="polite"><span id="toastT"></span><button id="toastUndo">Hoàn tác</button></div>

<script>
/* ---------- hàm thuần (test trích ra được) ---------- */
var WARN={blur:'mờ',dark:'tối',bright:'cháy sáng',eyes:'nhắm mắt',away:'quay mặt'};
var RAWRE=/\.(arw|srf|sr2|cr2|cr3|nef|nrw|dng|orf|raf|rw2|pef|srw|3fr|erf|kdc|mrw|x3f)$/i;
function mOdd(list){
  var key=function(p){return p.dir+'\u0000'+p.name.replace(/\.[^.]+$/,'').toLowerCase();};
  var hr={},hj={},raw=0,jpg=0,i,p,odd={};
  for(i=0;i<list.length;i++){p=list[i]; if(RAWRE.test(p.name)){raw++;hr[key(p)]=1;}else{jpg++;hj[key(p)]=1;}}
  if(!raw||!jpg) return odd;
  for(i=0;i<list.length;i++){p=list[i]; var k=key(p); if(RAWRE.test(p.name)?!hj[k]:!hr[k]) odd[p.id]=1;}
  return odd;
}
function mFilter(photos,f,ctx){
  ctx=ctx||{};
  return photos.filter(function(p){
    var r=p.rating||0;
    switch(f){
      case 'all': return true;
      case 'todo': return r===0;
      case 'keep': return r>0;
      case 'rej': return r===-1;
      case 'sugg': return p.sugg===1;
      case 'warn': return (p.flags||[]).some(function(x){return !!WARN[x];});
      case 'hl': return !!p.hl;
      case 'odd': return !!(ctx.oddSet&&ctx.oddSet[p.id]);
      default:
        if(f.indexOf('p:')===0){ var id=+f.slice(2); return (p.people||[]).indexOf(id)>=0; }
        return true;
    }
  });
}
function mGroup(list,on){
  var out=[], at={}, i, p;
  for(i=0;i<list.length;i++){
    p=list[i];
    if(!on||!p.grp){ out.push({p:p,n:1,ids:[p.id]}); continue; }
    var t=at[p.grp];
    if(!t){ t={p:p,n:0,ids:[]}; at[p.grp]=t; out.push(t); }
    t.n++; t.ids.push(p.id);
    if(p.best&&!t.p.best) t.p=p;
  }
  return out;
}
function mPeopleChips(people){
  var named=people.filter(function(x){return x.name;}).sort(function(a,b){return b.n-a.n;});
  var rest=people.filter(function(x){return !x.name&&x.n>=20;}).sort(function(a,b){return b.n-a.n;});
  return named.concat(rest).slice(0,10).map(function(x){return {id:x.id,name:x.name||('Người '+x.id),n:x.n};});
}
function mSort(key,rev){
  var nm=function(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true});};
  var f={name:function(a,b){return a.dir.localeCompare(b.dir)||nm(a,b);},
         time:function(a,b){return (a.taken||0)-(b.taken||0)||nm(a,b);},
         score:function(a,b){return (b.score||0)-(a.score||0)||nm(a,b);},
         type:function(a,b){return (RAWRE.test(b.name)-RAWRE.test(a.name))||(a.taken||0)-(b.taken||0)||nm(a,b);}}[key]||function(){return 0;};
  return rev?function(a,b){return f(b,a);}:f;
}

/* ---- toán zoom: z = {scale, tx, ty} (tx,ty: dịch tâm ảnh so với tâm khung, px màn hình) ---- */
function zoomMax(iw,natW){ return Math.max(4,(natW||0)/(iw||1)); }
function zoomClamp(z,vw,vh,iw,ih,natW){
  var s=Math.min(zoomMax(iw,natW),Math.max(1,z.scale));
  var mx=Math.max(0,(iw*s-vw)/2), my=Math.max(0,(ih*s-vh)/2);
  return {scale:s,tx:Math.min(mx,Math.max(-mx,z.tx)),ty:Math.min(my,Math.max(-my,z.ty))};
}
function zoomAt(z,factor,cx,cy,vw,vh,iw,ih,natW){
  var ns=Math.min(zoomMax(iw,natW),Math.max(1,z.scale*factor));
  var px=cx-vw/2, py=cy-vh/2;
  var u=(px-z.tx)/z.scale, v=(py-z.ty)/z.scale;
  return zoomClamp({scale:ns,tx:px-u*ns,ty:py-v*ns},vw,vh,iw,ih,natW);
}
function focusZoom(focus,vw,vh,iw,ih,natW){
  var s=Math.max(1,(natW||iw)/iw);
  return zoomClamp({scale:s,tx:-(focus[0]-0.5)*iw*s,ty:-(focus[1]-0.5)*ih*s},vw,vh,iw,ih,natW);
}
</script>
<script>
/* ---------- trạng thái + vẽ ---------- */
var $=function(id){return document.getElementById(id);};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:v;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var M={all:[],by:{},view:[],tiles:[],filter:'all',cols:+lsGet('m.cols','0')||0,stack:lsGet('m.stack','1')==='1',
  sort:lsGet('m.sort','time'),rev:lsGet('m.rev','0')==='1',cur:null,people:[],oddSet:{},ver:null,pending:{},sel:{},selmode:false,split:false};
function api(p){return fetch(p,{credentials:'same-origin'}).then(function(r){
  if(r.status===402) throw {code:402}; if(!r.ok) throw {code:r.status}; return r.json();});}
function post(p,b){return fetch(p,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})})
  .then(function(r){ if(r.status===402) throw {code:402}; if(!r.ok) throw {code:r.status}; return r.json();});}
var toastT, toastUndoFn=null;
function toast(t,undoFn,ms){ var el=$('toast'); $('toastT').textContent=t; toastUndoFn=undoFn||null;
  el.classList.toggle('has',!!undoFn); el.classList.add('on'); clearTimeout(toastT);
  toastT=setTimeout(function(){el.classList.remove('on'); toastUndoFn=null;},ms||(undoFn?4000:1400)); }
$('toastUndo').addEventListener('click',function(){ var f=toastUndoFn; $('toast').classList.remove('on'); toastUndoFn=null; if(f) f(); });
function fmt(n){return (n||0).toLocaleString('vi-VN');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function colsNow(){ if(M.split) return 5; if(M.cols) return M.cols; return innerWidth>innerHeight?5:3; }
function mSetCols(n){ M.cols=n; lsSet('m.cols',String(n)); paintOpts(); layoutGrid(true); }
function setData(list){
  M.all=list||[]; M.by={}; for(var i=0;i<M.all.length;i++) M.by[M.all[i].id]=M.all[i];
  // thao tác đang gửi dở: giữ giá trị điện thoại vừa đặt
  for(var id in M.pending){ var p=M.by[id]; if(p) p.rating=M.pending[id]; }
  M.oddSet=mOdd(M.all);
}
function recompute(){
  var v=mFilter(M.all,M.filter,{oddSet:M.oddSet}); v.sort(mSort(M.sort,M.rev)); M.view=v;
  M.tiles=mGroup(v,M.stack);
}
function paintTally(){
  var k=0,r=0,t=0; for(var i=0;i<M.all.length;i++){var x=M.all[i].rating||0; if(x>0)k++; else if(x===-1)r++; else t++;}
  $('tally').innerHTML='<span class="tk">★ '+fmt(k)+' giữ</span><span class="tr">✕ '+fmt(r)+' loại</span><span class="tt">'+fmt(t)+' chưa chấm</span>';
  paintWhen();
}
function paintChips(){
  var c=function(f){return mFilter(M.all,f,{oddSet:M.oddSet}).length;};
  var L=[['all','Tất cả',''],['todo','Chưa chấm',''],['keep','Đã giữ',''],['rej','Đã loại','']];
  var ns=c('sugg'); if(ns) L.splice(1,0,['sugg','✦ Đề xuất','cs']);
  L.push(['warn','Cảnh báo','cw']);
  if(c('hl')) L.push(['hl','Highlight','']);
  mPeopleChips(M.people).forEach(function(p){ L.push(['p:'+p.id,p.name,'']); });
  if(Object.keys(M.oddSet).length) L.push(['odd','File lẻ cặp','cw']);
  if(!L.some(function(x){return x[0]===M.filter;})) M.filter='all';
  $('chips').innerHTML=L.map(function(x){ return '<button class="chip '+x[2]+(M.filter===x[0]?' on':'')+'" data-f="'+esc(x[0])+'">'+esc(x[1])+'<small>'+fmt(c(x[0]))+'</small></button>'; }).join('');
}
function paintOpts(){
  var n=colsNow(); document.querySelectorAll('#gopts [data-c]').forEach(function(b){ b.classList.toggle('on',+b.dataset.c===n); });
  $('btnStack').classList.toggle('on',M.stack); $('btnStack').setAttribute('aria-pressed',String(M.stack));
}
/* lưới cuộn ảo: chỉ dựng các hàng trong ±3 màn hình */
var G={rowH:0,drawn:{}};
function layoutGrid(reset){
  var g=$('grid'), n=colsNow(), w=g.clientWidth-6, gap=3, cw=(w-gap*(n-1))/n;
  G.n=n; G.rowH=Math.round(cw*1.25)+gap; G.drawn={};
  var rows=Math.ceil(M.tiles.length/n);
  $('gsp').style.height=(rows*G.rowH)+'px';
  $('gsp').innerHTML='';
  $('empty').classList.toggle('hide',M.tiles.length>0);
  if(!M.tiles.length) $('empty').textContent=M.all.length?'Không có ảnh trong mục này.':'Chưa có ảnh. Chạm ☰ để chọn thư mục.';
  drawRows();
}
function tileHtml(t){
  var p=t.p, r=p.rating||0, w=(p.flags||[]).filter(function(x){return WARN[x];}).map(function(x){return WARN[x];});
  var cls='tile'+(r===-1?' rej':'')+(M.cur===p.id?' cur':'')+(isSel(t)?' sel':'');
  return '<div class="'+cls+'" data-id="'+p.id+'"><img loading="lazy" decoding="async" alt="" src="/thumb/'+p.id+'.jpg?v='+(p.tv||0)+'">'+
    (p.sugg===1?'<span class="sg">✦</span>':'')+(w.length?'<span class="wn">'+esc(w.join(' · '))+'</span>':'')+
    (r>0?'<span class="st">'+'★'.repeat(r)+'</span>':'')+'<span class="cnt">'+(t.n>1?'×'+t.n:'')+'</span><span class="ck">✓</span></div>';
}
function isSel(t){ for(var i=0;i<t.ids.length;i++) if(M.sel[t.ids[i]]) return true; return false; }
function hm(s){ var d=new Date((s||0)*1000); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function paintWhen(){
  var g=$('grid'), base=fmt(M.all.length)+' ảnh';
  if(!M.tiles.length){ $('fsub').textContent=base; return; }
  if(g.scrollTop<4){ var a=M.all.map(function(p){return p.taken||0;}).filter(Boolean);
    $('fsub').textContent=base+(a.length?' · '+hm(Math.min.apply(null,a))+' – '+hm(Math.max.apply(null,a)):''); return; }
  var i=Math.min(M.tiles.length-1,Math.floor(g.scrollTop/(G.rowH||1))*(G.n||1)), p=M.tiles[i].p;
  $('fsub').textContent=base+' · đang xem '+hm(p.taken);
}
function drawRows(){
  paintWhen();
  var g=$('grid'), top=g.scrollTop, h=g.clientHeight||600, n=G.n, rh=G.rowH||1;
  var a=Math.max(0,Math.floor((top-3*h)/rh)), b=Math.min(Math.ceil(M.tiles.length/n)-1,Math.ceil((top+4*h)/rh));
  var keep={};
  for(var r=a;r<=b;r++){
    keep[r]=1; if(G.drawn[r]) continue;
    var d=document.createElement('div'); d.className='row'; d.dataset.r=r; d.style.top=(r*rh)+'px';
    d.style.gridTemplateColumns='repeat('+n+',minmax(0,1fr))';
    d.innerHTML=M.tiles.slice(r*n,r*n+n).map(tileHtml).join('');
    $('gsp').appendChild(d); G.drawn[r]=d;
  }
  for(var k in G.drawn) if(!keep[k]){ G.drawn[k].remove(); delete G.drawn[k]; }
}
function repaintTiles(){   // vá tại chỗ: giữ nguyên thẻ <img> nếu ô vẫn là ảnh đó
  var n=G.n;
  for(var r in G.drawn){
    var row=G.drawn[r], ts=M.tiles.slice(r*n,r*n+n), kids=row.children;
    if(kids.length!==ts.length){ row.innerHTML=ts.map(tileHtml).join(''); continue; }
    for(var i=0;i<ts.length;i++){
      var el=kids[i];
      if(+el.dataset.id!==ts[i].p.id){ var tmp=document.createElement('div'); tmp.innerHTML=tileHtml(ts[i]); row.replaceChild(tmp.firstChild,el); continue; }
      var tmp2=document.createElement('div'); tmp2.innerHTML=tileHtml(ts[i]); var nw=tmp2.firstChild;
      el.className=nw.className; var img=el.querySelector('img');
      while(el.lastChild&&el.lastChild!==img) el.removeChild(el.lastChild);
      while(nw.childNodes.length>1) el.appendChild(nw.childNodes[1]);
    }
  }
  var rows=Math.ceil(M.tiles.length/n); $('gsp').style.height=(rows*G.rowH)+'px';
}
function mRender(keepScroll){
  var g=$('grid'), top=g.scrollTop;
  recompute(); paintTally(); paintChips(); paintOpts(); layoutGrid();
  if(keepScroll){ g.scrollTop=top; drawRows(); }
}
$('grid').addEventListener('scroll',function(){ drawRows(); },{passive:true});
addEventListener('resize',function(){ applySplit(); layoutGrid(); });
$('chips').addEventListener('click',function(e){ var b=e.target.closest('.chip'); if(!b) return; M.filter=b.dataset.f; $('grid').scrollTop=0; mRender(); });
document.querySelectorAll('#gopts [data-c]').forEach(function(b){ b.addEventListener('click',function(){ mSetCols(+b.dataset.c); }); });
$('btnStack').addEventListener('click',function(){ M.stack=!M.stack; lsSet('m.stack',M.stack?'1':'0'); mRender(true); });
function applySplit(){
  var on=!!(window.matchMedia&&matchMedia('(min-width: 900px) and (min-height: 600px)').matches);
  var was=M.split; M.split=on; document.body.classList.toggle('split',on);
  var v=$('view');
  if(on){ if(v.parentNode!==$('main')) $('main').appendChild(v); v.classList.remove('hide');
    if(!M.cur&&M.tiles.length) M.cur=M.tiles[0].p.id; if(M.cur&&typeof openView==='function') openView(M.cur,true); }
  else { if(v.parentNode!==document.body) document.body.insertBefore(v,$('folders')); if(was&&!V.open) v.classList.add('hide');
    if(was){ V.open=false; v.classList.add('hide'); document.body.classList.remove('viewing'); } }
  if(typeof vApply==='function'&&M.cur) vApply();
}


/* ---------- chấm sao (lạc quan, có hoàn tác) ---------- */
// Xem từng tấm: không truyền label → không hiện thông báo đè lên ảnh; hoàn tác bằng nút ↶ trên cùng.
// ops: [{id, from, to}] — gửi theo từng giá trị đích; lỗi thì trả lại như cũ
function rateOps(ops,label){
  ops=ops.filter(function(o){return o.from!==o.to;});
  if(!ops.length) return Promise.resolve(ops);
  var by={}; ops.forEach(function(o){ var p=M.by[o.id]; if(p){p.rating=o.to; M.pending[o.id]=o.to;} (by[o.to]=by[o.to]||[]).push(o.id); });
  afterRate();
  var reqs=Object.keys(by).map(function(r){ return post('/api/rate',{ids:by[r],rating:+r}); });
  return Promise.all(reqs).then(function(){
    ops.forEach(function(o){ if(M.pending[o.id]===o.to) delete M.pending[o.id]; });
    if(typeof undoPush==='function') undoPush({t:'rate',ops:ops},label);
    return ops;
  },function(){
    ops.forEach(function(o){ var p=M.by[o.id]; if(p) p.rating=o.from; delete M.pending[o.id]; });
    afterRate(); toast('Không lưu được'); throw {code:'rate'};
  });
}
function rateIds(ids,r,label){ return rateOps(ids.map(function(id){ var p=M.by[id]; return {id:id,from:p?(p.rating||0):0,to:r}; }),label); }
function afterRate(){ recompute(); paintTally(); repaintTiles(); if(V.open) vPaint(); }

/* ---------- Xem từng tấm ---------- */
var V={open:false,timer:null,lastTap:0,lastX:0,lastY:0,hqFor:null,origFor:null,showFocus:lsGet('m.focus','1')==='1'};
M.zoom={scale:1,tx:0,ty:0};
function curP(){ return M.by[M.cur]; }
function vFit(){
  var st=$('vstage'), vw=st.clientWidth||1, vh=st.clientHeight||1, p=curP()||{};
  var ar=(p.w&&p.h)?p.w/p.h:1.5, iw=vw, ih=vw/ar; if(ih>vh){ ih=vh; iw=vh*ar; }
  return {vw:vw,vh:vh,iw:iw,ih:ih,natW:Math.max(p.w||0,1)};
}
function vApply(){
  var f=vFit(), w=$('vwrap'), z=M.zoom=zoomClamp(M.zoom,f.vw,f.vh,f.iw,f.ih,f.natW);
  w.style.width=f.iw+'px'; w.style.height=f.ih+'px';
  w.style.transform='translate(-50%,-50%) translate('+z.tx+'px,'+z.ty+'px) scale('+z.scale+')';
  var pct=Math.round(z.scale*f.iw/f.natW*100);
  $('vzoom').classList.toggle('hide',z.scale<1.01); $('vzoom').textContent=pct+'%';
  if(z.scale>1.5) vLoadOrig();
}
function tileIndexOf(id){ for(var i=0;i<M.tiles.length;i++) if(M.tiles[i].ids.indexOf(id)>=0) return i; return -1; }
function openView(id,keepZoom){
  var p=M.by[id]; if(!p) return;
  var prev=M.cur; M.cur=id; V.open=true;
  if(!keepZoom) M.zoom={scale:1,tx:0,ty:0};
  $('view').classList.remove('hide'); document.body.classList.add('viewing');
  var img=$('vimg');
  if(prev!==id||!img.getAttribute('src')){
    V.hqFor=null; V.origFor=null;
    img.onload=function(){ if(M.cur===id) vLoadHq(); };
    img.src='/api/preview?id='+id;
  }
  vPaint(); vApply(); vPrefetch();
  if(M.split&&prev!==id) repaintTiles();
}
function vLoadHq(){
  var id=M.cur; if(V.hqFor===id) return; V.hqFor=id;
  var f=vFit(), side=Math.min(2400,Math.round(Math.max(f.vw,f.vh)*(window.devicePixelRatio||1)));
  var im=new Image(); im.onload=function(){ if(M.cur===id&&V.origFor!==id) $('vimg').src=im.src; };
  im.src='/api/preview?id='+id+'&s='+side+'&hq=1';
}
function vLoadOrig(){
  var id=M.cur; if(V.origFor===id) return; V.origFor=id;
  var im=new Image(); im.onload=function(){ if(M.cur===id) $('vimg').src=im.src; };
  im.src='/api/preview?id='+id+'&s=0';
}
function vPrefetch(){
  var i=tileIndexOf(M.cur), ids=[];
  [1,2,-1].forEach(function(d){ var t=M.tiles[i+d]; if(t) ids.push(t.p.id); });
  ids.forEach(function(id){ var im=new Image(); im.src='/api/preview?id='+id; });
  if(ids.length) post('/api/view/ahead',{ids:ids}).catch(function(){});
}
function groupOf(p){
  if(!p||!p.grp) return [];
  return M.all.filter(function(x){return x.grp===p.grp;}).sort(mSort('time',false));
}
function vPaint(){
  var p=curP(); if(!p) return;
  var i=tileIndexOf(p.id); if(i>=0) V.lastIdx=i;
  $('vcount').innerHTML=(i>=0?(i+1):'–')+' / '+fmt(M.tiles.length)+' <span>· '+esc(new Date((p.taken||0)*1000).toTimeString().slice(0,8))+'</span>';
  var ch=[]; if(p.grp&&p.best) ch.push('<span class="b">Tốt nhất</span>');
  if(p.sugg===1) ch.push('<span class="s">✦ Đề xuất</span>');
  (p.flags||[]).forEach(function(f){ if(WARN[f]) ch.push('<span class="w">'+WARN[f]+'</span>'); });
  if(p.score!=null) ch.push('<span>Điểm '+Math.round(p.score)+'</span>');
  if(p.rating===-1) ch.push('<span class="w">✕ Đã loại</span>');
  $('vchips').innerHTML=ch.join('');
  var fb=$('fbox'), f=p.focus;
  var hasF=!!(f&&f[0]!=null&&f[0]>=0&&(f[2]||0)>=4);
  fb.classList.toggle('hide',!(V.showFocus&&hasF));
  if(hasF){ fb.style.left=(f[0]*100)+'%'; fb.style.top=(f[1]*100)+'%'; var land=(p.w||1)>=(p.h||1); fb.style.width=land?'':'12%'; fb.style.height=land?'12%':''; fb.style.aspectRatio='1'; }
  $('btnFocus').classList.toggle('on',V.showFocus); $('btnFocus').setAttribute('aria-pressed',String(V.showFocus));
  document.querySelectorAll('#vstars button').forEach(function(b){ b.classList.toggle('on',(p.rating||0)>=+b.dataset.v); });
  var g=groupOf(p);
  $('stripRow').classList.toggle('hide',g.length<2); $('strip').classList.toggle('hide',g.length<2);
  $('strip').innerHTML=g.map(function(x){ return '<button class="sb'+(x.id===p.id?' on':'')+(x.rating===-1?' r':'')+(x.rating>0?' k':'')+'" data-id="'+x.id+'" aria-label="Tấm '+esc(x.name)+'"><img alt="" src="/thumb/'+x.id+'.jpg?v='+(x.tv||0)+'"></button>'; }).join('');
}
function closeView(){
  if(M.split) return;
  V.open=false; clearTimeout(V.timer); $('view').classList.add('hide'); document.body.classList.remove('viewing');
  repaintTiles();
  var i=tileIndexOf(M.cur); if(i>=0){ var g=$('grid'), top=Math.floor(i/G.n)*G.rowH; if(top<g.scrollTop||top>g.scrollTop+g.clientHeight-G.rowH){ g.scrollTop=Math.max(0,top-g.clientHeight/3); drawRows(); } }
}
function vStep(d){ var i=tileIndexOf(M.cur), t;
  if(i>=0) t=M.tiles[i+d];
  else { var L=Math.min(V.lastIdx||0,M.tiles.length); t=d>0?M.tiles[L]:M.tiles[L-1]; }   // tấm đang xem vừa rời bộ lọc
  if(t) openView(t.p.id); else toast(d>0?'Đã tới tấm cuối':'Đây là tấm đầu'); }
function pickInGroup(id){
  var p=M.by[id]; if(!p) return [];
  var ops=[{id:id,from:p.rating||0,to:(p.rating||0)>0?p.rating:1}];
  groupOf(p).forEach(function(x){ if(x.id!==id&&(x.rating||0)===0) ops.push({id:x.id,from:0,to:-1}); });
  return ops;
}
function vKeep(){ var p=curP(); if(!p) return; var id=p.id; vStep(1); rateIds([id],(p.rating||0)>0?p.rating:1).catch(function(){}); }
function vReject(){ var p=curP(); if(!p) return; var id=p.id; vStep(1); rateIds([id],-1).catch(function(){}); }
$('vBack').addEventListener('click',closeView);
$('vPrev').addEventListener('click',function(){ vStep(-1); });
$('vNext').addEventListener('click',function(){ vStep(1); });
$('vKeep').addEventListener('click',vKeep);
$('vRej').addEventListener('click',vReject);
$('btnFocus').addEventListener('click',function(){ V.showFocus=!V.showFocus; lsSet('m.focus',V.showFocus?'1':'0'); vPaint(); });
$('vstars').addEventListener('click',function(e){ var b=e.target.closest('button'); var p=curP(); if(!b||!p) return; var v=+b.dataset.v; rateIds([p.id],(p.rating||0)===v?0:v).catch(function(){}); });
$('strip').addEventListener('click',function(e){ var b=e.target.closest('.sb'); if(b) openView(+b.dataset.id,true); });
$('pickBtn').addEventListener('click',function(){ var p=curP(); if(!p) return; rateOps(pickInGroup(p.id)).catch(function(){}); });
function undoLast(){ if(typeof undoPop==='function') undoPop(); }
$('vUndo').addEventListener('click',undoLast);

/* cử chỉ: 1 ngón kéo/vuốt/chạm, 2 ngón phóng to */
(function(){
  var st=$('vstage'), pts={}, start=null, pinch=null, moved=false, dragX=0, multi=false;
  function rel(e){ var r=st.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  function n(){ return Object.keys(pts).length; }
  st.addEventListener('pointerdown',function(e){
    try{ st.setPointerCapture(e.pointerId); }catch(_){}
    pts[e.pointerId]=rel(e);
    if(n()===1){ start={p:rel(e),z:{scale:M.zoom.scale,tx:M.zoom.tx,ty:M.zoom.ty},t:Date.now()}; moved=false; dragX=0; multi=false; }
    if(n()===2){ var a=Object.values(pts); pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,z:M.zoom}; moved=true; multi=true; dragX=0; $('vmark').style.opacity=0; }
  });
  st.addEventListener('pointermove',function(e){
    if(!(e.pointerId in pts)) return; pts[e.pointerId]=rel(e);
    var f=vFit();
    if(pinch&&n()>=2){ var a=Object.values(pts), d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
      M.zoom=zoomAt(pinch.z,d/pinch.d,(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2,f.vw,f.vh,f.iw,f.ih,f.natW); vApply(); return; }
    if(!start) return;
    var q=pts[e.pointerId], dx=q.x-start.p.x, dy=q.y-start.p.y;
    if(Math.abs(dx)>8||Math.abs(dy)>8) moved=true;
    if(start.z.scale>1.01){ M.zoom={scale:start.z.scale,tx:start.z.tx+dx,ty:start.z.ty+dy}; vApply(); return; }
    if(multi) return;
    if(Math.abs(dx)>Math.abs(dy)){ dragX=dx; $('vwrap').style.transform='translate(-50%,-50%) translateX('+dx+'px) rotate('+(dx/40)+'deg)';
      var mk=$('vmark'); mk.textContent=dx>0?'GIỮ':'LOẠI'; mk.style.color=mk.style.borderColor=dx>0?'var(--acc)':'var(--redtx)'; mk.style.opacity=Math.min(1,Math.max(0,(Math.abs(dx)-40)/90)); }
  });
  function end(e){
    if(!(e.pointerId in pts)) return; var q=pts[e.pointerId]; delete pts[e.pointerId];
    if(multi){   // cử chỉ đã dùng 2 ngón: không bao giờ thành vuốt chấm hay chạm
      pinch=null; $('vmark').style.opacity=0;
      if(n()===1){ var k=Object.keys(pts)[0]; start={p:pts[k],z:{scale:M.zoom.scale,tx:M.zoom.tx,ty:M.zoom.ty},t:Date.now()}; }
      else { start=null; multi=false; }
      vApply(); return;
    }
    if(!start) return; var s0=start; start=null; $('vmark').style.opacity=0;
    if(e.type==='pointercancel'){ dragX=0; vApply(); return; }   // bị huỷ: không chấm, không chạm
    var f=vFit(), TH=Math.min(140,f.vw*0.28);
    if(s0.z.scale<=1.01&&Math.abs(dragX)>TH){ if(dragX>0) vKeep(); else vReject(); vApply(); return; }
    vApply();
    if(moved) return;
    // chạm: phân biệt chạm đúp và chạm mép (chờ 250ms)
    var now=Date.now();
    if(now-V.lastTap<300&&Math.hypot(q.x-V.lastX,q.y-V.lastY)<40){ clearTimeout(V.timer); V.lastTap=0; dbl(q); return; }
    V.lastTap=now; V.lastX=q.x; V.lastY=q.y;
    clearTimeout(V.timer);
    if(M.zoom.scale<=1.01){ var x=q.x; V.timer=setTimeout(function(){ if(x<f.vw/3) vStep(-1); else if(x>f.vw*2/3) vStep(1); },300); }
  }
  function dbl(q){
    var f=vFit(), p=curP()||{}, fc=p.focus;
    if(M.zoom.scale>1.01){ M.zoom={scale:1,tx:0,ty:0}; }
    else if(fc&&fc[0]!=null&&fc[0]>=0&&(fc[2]||0)>=4){ M.zoom=focusZoom(fc,f.vw,f.vh,f.iw,f.ih,f.natW); }
    else { M.zoom=zoomAt({scale:1,tx:0,ty:0},2.5,q.x,q.y,f.vw,f.vh,f.iw,f.ih,f.natW); }
    vApply();
  }
  st.addEventListener('pointerup',end); st.addEventListener('pointercancel',end);
})();

$('gsp').addEventListener('click',function(e){ var t=e.target.closest('.tile'); if(!t||M.selmode) return; openView(+t.dataset.id); });

/* ---------- hoàn tác ---------- */
var UNDO=[];
function undoPush(entry,label){
  UNDO.push(entry); if(UNDO.length>50) UNDO.shift();
  var n=entry.ops?entry.ops.length:(entry.ids||[]).length;
  if(label) toast(label+(n>1?' · '+fmt(n)+' ảnh':''),undoPop);
}
function undoPop(){
  var e=UNDO[UNDO.length-1]; if(!e){ toast('Không còn gì để hoàn tác'); return Promise.resolve(); }
  var done=function(msg){ UNDO.pop(); toast(msg); };
  if(e.t==='rate'){
    var back=[], skip=0;
    e.ops.forEach(function(o){ var p=M.by[o.id]; if(p&&(p.rating||0)===o.to) back.push(o); else skip++; });
    var by={}; back.forEach(function(o){ (by[o.from]=by[o.from]||[]).push(o.id); });
    return Promise.all(Object.keys(by).map(function(r){ return post('/api/rate',{ids:by[r],rating:+r}); })).then(function(){
      back.forEach(function(o){ var p=M.by[o.id]; if(p) p.rating=o.from; }); afterRate();
      done('Đã hoàn tác'+(skip?' · bỏ qua '+skip+' ảnh đã sửa trên máy tính':''));
    },function(){ toast('Không hoàn tác được'); });
  }
  var url=e.t==='cull'?'/api/cull/undo':'/api/suggest/rate/undo';
  return post(url,{batch:e.batch}).then(function(){
    (e.ids||[]).forEach(function(id){ var p=M.by[id]; if(p&&(e.t==='cull'?p.rating===-1:p.rating===1)) p.rating=0; });
    afterRate(); done('Đã hoàn tác'); mSync(true);
  },function(){ toast('Không hoàn tác được'); });
}

/* ---------- chọn nhiều (chạm giữ) ---------- */
function selCount(){ return Object.keys(M.sel).length; }
function selPaint(){ document.body.classList.toggle('selmode',M.selmode); $('selTitle').textContent='Đã chọn '+fmt(selCount())+' tấm'; repaintTiles(); }
function selToggleTile(id){ var i=tileIndexOf(id); if(i<0) return; var t=M.tiles[i], on=isSel(t);
  t.ids.forEach(function(x){ if(on) delete M.sel[x]; else M.sel[x]=1; }); selPaint(); }
function selExit(){ M.selmode=false; M.sel={}; selPaint(); }
(function(){
  var lp=null, sx=0, sy=0, fired=false;
  $('gsp').addEventListener('pointerdown',function(e){ var t=e.target.closest('.tile'); if(!t) return; sx=e.clientX; sy=e.clientY; fired=false;
    clearTimeout(lp); lp=setTimeout(function(){ fired=true; if(!M.selmode){ M.selmode=true; M.sel={}; } selToggleTile(+t.dataset.id); if(navigator.vibrate) navigator.vibrate(15); },450); });
  $('gsp').addEventListener('pointermove',function(e){ if(Math.hypot(e.clientX-sx,e.clientY-sy)>10) clearTimeout(lp); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ $('gsp').addEventListener(ev,function(){ clearTimeout(lp); }); });
  $('gsp').addEventListener('click',function(e){ var t=e.target.closest('.tile'); if(!t) return;
    if(fired){ fired=false; e.stopImmediatePropagation(); return; }
    if(M.selmode){ e.stopImmediatePropagation(); selToggleTile(+t.dataset.id); } },true);
  $('gsp').addEventListener('contextmenu',function(e){ if(e.target.closest('.tile')) e.preventDefault(); });
})();
$('selCancel').addEventListener('click',selExit);
$('selBtns').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
  var ids=Object.keys(M.sel).map(Number); if(!ids.length){ toast('Chưa chọn tấm nào'); return; }
  var r=+b.dataset.r; selExit(); rateIds(ids,r,r>0?'★'+r:(r<0?'Loại':'Bỏ chấm')).catch(function(){}); });

/* ---------- bảng công cụ ⋯ ---------- */
var PRE={nhe:{blur_ratio:.35,dark:.14,bright:.88,ear:.15,dup_hamming:6,dup_seconds:10},vua:{blur_ratio:.45,dark:.2,bright:.8,ear:.19,dup_hamming:10,dup_seconds:20},manh:{blur_ratio:.6,dark:.26,bright:.74,ear:.22,dup_hamming:14,dup_seconds:40}};
var SH={online:true,settings:{},level:null};
var KL=[['blur','Ảnh mờ',0],['dark','Ảnh tối',1],['bright','Cháy sáng',1],['eyes','Nhắm mắt',1],['dup','Ảnh trùng',0]];
function sheetOpen(){
  $('sheetWrap').classList.remove('hide');
  api('/api/status').then(function(st){ SH.online=st.online!==false; SH.settings=st.settings||{}; paintSheet(); }).catch(function(){ paintSheet(); });
  var last=lsGet('m.suggN',''); $('tN').value=last||(Math.max(1,Math.round(M.all.length*0.12))+'');
  api('/api/taste').then(paintTaste).catch(function(){ $('tInfo').textContent=''; });
  $('sSort').value=M.sort; $('sRev').checked=M.rev;
  paintSheet();
}
function sheetClose(){ $('sheetWrap').classList.add('hide'); }
function levelOf(st){ for(var k in PRE){ var ok=true; for(var f in PRE[k]) if(st[f]==null||Math.abs(st[f]-PRE[k][f])>1e-6) ok=false; if(ok) return k; } return null; }
function cullSel(){ return KL.filter(function(k){ var c=document.getElementById('k_'+k[0]); return c&&c.checked&&!c.disabled; }).map(function(k){return k[0];}); }
function paintSheet(){
  if(!$('kchips').children.length) $('kchips').innerHTML=KL.map(function(k){ return '<label><input type="checkbox" id="k_'+k[0]+'" checked> '+k[1]+'</label>'; }).join('');
  KL.forEach(function(k){ var c=$('k_'+k[0]); c.disabled=!!(k[2]&&!SH.online); });
  var lv=levelOf(SH.settings)||SH.level||'vua';
  document.querySelectorAll('#lv button').forEach(function(b){ b.setAttribute('aria-pressed',String(b.dataset.l===lv)); });
  var c=cullCandidates(M.all,cullSel()).length, todo=M.all.filter(function(p){return (p.rating||0)===0;}).length;
  $('cullGo').textContent='Đánh dấu loại '+fmt(c)+' / '+fmt(todo)+' ảnh chưa chấm'; $('cullGo').disabled=!c;
  var hasS=M.all.some(function(p){return p.sugg===1;}); $('tMore').classList.toggle('hide',!hasS);
}
function paintTaste(t){
  t=t||{}; var s='Đang dùng: ';
  if(t.source==='personal') s+='gu của bạn (học từ '+fmt(t.n_rolls)+' đám'+(t.agree!=null?', trùng khớp '+Math.round(t.agree*100)+'%':'')+')';
  else if(t.source==='default') s+='gu mặc định'; else s+='gu cơ bản (chưa học)';
  $('tInfo').textContent=s;
}
$('btnTools').addEventListener('click',sheetOpen);
$('wCull').addEventListener('click',sheetOpen);
$('wSugg').addEventListener('click',function(){ sheetOpen(); setTimeout(function(){ $('tN').focus(); },50); });
$('sheetBack').addEventListener('click',sheetClose);
(function(){ var sh=$('sheet'), y0=null, dy=0;   // vuốt xuống để đóng (chỉ khi bảng đang cuộn ở đầu)
  sh.addEventListener('pointerdown',function(e){ if(e.target.closest('input,select,label')) return; if(sh.scrollTop>0) return; y0=e.clientY; dy=0; });
  sh.addEventListener('pointermove',function(e){ if(y0==null) return; dy=Math.max(0,e.clientY-y0); sh.style.transform=dy?'translateY('+dy+'px)':''; });
  function up(){ if(y0==null) return; y0=null; sh.style.transform=''; if(dy>80) sheetClose(); dy=0; }
  sh.addEventListener('pointerup',up); sh.addEventListener('pointercancel',function(){ y0=null; dy=0; sh.style.transform=''; });
})();
$('kchips').addEventListener('change',paintSheet);
$('lv').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; SH.level=b.dataset.l;
  post('/api/settings',PRE[b.dataset.l]).then(function(r){ SH.settings=(r&&r.settings)||PRE[b.dataset.l]; return mSync(true); }).then(paintSheet).catch(function(){ toast('Không đổi được mức lọc'); }); paintSheet(); });
$('cullGo').addEventListener('click',function(){
  var ids=cullCandidates(M.all,cullSel()).map(function(p){return p.id;}); if(!ids.length) return;
  $('cullGo').disabled=true;
  post('/api/cull/apply',{ids:ids}).then(function(r){
    ids.forEach(function(id){ var p=M.by[id]; if(p&&(p.rating||0)===0) p.rating=-1; }); afterRate(); sheetClose();
    undoPush({t:'cull',batch:r.batch,ids:ids},'Đã đánh dấu loại'); mSync(true);
  },function(){ toast('Không lọc được'); paintSheet(); });
});
function parseN(v){ v=String(v||'').trim().replace(/\./g,'').replace(',','.');
  var m=v.match(/^(\d+(?:\.\d+)?)\s*%$/); if(m) return Math.max(1,Math.round(M.all.length*(+m[1])/100));
  var n=parseInt(v,10); return n>0?n:0; }
$('tGo').addEventListener('click',function(){
  var n=parseN($('tN').value); if(!n){ toast('Gõ số tấm, ví dụ 400 hoặc 15%'); return; }
  lsSet('m.suggN',$('tN').value.trim()); $('tGo').disabled=true;
  post('/api/suggest',{n:n}).then(function(r){
    if(r&&r.error){ toast(r.error); return; }
    sheetClose(); M.filter='sugg';
    return mSync(true).then(function(){ M.filter='sugg'; $('grid').scrollTop=0; mRender();
      toast(r.note&&/nhiều hơn/.test(r.note)?r.note:('Đã đề xuất '+fmt(r.n)+' tấm'+(r.note?' — '+r.note:'')),null,3000); });
  },function(){ toast('Không đề xuất được'); }).then(function(){ $('tGo').disabled=false; });
});
$('tRate').addEventListener('click',function(){
  post('/api/suggest/rate',{}).then(function(r){ (r.ids||[]).forEach(function(id){ var p=M.by[id]; if(p&&(p.rating||0)===0) p.rating=1; });
    afterRate(); sheetClose(); if(r.n) undoPush({t:'suggrate',batch:r.batch,ids:r.ids||[]},'Đã chấm 1 sao cho đề xuất'); else toast('Các ảnh đề xuất đều đã có sao'); },
    function(){ toast('Không chấm được'); });
});
$('tClear').addEventListener('click',function(){ post('/api/suggest/clear',{}).then(function(){ M.all.forEach(function(p){p.sugg=0;}); sheetClose(); if(M.filter==='sugg') M.filter='all'; mRender(); },function(){ toast('Không bỏ được đề xuất'); }); });
$('sSort').addEventListener('change',function(){ M.sort=$('sSort').value; lsSet('m.sort',M.sort); mRender(); });
$('sRev').addEventListener('change',function(){ M.rev=$('sRev').checked; lsSet('m.rev',M.rev?'1':'0'); mRender(); });
/* ---------- đồng bộ với máy tính ---------- */
var syncing=null, syncAgain=null;
function tilesKey(){ return M.tiles.map(function(t){return t.p.id+':'+t.n;}).join(','); }
function mSync(force){
  if(syncing){   // đang đồng bộ: lần ép được xếp hàng chạy lại, không bị bỏ
    if(!force) return syncing;
    if(!syncAgain) syncAgain=syncing.then(function(){ syncAgain=null; return mSync(true); });
    return syncAgain;
  }
  syncing=api('/api/photos/ver').then(function(v){
    if(!force&&M.ver!==null&&v.ver===M.ver) return;
    M.ver=v.ver;
    return Promise.all([api('/api/photos'),api('/api/people').catch(function(){return M.people;})]).then(function(r){
      var before=tilesKey(), f0=M.filter;
      setData(r[0]); M.people=r[1]||[]; recompute();
      if(tilesKey()===before&&before){ paintTally(); paintChips(); if(M.filter!==f0){ mRender(true); } else repaintTiles(); }   // chỉ vá các ô
      else mRender(true); if(M.split&&(!M.cur||!M.by[M.cur])&&M.tiles.length) openView(M.tiles[0].p.id); else if(V.open&&M.by[M.cur]) vPaint();
    });
  }).catch(function(e){ if(e&&e.code===402) err402(); }).then(function(){ syncing=null; });
  return syncing;
}
setInterval(function(){ if(!document.hidden) mSync(); },10000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) mSync(); });

/* ---------- thư mục ---------- */
function showMsg(t){ $('msgText').textContent=t; $('msg').classList.remove('hide'); }
function hideMsg(){ $('msg').classList.add('hide'); }
function err402(){ showMsg('Chưa kích hoạt key trên máy tính. Hãy mở app trên PC và nhập key trước.'); }
$('btnFold').addEventListener('click',openFolders);
$('foldClose').addEventListener('click',function(){ $('folders').classList.add('hide'); });
function openFolders(){
  $('folders').classList.remove('hide');
  $('foldList').innerHTML='<div class="center">Đang tải…</div>';
  api('/api/catalog').then(function(list){
    if(!list.length){ $('foldList').innerHTML='<div class="center">Chưa có thư mục nào trong Catalog.<br>Hãy mở một thư mục trên máy tính trước.</div>'; return; }
    $('foldList').innerHTML='';
    list.forEach(function(c){
      var d=document.createElement('button'); d.className='fold';
      d.innerHTML='<div class="n"><b></b><span></span></div><div class="m">'+fmt(c.n)+' ảnh<br>★'+fmt(c.stars)+' · ✕'+fmt(c.rej)+'</div>';
      d.querySelector('b').textContent=c.name||c.root;
      d.querySelector('.n span').textContent=c.missing?'(không tìm thấy)':c.root;
      d.addEventListener('click',function(){ chooseFolder(c); });
      $('foldList').appendChild(d);
    });
  }).catch(function(e){ if(e&&e.code===402) err402(); });
}
function chooseFolder(c){
  if(c.missing){ toast('Ổ/thư mục này hiện không truy cập được'); return; }
  $('foldHint').textContent='Đang mở '+(c.name||c.root)+' …';
  post('/api/open',{path:c.root,recursive:c.recursive}).then(function(){
    $('folders').classList.add('hide'); waitFolder();
  }).catch(function(){ toast('Không mở được thư mục'); });
}
function waitFolder(){
  showMsg('Đang nạp ảnh từ máy tính…'); var n=0;
  (function poll(){
    api('/api/photos').then(function(ph){
      if(ph.length){ hideMsg(); M.cur=null; setData(ph); loadName(); M.ver=null; mSync(true); return; }
      if(n++<40) setTimeout(poll,700); else showMsg('Chưa thấy ảnh. Thử lại trên máy tính.');
    }).catch(function(e){ if(e&&e.code===402) err402(); else if(n++<40) setTimeout(poll,700); });
  })();
}
function loadName(){ api('/api/status').then(function(s){
  var root=(s&&s.root)||''; if(root){ var parts=root.replace(/[\\\/]+$/,'').split(/[\\\/]/); $('fname').textContent=parts[parts.length-1]||root; } }).catch(function(){}); }

/* ---------- khởi động ---------- */
function start(){
  applySplit(); paintOpts(); loadName();
  mSync(true).then(function(){ if(!M.all.length) layoutGrid(); });
}
</script>

start();
